version: '3'

# Cloudflare deploy lifecycle.
# Config: cf-deploy.json. Adding a worker = one entry there.
# All tasks delegate to scripts/cf-deploy.ts.

vars:
  APP_VERSION:
    sh: cd {{.ROOT_DIR}} && bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.ROOT_DIR}}/'+JSON.parse(require('fs').readFileSync('{{.ROOT_DIR}}/cf-deploy.json','utf8')).version.source,'utf8')).version||'0.0.0')" 2>/dev/null || echo "0.0.0"

tasks:

  # Single target (use TARGET=<name> to pick worker, default: first)
  upload:
    desc: Upload worker version
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts upload {{if .TARGET}}--target {{.TARGET}}{{end}}

  promote:
    desc: Promote latest version to production
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts promote {{if .TARGET}}--target {{.TARGET}}{{end}}

  rollback:
    desc: Roll back to previous version
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts rollback {{if .TARGET}}--target {{.TARGET}}{{end}}

  smoke:
    desc: Smoke test deployed URL
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts smoke {{if .TARGET}}--target {{.TARGET}}{{end}}

  release:
    desc: Stamp release alias
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts release {{if .TARGET}}--target {{.TARGET}}{{end}}

  # All workers
  "upload:all":
    desc: Upload all workers
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts foreach upload

  "promote:all":
    desc: Promote all workers
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts foreach promote

  "smoke:all":
    desc: Smoke test all workers
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts foreach smoke

  "release:all":
    desc: Release all workers
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts foreach release

  # Full lifecycle
  "deploy:all":
    desc: "upload → versions → smoke → promote → release → tag"
    cmds:
      - task: upload:all
      - task: versions
      - task: smoke:all
      - task: promote:all
      - task: release:all
      - task: versions
      - task: deploy:tag

  "deploy:tag":
    desc: Create git tag + GitHub release
    deps: [":gh:deps:install"]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        VERSION="v{{.APP_VERSION}}"
        if git rev-parse "$VERSION" >/dev/null 2>&1; then
          echo "Tag $VERSION already exists"
        else
          git tag "$VERSION"
          echo "Created tag $VERSION"
        fi
        if git remote get-url origin >/dev/null 2>&1; then
          git push origin "$VERSION" 2>/dev/null || echo "Tag $VERSION already pushed"
        fi
      - |
        VERSION="v{{.APP_VERSION}}"
        GH={{.BIN_DIR}}/gh
        if $GH release view "$VERSION" >/dev/null 2>&1; then
          echo "Release $VERSION already exists"
        else
          $GH release create "$VERSION" --title "$VERSION" --generate-notes
          echo "Created GitHub release $VERSION"
        fi

  versions:
    desc: Generate cf-versions.json
    dir: '{{.ROOT_DIR}}'
    cmd: bun scripts/cf-deploy.ts versions
