version: '3'

# ============================================================================
# Reusable Cloudflare deploy lifecycle (Workers).
#
# All config is read from cf-deploy.json via scripts/cf-deploy.ts.
# The parent include only needs to pass ROOT_DIR.
#
# Task namespaces:
#   cf:worker:*  — Worker versioned deploy lifecycle
#   cf:versions  — Version manifest
#   cf:d1:*      — D1 databases (account resource)
#   cf:r2:*      — R2 storage (account resource)
#   cf:whoami    — Account info
#
# Pattern: all wrangler tasks depend on _ensure:wrangler (idempotent install).
# Uses `bun x wrangler` (local install), never `bunx` (downloads temp copy).
#
# Required var: ROOT_DIR (passed by parent include)
# Optional vars: DB_NAME, BUCKET_NAME (for d1/r2 tasks)
# ============================================================================

vars:
  # All vars resolved from cf-deploy.json — single source of truth
  GITHUB_REPO:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config github
  SCHEMA_FILE:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config version.source)"
  WORKER_NAME:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.name
  WORKER_DOMAIN:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.domain
  WORKER_DIR:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.dir)"
  WORKER_PRODUCTION_URL:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.production
  WORKER_OUTPUT_FILE:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config output)"
  DOCS_NAME:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config docs.name 2>/dev/null || echo ""
  DOCS_PRODUCTION_URL:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config docs.production 2>/dev/null || echo ""
  APP_VERSION:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.SCHEMA_FILE}}','utf8')).version)" 2>/dev/null || echo "0.0.0"
  VERSION_SLUG:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.SCHEMA_FILE}}','utf8')).version.replaceAll('.','-'))" 2>/dev/null || echo "0-0-0"

tasks:

  # ==========================================================================
  # Internal: shared dependency — ensures wrangler is installed in WORKER_DIR
  # All tasks that call `bun x wrangler` must depend on this.
  # ==========================================================================

  "_ensure:wrangler":
    internal: true
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun install --silent
    status:
      - test -d {{.WORKER_DIR}}/node_modules/wrangler

  # ==========================================================================
  # Worker: Versioned Deploy Lifecycle (delegates to cf-deploy.ts)
  # ==========================================================================

  "worker:upload":
    desc: "Upload new Worker version (does NOT deploy to production)"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts upload

  "worker:promote":
    desc: Deploy latest uploaded version to 100% traffic
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts promote

  "worker:canary":
    desc: Deploy with gradual traffic split (interactive)
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler versions deploy

  "worker:rollback":
    desc: Roll back to previous version
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts rollback

  "worker:smoke":
    desc: Smoke test a deployed URL (health + index + optional extra checks)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts smoke

  "worker:preview":
    desc: "Upload PR preview version"
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    vars:
      PR_NUMBER: '{{.PR_NUMBER | default "preview"}}'
    cmds:
      - 'bun x wrangler versions upload --tag "pr-{{.PR_NUMBER}}" --message "PR #{{.PR_NUMBER}}" --preview-alias "pr-{{.PR_NUMBER}}"'
      - 'echo "Preview: https://pr-{{.PR_NUMBER}}-{{.WORKER_NAME}}.{{.WORKER_DOMAIN}}"'

  # ==========================================================================
  # Worker: Simple Deploy (for projects not using versioned flow)
  # ==========================================================================

  "worker:deploy":
    desc: Deploy worker to Cloudflare (simple, non-versioned)
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler deploy

  "worker:deploy:staging":
    desc: Deploy to staging environment
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler deploy --env staging

  # ==========================================================================
  # Docs Worker: Versioned Deploy Lifecycle (delegates to cf-deploy.ts --target docs)
  # ==========================================================================

  "docs:upload":
    desc: "Upload new docs Worker version (does NOT deploy to production)"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts upload --target docs

  "docs:promote":
    desc: Deploy latest docs version to 100% traffic
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts promote --target docs

  "docs:rollback":
    desc: Roll back to previous docs Worker version
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts rollback --target docs

  "docs:smoke":
    desc: Smoke test the docs Worker
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts smoke --target docs

  # ==========================================================================
  # All Workers: Top-level tasks (deploy everything)
  # ==========================================================================

  "upload:all":
    desc: Upload all workers (truck + docs)
    cmds:
      - task: worker:upload
      - task: docs:upload

  "promote:all":
    desc: Promote all workers to production
    cmds:
      - task: worker:promote
      - task: docs:promote

  "smoke:all":
    desc: Smoke test all workers
    cmds:
      - task: worker:smoke
      - task: docs:smoke

  "rollback:all":
    desc: Roll back all workers
    cmds:
      - task: worker:rollback
      - task: docs:rollback

  "deploy:all":
    desc: "Full deploy lifecycle: upload → smoke → promote → versions → tag (all workers)"
    cmds:
      - task: upload:all
      - task: smoke:all
      - task: promote:all
      - task: versions
      - task: deploy:tag

  "deploy:tag":
    desc: "Create git tag v{{.APP_VERSION}} + GitHub release with release notes (idempotent)"
    deps: [":gh:deps:install"]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        VERSION="v{{.APP_VERSION}}"
        if git rev-parse "$VERSION" >/dev/null 2>&1; then
          echo "Tag $VERSION already exists"
        else
          git tag "$VERSION"
          echo "Created tag $VERSION"
        fi
        if git remote get-url origin >/dev/null 2>&1; then
          git push origin "$VERSION" 2>/dev/null || echo "Tag $VERSION already pushed"
        fi
      - |
        VERSION="v{{.APP_VERSION}}"
        GH={{.BIN_DIR}}/gh
        if $GH release view "$VERSION" >/dev/null 2>&1; then
          echo "Release $VERSION already exists"
        else
          BODY=$(bun scripts/cf-deploy.ts release-notes)
          $GH release create "$VERSION" --title "$VERSION" --notes "$BODY"
          echo "Created GitHub release $VERSION"
        fi

  # ==========================================================================
  # Versions & Status
  # ==========================================================================

  versions:
    desc: Generate cf-versions.json from Worker deployments
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts versions

  status:
    desc: Show current deployment info
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts status

  list:
    desc: List all versions and previews
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts list

  release-notes:
    desc: Generate GitHub release markdown from manifest
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts release-notes

  readme-urls:
    desc: Generate/update README URL table from config
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts readme-urls

  verify:
    desc: Audit codebase for stale hardcoded values (should read from cf-deploy.json)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts verify

  # Keep individual wrangler commands for direct access
  "worker:versions:list":
    desc: List recent Worker versions (tags, dates)
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler versions list

  "worker:status":
    desc: Show current Worker deployment (traffic split)
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler deployments list

  "worker:secret:list":
    desc: List Worker secrets
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler secret list

  "worker:tail":
    desc: Tail live Worker logs
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler tail

  # ==========================================================================
  # D1 Database (account resource)
  # ==========================================================================

  "d1:list":
    desc: List D1 databases
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler d1 list

  "d1:create":
    desc: Create the project D1 database
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler d1 create {{.DB_NAME}}
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:tables":
    desc: List tables in local D1
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler d1 execute {{.DB_NAME}} --local --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:tables:remote":
    desc: List tables in remote D1
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler d1 execute {{.DB_NAME}} --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:execute":
    desc: Execute SQL against local D1
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler d1 execute {{.DB_NAME}} --local --command "{{.SQL}}"
    requires:
      vars: [SQL]
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:execute:remote":
    desc: Execute SQL against remote D1
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler d1 execute {{.DB_NAME}} --remote --command "{{.SQL}}"
    requires:
      vars: [SQL]
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:migrations:create":
    desc: Create a new D1 migration
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler d1 migrations create {{.DB_NAME}} "{{.NAME}}"
    requires:
      vars: [NAME]
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:migrations:apply":
    desc: Apply D1 migrations locally (idempotent)
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler d1 migrations apply {{.DB_NAME}} --local
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:migrations:apply:remote":
    desc: Apply D1 migrations to remote (idempotent)
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler d1 migrations apply {{.DB_NAME}} --remote
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  # ==========================================================================
  # R2 Storage (account resource)
  # ==========================================================================

  "r2:list":
    desc: List R2 buckets
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler r2 bucket list

  "r2:create":
    desc: Create the project R2 bucket
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler r2 bucket create {{.BUCKET_NAME}}
    preconditions:
      - sh: '[ -n "{{.BUCKET_NAME}}" ]'
        msg: "BUCKET_NAME is required"

  "r2:objects":
    desc: List objects in the project R2 bucket
    deps: ["_ensure:wrangler"]
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun x wrangler r2 object list {{.BUCKET_NAME}}
    preconditions:
      - sh: '[ -n "{{.BUCKET_NAME}}" ]'
        msg: "BUCKET_NAME is required"

  # ==========================================================================
  # Account
  # ==========================================================================

  debug:
    desc: Show all Cloudflare vars and env (verify config is correct)
    silent: true
    cmds:
      - |
        echo "=== Shared ==="
        echo "  ROOT_DIR:       {{.ROOT_DIR}}"
        echo "  GITHUB_REPO:    {{.GITHUB_REPO}}"
        echo "  SCHEMA_FILE:    {{.SCHEMA_FILE}}"
        echo "  APP_VERSION:    {{.APP_VERSION}}"
        echo "  VERSION_SLUG:   {{.VERSION_SLUG}}"
        echo ""
        echo "=== Worker ==="
        echo "  WORKER_DIR:            {{.WORKER_DIR}}"
        echo "  WORKER_NAME:           {{.WORKER_NAME}}"
        echo "  WORKER_DOMAIN:         {{.WORKER_DOMAIN}}"
        echo "  WORKER_PRODUCTION_URL: {{.WORKER_PRODUCTION_URL}}"
        echo "  WORKER_OUTPUT_FILE:    {{.WORKER_OUTPUT_FILE}}"
        echo ""
        echo "=== Docs ==="
        echo "  DOCS_NAME:             {{.DOCS_NAME}}"
        echo "  DOCS_PRODUCTION_URL:   {{.DOCS_PRODUCTION_URL}}"
        echo ""
        echo "=== Auth ==="
        echo "  CLOUDFLARE_API_TOKEN:      ${CLOUDFLARE_API_TOKEN:+set (${#CLOUDFLARE_API_TOKEN} chars)}"
        echo "  CLOUDFLARE_API_TOKEN_NAME: ${CLOUDFLARE_API_TOKEN_NAME:-<not set>}"

  whoami:
    desc: Show current Cloudflare auth info
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts whoami
