version: '3'

# ============================================================================
# Reusable Cloudflare deploy lifecycle (Workers + Pages).
#
# All config is read from cf-deploy.json via scripts/cf-deploy.ts.
# The parent include only needs to pass ROOT_DIR.
#
# Task namespaces:
#   cf:worker:*  — Worker versioned deploy lifecycle
#   cf:pages:*   — Pages versioned deploy lifecycle
#   cf:versions  — Unified manifest (Worker + Pages)
#   cf:d1:*      — D1 databases (account resource)
#   cf:r2:*      — R2 storage (account resource)
#   cf:whoami    — Account info
#
# Required var: ROOT_DIR (passed by parent include)
# Optional vars: DB_NAME, BUCKET_NAME (for d1/r2 tasks)
# ============================================================================

vars:
  # All vars resolved from cf-deploy.json — single source of truth
  GITHUB_REPO:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config github
  SCHEMA_FILE:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config version.source)"
  WORKER_NAME:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.name
  WORKER_DOMAIN:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.domain
  WORKER_DIR:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.dir)"
  WORKER_PRODUCTION_URL:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.production
  WORKER_OUTPUT_FILE:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config output)"
  PAGES_PROJECT:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config pages.project
  PAGES_DOMAIN:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config pages.domain
  PAGES_DIR:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config pages.dir)"
  PAGES_PRODUCTION_URL:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config pages.production
  APP_VERSION:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.SCHEMA_FILE}}','utf8')).version)" 2>/dev/null || echo "0.0.0"
  VERSION_SLUG:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.SCHEMA_FILE}}','utf8')).version.replaceAll('.','-'))" 2>/dev/null || echo "0-0-0"

tasks:

  # ==========================================================================
  # Worker: Versioned Deploy Lifecycle (delegates to cf-deploy.ts)
  # ==========================================================================

  "worker:upload":
    desc: "Upload new Worker version (does NOT deploy to production)"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts upload

  "worker:promote":
    desc: Deploy latest uploaded version to 100% traffic
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts promote

  "worker:canary":
    desc: Deploy with gradual traffic split (interactive)
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler versions deploy

  "worker:rollback":
    desc: Roll back to previous version
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts rollback

  "worker:smoke":
    desc: Smoke test a deployed URL (health + index + optional extra checks)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts smoke

  "worker:preview":
    desc: "Upload PR preview version"
    dir: '{{.WORKER_DIR}}'
    vars:
      PR_NUMBER: '{{.PR_NUMBER | default "preview"}}'
    cmds:
      - 'bun install && bunx wrangler versions upload --tag "pr-{{.PR_NUMBER}}" --message "PR #{{.PR_NUMBER}}" --preview-alias "pr-{{.PR_NUMBER}}"'
      - 'echo "Preview: https://pr-{{.PR_NUMBER}}-{{.WORKER_NAME}}.{{.WORKER_DOMAIN}}"'

  # ==========================================================================
  # Worker: Simple Deploy (for projects not using versioned flow)
  # ==========================================================================

  "worker:deploy":
    desc: Deploy worker to Cloudflare (simple, non-versioned)
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bun install && bunx wrangler deploy

  "worker:deploy:staging":
    desc: Deploy to staging environment
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler deploy --env staging

  # ==========================================================================
  # Versions & Status (unified Worker + Pages)
  # ==========================================================================

  versions:
    desc: Generate unified cf-versions.json (Worker + Pages)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts versions

  status:
    desc: Show current deployment info
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts status

  list:
    desc: List all versions and previews (Worker + Pages)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts list

  release-notes:
    desc: Generate GitHub release markdown from manifest
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts release-notes

  readme-urls:
    desc: Generate/update README URL table from config
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts readme-urls

  verify:
    desc: Audit codebase for stale hardcoded values (should read from cf-deploy.json)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts verify

  # Keep individual wrangler commands for direct access
  "worker:versions:list":
    desc: List recent Worker versions (tags, dates)
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler versions list

  "worker:status":
    desc: Show current Worker deployment (traffic split)
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler deployments list

  "worker:secret:list":
    desc: List Worker secrets
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler secret list

  "worker:tail":
    desc: Tail live Worker logs
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler tail

  # ==========================================================================
  # Pages: Versioned Deploy Lifecycle
  # ==========================================================================

  # Internal helper — all Pages deploys go through here
  "pages:_deploy":
    internal: true
    dir: '{{.PAGES_DIR}}'
    preconditions:
      - sh: test -d {{.PAGES_DIR}}/.vitepress/dist
        msg: "No build found — run task vitepress:build first"
    cmds:
      - bunx wrangler pages deploy .vitepress/dist --project-name={{.PAGES_PROJECT}} --branch {{.BRANCH}} --commit-dirty=true

  "pages:upload":
    desc: "Upload versioned Pages deploy (v{{.VERSION_SLUG}}.{{.PAGES_DOMAIN}}) — does NOT update production"
    cmds:
      - task: "pages:_deploy"
        vars: { BRANCH: 'v{{.VERSION_SLUG}}' }
      - task: "versions"
      - 'echo "Uploaded v{{.APP_VERSION}} → https://v{{.VERSION_SLUG}}.{{.PAGES_DOMAIN}}"'
      - 'echo "To promote to production: task cf:pages:promote"'

  "pages:promote":
    desc: Deploy latest Pages build to production (updates custom domain)
    cmds:
      - task: "pages:_deploy"
        vars: { BRANCH: 'main' }
      - 'echo "Promoted to production → {{.PAGES_PRODUCTION_URL}}"'

  "pages:deploy":
    desc: "Deploy Pages (upload v{{.VERSION_SLUG}} + promote to production)"
    cmds:
      - task: "pages:upload"
      - task: "pages:promote"
      - 'echo "Deployed v{{.APP_VERSION}} → {{.PAGES_PRODUCTION_URL}}"'

  "pages:preview":
    desc: "Upload PR preview Pages deploy"
    vars:
      PR_NUMBER: '{{.PR_NUMBER | default "preview"}}'
    cmds:
      - task: "pages:_deploy"
        vars: { BRANCH: 'pr-{{.PR_NUMBER}}' }
      - 'echo "Preview → https://pr-{{.PR_NUMBER}}.{{.PAGES_DOMAIN}}"'

  "pages:smoke":
    desc: Smoke test a deployed Pages URL
    vars:
      SMOKE_URL: '{{.SMOKE_URL | default .PAGES_PRODUCTION_URL}}'
    cmds:
      - |
        URL="{{.SMOKE_URL}}"
        echo "Smoke testing: $URL"
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
        SIZE=$(curl -s -o /dev/null -w "%{size_download}" "$URL/")
        if [ "$STATUS" = "200" ]; then
          echo "  index:  OK (HTTP ${STATUS}, ${SIZE} bytes)"
        else
          echo "  FAIL:   HTTP ${STATUS}"
          exit 1
        fi
        LLMS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/llms.txt")
        echo "  llms:   OK (HTTP ${LLMS_STATUS})"
        echo ""
        echo "PASS: $URL"

  "pages:versions:list":
    desc: List recent Pages deployments
    cmds:
      - bunx wrangler pages deployment list --project-name={{.PAGES_PROJECT}}

  # ==========================================================================
  # D1 Database (account resource)
  # ==========================================================================

  "d1:list":
    desc: List D1 databases
    cmds:
      - bunx wrangler d1 list

  "d1:create":
    desc: Create the project D1 database
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler d1 create {{.DB_NAME}}
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:tables":
    desc: List tables in local D1
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler d1 execute {{.DB_NAME}} --local --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:tables:remote":
    desc: List tables in remote D1
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler d1 execute {{.DB_NAME}} --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:execute":
    desc: Execute SQL against local D1
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler d1 execute {{.DB_NAME}} --local --command "{{.SQL}}"
    requires:
      vars: [SQL]
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:execute:remote":
    desc: Execute SQL against remote D1
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler d1 execute {{.DB_NAME}} --remote --command "{{.SQL}}"
    requires:
      vars: [SQL]
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:migrations:create":
    desc: Create a new D1 migration
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler d1 migrations create {{.DB_NAME}} "{{.NAME}}"
    requires:
      vars: [NAME]
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:migrations:apply":
    desc: Apply D1 migrations locally (idempotent)
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler d1 migrations apply {{.DB_NAME}} --local
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:migrations:apply:remote":
    desc: Apply D1 migrations to remote (idempotent)
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler d1 migrations apply {{.DB_NAME}} --remote
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  # ==========================================================================
  # R2 Storage (account resource)
  # ==========================================================================

  "r2:list":
    desc: List R2 buckets
    cmds:
      - bunx wrangler r2 bucket list

  "r2:create":
    desc: Create the project R2 bucket
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler r2 bucket create {{.BUCKET_NAME}}
    preconditions:
      - sh: '[ -n "{{.BUCKET_NAME}}" ]'
        msg: "BUCKET_NAME is required"

  "r2:objects":
    desc: List objects in the project R2 bucket
    dir: '{{.WORKER_DIR}}'
    cmds:
      - bunx wrangler r2 object list {{.BUCKET_NAME}}
    preconditions:
      - sh: '[ -n "{{.BUCKET_NAME}}" ]'
        msg: "BUCKET_NAME is required"

  # ==========================================================================
  # Account
  # ==========================================================================

  debug:
    desc: Show all Cloudflare vars and env (verify config is correct)
    silent: true
    cmds:
      - |
        echo "=== Shared ==="
        echo "  ROOT_DIR:       {{.ROOT_DIR}}"
        echo "  GITHUB_REPO:    {{.GITHUB_REPO}}"
        echo "  SCHEMA_FILE:    {{.SCHEMA_FILE}}"
        echo "  APP_VERSION:    {{.APP_VERSION}}"
        echo "  VERSION_SLUG:   {{.VERSION_SLUG}}"
        echo ""
        echo "=== Worker ==="
        echo "  WORKER_DIR:            {{.WORKER_DIR}}"
        echo "  WORKER_NAME:           {{.WORKER_NAME}}"
        echo "  WORKER_DOMAIN:         {{.WORKER_DOMAIN}}"
        echo "  WORKER_PRODUCTION_URL: {{.WORKER_PRODUCTION_URL}}"
        echo "  WORKER_OUTPUT_FILE:    {{.WORKER_OUTPUT_FILE}}"
        echo ""
        echo "=== Pages ==="
        echo "  PAGES_DIR:             {{.PAGES_DIR}}"
        echo "  PAGES_PROJECT:         {{.PAGES_PROJECT}}"
        echo "  PAGES_DOMAIN:          {{.PAGES_DOMAIN}}"
        echo "  PAGES_PRODUCTION_URL:  {{.PAGES_PRODUCTION_URL}}"
        echo ""
        echo "=== Auth ==="
        echo "  CLOUDFLARE_API_TOKEN:      ${CLOUDFLARE_API_TOKEN:+set (${#CLOUDFLARE_API_TOKEN} chars)}"
        echo "  CLOUDFLARE_API_TOKEN_NAME: ${CLOUDFLARE_API_TOKEN_NAME:-<not set>}"

  whoami:
    desc: Show current Cloudflare auth info
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun scripts/cf-deploy.ts whoami
