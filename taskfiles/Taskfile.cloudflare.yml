version: '3'

# ============================================================================
# Reusable Cloudflare Workers deploy lifecycle.
#
# Include this from any project that deploys to Cloudflare Workers.
# All project-specific values come from vars passed by the parent include.
#
# Required vars:
#   WORKER_NAME     — Cloudflare Worker name (e.g., "truck-cad", "remy-sport")
#   WORKER_DOMAIN   — workers.dev subdomain (e.g., "gedw99.workers.dev")
#
# Optional vars:
#   ROOT_DIR, WORKER_DIR, PRODUCTION_URL, GITHUB_REPO,
#   APP_VERSION, VERSION_SLUG, SCHEMA_FILE, OUTPUT_FILE,
#   DB_NAME, BUCKET_NAME, SMOKE_EXTRA_CMD
# ============================================================================

# vars: set by parent include (see Required/Optional vars above)

tasks:

  # ==========================================================================
  # Versioned Deploy Lifecycle
  # ==========================================================================

  upload:
    desc: "Upload new Worker version (does NOT deploy to production)"
    cmds:
      - cd {{.WORKER_DIR}} && bun install && bun x wrangler versions upload {{if .APP_VERSION}}--tag "v{{.APP_VERSION}}" --message "v{{.APP_VERSION}}"{{end}} {{if .VERSION_SLUG}}--preview-alias "v{{.VERSION_SLUG}}"{{end}}

  promote:
    desc: Deploy latest uploaded version to 100% traffic
    cmds:
      - |
        eval $(cd {{.ROOT_DIR}} && ROOT_DIR={{.ROOT_DIR}} WORKER_DIR={{.WORKER_DIR}} {{if .OUTPUT_FILE}}OUTPUT_FILE={{.OUTPUT_FILE}}{{end}} bun scripts/versions-json.ts --latest-env)
        if [ -z "$VERSION_ID" ]; then
          echo "ERROR: No versionId in versions.json — upload first"
          exit 1
        fi
        echo "Promoting $VERSION_ID (v${VERSION}, commit ${COMMIT_SHA}) to 100%..."
        cd {{.WORKER_DIR}} && bun x wrangler versions deploy "$VERSION_ID@100%" --yes

  canary:
    desc: Deploy with gradual traffic split (interactive)
    cmds:
      - cd {{.WORKER_DIR}} && bun x wrangler versions deploy

  rollback:
    desc: Roll back to previous version
    cmds:
      - cd {{.WORKER_DIR}} && bun x wrangler rollback

  smoke:
    desc: Smoke test a deployed URL (health + index + optional extra checks)
    cmds:
      - |
        eval $(cd {{.ROOT_DIR}} && ROOT_DIR={{.ROOT_DIR}} WORKER_DIR={{.WORKER_DIR}} {{if .OUTPUT_FILE}}OUTPUT_FILE={{.OUTPUT_FILE}}{{end}} bun scripts/versions-json.ts --latest-env)
        URL="${PREVIEW_URL:-{{.PRODUCTION_URL}}}"
        echo "Smoke testing: $URL"
        echo ""
        # 1. Health check
        HEALTH=$(curl -sf "$URL/api/health" 2>&1) || { echo "FAIL: /api/health unreachable"; exit 1; }
        HEALTH_VER=$(echo "$HEALTH" | bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version||'?')")
        echo "  health:    OK (v${HEALTH_VER})"
        # 2. Index page
        INDEX_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL/")
        INDEX_SIZE=$(curl -sf -o /dev/null -w "%{size_download}" "$URL/")
        echo "  index:     OK (HTTP ${INDEX_STATUS}, ${INDEX_SIZE} bytes)"
        # 3. Project-specific checks (if SMOKE_EXTRA_CMD is set)
        {{if .SMOKE_EXTRA_CMD}}
        SMOKE_URL="$URL" {{.SMOKE_EXTRA_CMD}}
        {{end}}
        # 4. Version match
        echo ""
        if [ -n "$VERSION" ] && [ "$HEALTH_VER" = "$VERSION" ]; then
          echo "PASS: All checks passed (v${VERSION}, commit ${COMMIT_SHA:-?})"
        elif [ -n "$VERSION" ]; then
          echo "WARN: Version mismatch — expected v${VERSION}, got v${HEALTH_VER}"
        else
          echo "PASS: All checks passed (v${HEALTH_VER})"
        fi

  preview:
    desc: "Upload PR preview version"
    vars:
      PR_NUMBER: '{{.PR_NUMBER | default "preview"}}'
    cmds:
      - cd {{.WORKER_DIR}} && bun install && bun x wrangler versions upload --tag "pr-{{.PR_NUMBER}}" --message "PR #{{.PR_NUMBER}}" --preview-alias "pr-{{.PR_NUMBER}}"
      - |
        echo ""
        echo 'Preview: https://pr-{{.PR_NUMBER}}-{{.WORKER_NAME}}.{{.WORKER_DOMAIN}}'

  # ==========================================================================
  # Simple Deploy (for projects not using versioned flow)
  # ==========================================================================

  deploy:
    desc: Deploy worker to Cloudflare (simple, non-versioned)
    cmds:
      - cd {{.WORKER_DIR}} && bun install && bunx wrangler deploy

  deploy:staging:
    desc: Deploy to staging environment
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler deploy --env staging

  # ==========================================================================
  # Versions & Status
  # ==========================================================================

  "versions:list":
    desc: List recent Worker versions (tags, dates)
    cmds:
      - cd {{.WORKER_DIR}} && bun x wrangler versions list

  "versions:json":
    desc: Generate versions.json for GUI version picker
    dir: "{{.WORKER_DIR}}"
    cmds:
      - cd {{.ROOT_DIR}} && ROOT_DIR={{.ROOT_DIR}} WORKER_DIR={{.WORKER_DIR}} WORKER_NAME={{.WORKER_NAME}} WORKER_DOMAIN={{.WORKER_DOMAIN}} {{if .APP_VERSION}}APP_VERSION={{.APP_VERSION}}{{end}} {{if .PRODUCTION_URL}}PRODUCTION_URL={{.PRODUCTION_URL}}{{end}} {{if .GITHUB_REPO}}GITHUB_REPO={{.GITHUB_REPO}}{{end}} {{if .SCHEMA_FILE}}SCHEMA_FILE={{.SCHEMA_FILE}}{{end}} {{if .OUTPUT_FILE}}OUTPUT_FILE={{.OUTPUT_FILE}}{{end}} bun scripts/versions-json.ts
    silent: true

  status:
    desc: Show current deployment (versions + traffic split)
    cmds:
      - cd {{.WORKER_DIR}} && bun x wrangler deployments list

  list:
    desc: Show all preview URLs (versions + PR previews)
    cmds:
      - |
        VERSIONS=$(cd {{.WORKER_DIR}} && bun x wrangler versions list 2>&1 | \
          awk '/^Version ID:/{id=$NF} /^Created:/{ts=$NF} /^Tag:/{tag=$NF; if(tag!="-") print id, ts, tag}' | \
          sort -k2 -r)

        echo "=== Release Versions ==="
        echo ""
        echo "$VERSIONS" | grep "^.* .* v[0-9]" | while read VID TS TAG; do
          SLUG=$(echo "$TAG" | sed 's/^v//' | tr '.' '-')
          echo "  $TAG  ($TS)"
          echo "    https://v${SLUG}-{{.WORKER_NAME}}.{{.WORKER_DOMAIN}}"
          echo ""
        done

        PR_LINES=$(echo "$VERSIONS" | grep "^.* .* pr-" || true)
        if [ -n "$PR_LINES" ]; then
          echo "=== PR Previews ==="
          echo ""
          echo "$PR_LINES" | while read VID TS TAG; do
            echo "  $TAG  ($TS)"
            echo "    https://${TAG}-{{.WORKER_NAME}}.{{.WORKER_DOMAIN}}"
            echo ""
          done
        fi

        {{if .PRODUCTION_URL}}echo "Production:  {{.PRODUCTION_URL}}"{{end}}

  # ==========================================================================
  # D1 Database
  # ==========================================================================

  "d1:list":
    desc: List D1 databases
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler d1 list

  "d1:create":
    desc: Create the project D1 database
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler d1 create {{.DB_NAME}}
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:tables":
    desc: List tables in local D1
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler d1 execute {{.DB_NAME}} --local --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:tables:remote":
    desc: List tables in remote D1
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler d1 execute {{.DB_NAME}} --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:execute":
    desc: Execute SQL against local D1
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler d1 execute {{.DB_NAME}} --local --command "{{.SQL}}"
    requires:
      vars: [SQL]
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:execute:remote":
    desc: Execute SQL against remote D1
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler d1 execute {{.DB_NAME}} --remote --command "{{.SQL}}"
    requires:
      vars: [SQL]
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:migrations:create":
    desc: Create a new D1 migration
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler d1 migrations create {{.DB_NAME}} "{{.NAME}}"
    requires:
      vars: [NAME]
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:migrations:apply":
    desc: Apply D1 migrations locally (idempotent)
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler d1 migrations apply {{.DB_NAME}} --local
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  "d1:migrations:apply:remote":
    desc: Apply D1 migrations to remote (idempotent)
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler d1 migrations apply {{.DB_NAME}} --remote
    preconditions:
      - sh: '[ -n "{{.DB_NAME}}" ]'
        msg: "DB_NAME is required"

  # ==========================================================================
  # R2 Storage
  # ==========================================================================

  "r2:list":
    desc: List R2 buckets
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler r2 bucket list

  "r2:create":
    desc: Create the project R2 bucket
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler r2 bucket create {{.BUCKET_NAME}}
    preconditions:
      - sh: '[ -n "{{.BUCKET_NAME}}" ]'
        msg: "BUCKET_NAME is required"

  "r2:objects":
    desc: List objects in the project R2 bucket
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler r2 object list {{.BUCKET_NAME}}
    preconditions:
      - sh: '[ -n "{{.BUCKET_NAME}}" ]'
        msg: "BUCKET_NAME is required"

  # ==========================================================================
  # Secrets & Debugging
  # ==========================================================================

  "secret:list":
    desc: List Worker secrets
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler secret list

  tail:
    desc: Tail live Worker logs
    cmds:
      - cd {{.WORKER_DIR}} && bunx wrangler tail

  whoami:
    desc: Show current Cloudflare auth info
    cmds:
      - bunx wrangler whoami
