version: '3'

# ============================================================================
# Claude Skills & LLM Docs
#
# Downloads LLM-friendly documentation and Claude skills from upstream sources.
# Sources:
#   - Automerge: https://automerge.org/llms.txt
#   - kkrpc:     https://docs.kkrpc.kunkun.sh/llms-full.txt
#   - kkrpc skills: https://github.com/kunkunsh/kkrpc/tree/main/skills
#
# Usage:
#   task skills:update       # Update everything from upstream
#   task skills:update:llms  # Update LLM docs only
#   task skills:update:kkrpc # Update kkrpc skills only
#
# Note: automerge/SKILL.md is maintained locally (no upstream skill exists).
#       Its source material comes from automerge-llms-full.txt.
# ============================================================================

vars:
  # ROOT_DIR passed by parent include — do NOT redefine
  LLMS_DIR: '{{.ROOT_DIR}}/docs/llms'
  SKILLS_DIR: '{{.ROOT_DIR}}/.claude/skills'
  # Upstream URLs
  AUTOMERGE_LLMS_URL: 'https://automerge.org/llms.txt'
  AUTOMERGE_LLMS_FULL_URL: 'https://automerge.org/llms-full.txt'
  KKRPC_LLMS_FULL_URL: 'https://docs.kkrpc.kunkun.sh/llms-full.txt'
  KKRPC_LLMS_SMALL_URL: 'https://docs.kkrpc.kunkun.sh/llms-small.txt'
  KKRPC_SKILL_URL: 'https://raw.githubusercontent.com/kunkunsh/kkrpc/main/skills/kkrpc/SKILL.md'
  KKRPC_INTEROP_SKILL_URL: 'https://raw.githubusercontent.com/kunkunsh/kkrpc/main/skills/interop/SKILL.md'

tasks:
  default:
    internal: true
    cmds:
      - task: debug:self

  # ===========================================================================
  # Debug
  # ===========================================================================
  "debug:self":
    desc: Print all vars for debugging
    cmds:
      - echo "=== Skills Vars ==="
      - echo "ROOT_DIR={{.ROOT_DIR}}"
      - echo "LLMS_DIR={{.LLMS_DIR}}"
      - echo "SKILLS_DIR={{.SKILLS_DIR}}"
      - echo ""
      - echo "=== Upstream URLs ==="
      - echo "AUTOMERGE_LLMS_URL={{.AUTOMERGE_LLMS_URL}}"
      - echo "AUTOMERGE_LLMS_FULL_URL={{.AUTOMERGE_LLMS_FULL_URL}}"
      - echo "KKRPC_LLMS_FULL_URL={{.KKRPC_LLMS_FULL_URL}}"
      - echo "KKRPC_SKILL_URL={{.KKRPC_SKILL_URL}}"
      - echo "KKRPC_INTEROP_SKILL_URL={{.KKRPC_INTEROP_SKILL_URL}}"
    silent: true

  # ===========================================================================
  # Update All
  # ===========================================================================
  update:
    desc: Update all LLM docs and Claude skills from upstream
    cmds:
      - task: update:llms
      - task: update:kkrpc

  # ===========================================================================
  # LLM Docs
  # ===========================================================================
  "update:llms":
    desc: Download latest LLM docs from upstream
    cmds:
      - mkdir -p {{.LLMS_DIR}}
      - echo "Downloading automerge llms.txt..."
      - curl -sfL {{.AUTOMERGE_LLMS_URL}} -o {{.LLMS_DIR}}/automerge-llms.txt
      - echo "Downloading automerge llms-full.txt..."
      - curl -sfL {{.AUTOMERGE_LLMS_FULL_URL}} -o {{.LLMS_DIR}}/automerge-llms-full.txt
      - echo "Downloading kkrpc llms-full.txt..."
      - curl -sfL {{.KKRPC_LLMS_FULL_URL}} -o {{.LLMS_DIR}}/kkrpc-llms-full.txt
      - echo "Downloading kkrpc llms-small.txt..."
      - curl -sfL {{.KKRPC_LLMS_SMALL_URL}} -o {{.LLMS_DIR}}/kkrpc-llms-small.txt
      - echo "LLM docs updated in {{.LLMS_DIR}}"

  # ===========================================================================
  # kkrpc Skills
  # ===========================================================================
  "update:kkrpc":
    desc: Download latest kkrpc Claude skills from GitHub
    cmds:
      - mkdir -p {{.SKILLS_DIR}}/kkrpc
      - mkdir -p {{.SKILLS_DIR}}/interop
      - echo "Downloading kkrpc SKILL.md..."
      - curl -sfL {{.KKRPC_SKILL_URL}} -o {{.SKILLS_DIR}}/kkrpc/SKILL.md
      - echo "Downloading interop SKILL.md..."
      - curl -sfL {{.KKRPC_INTEROP_SKILL_URL}} -o {{.SKILLS_DIR}}/interop/SKILL.md
      - echo "kkrpc skills updated in {{.SKILLS_DIR}}"

  # ===========================================================================
  # Clean
  # ===========================================================================
  clean:
    desc: Remove all downloaded LLM docs and skills
    cmds:
      - rm -f {{.LLMS_DIR}}/automerge-llms.txt
      - rm -f {{.LLMS_DIR}}/automerge-llms-full.txt
      - rm -f {{.LLMS_DIR}}/kkrpc-llms-full.txt
      - rm -f {{.LLMS_DIR}}/kkrpc-llms-small.txt
      - rm -f {{.SKILLS_DIR}}/automerge/SKILL.md
      - rm -f {{.SKILLS_DIR}}/kkrpc/SKILL.md
      - rm -f {{.SKILLS_DIR}}/interop/SKILL.md
      - echo "Cleaned LLM docs and skills"
