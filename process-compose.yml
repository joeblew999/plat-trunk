# Process Compose — local dev orchestrator
#
# Start:  task up:detached   (background)  or  task up  (TUI)
# Stop:   task down
# Attach: task attach        (reconnect to running TUI)
#
# Workers:
#   http://localhost:8788       — CAD app, API, MCP (truck-cad + test-worker via -c flag)
#   http://localhost:8788/docs/ — Docs (service binding auto-discovers docs-worker on :5174)
#
# Note: docs-worker runs separately because miniflare multi-config shares the
# primary worker's ASSETS binding, breaking static asset isolation.

version: "0.5"

processes:
  workers:
    command: task truck:gui:serve
    availability:
      restart: on_failure

  docs-worker:
    command: cd systems/docs/worker && bun install --silent && bun x wrangler dev
    availability:
      restart: on_failure

  watch-gui:
    command: task truck:watch:gui
    availability:
      restart: on_failure

  watch-worker:
    command: task truck:watch:worker
    availability:
      restart: on_failure

  watch-docs:
    command: task vitepress:watch
    availability:
      restart: on_failure
