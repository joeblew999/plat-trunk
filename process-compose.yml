# Process Compose — local dev orchestrator
#
# Start:  task up:detached   (background)  or  task up  (TUI)
# Stop:   task down
# Attach: task attach        (reconnect to running TUI)
#
# Each worker runs as its own wrangler dev process.
# Service bindings auto-discover across processes — no extra config needed.
#
# Adding a new worker:
#   1. Add entry to cf-deploy.json
#   2. Add a process below
#   3. Add [[services]] binding in the truck worker's wrangler.toml

version: "0.5"

processes:
  # Primary truck-cad worker (builds WASM + schema first)
  worker:
    command: task truck:gui:serve
    availability:
      restart: on_failure

  # Docs worker — serves VitePress static site
  docs-worker:
    command: cd systems/docs/worker && bun install --silent && bun x wrangler dev
    availability:
      restart: on_failure

  # Test worker — minimal health-check worker
  test-worker:
    command: cd systems/test/worker && bun install --silent && bun x wrangler dev
    availability:
      restart: on_failure

  # File watchers
  watch-gui:
    command: task truck:watch:gui
    availability:
      restart: on_failure

  watch-worker:
    command: task truck:watch:worker
    availability:
      restart: on_failure

  watch-docs:
    command: task vitepress:watch
    availability:
      restart: on_failure
