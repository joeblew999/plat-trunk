# ============================================================================
# Process Compose — local dev orchestrator
#
# Start:  task up:detached   (background)  or  task up  (TUI)
# Stop:   task down
# Attach: task attach        (reconnect to running TUI)
#
# URLs:
#   CAD app:   http://localhost:8788
#   Docs:      http://localhost:8788/docs/
#   MCP:       http://localhost:8788/mcp
#   TUI:       http://localhost:8000
# ============================================================================

version: "0.5"

processes:
  # ── Workers ───────────────────────────────────────────────────────────────
  # truck-cad: main worker — GUI, API, MCP, /docs/* (service binding)
  # docs-worker: serves VitePress static site (required for service binding)
  gui-worker:
    command: task truck:gui:serve
    availability:
      restart: on_failure

  docs-worker:
    command: task vitepress:worker:dev
    availability:
      restart: on_failure

  # ── File Watchers ──────────────────────────────────────────────────────────
  # Auto-rebuild on source changes
  watch-gui:
    command: task truck:watch:gui
    availability:
      restart: on_failure

  watch-worker:
    command: task truck:watch:worker
    availability:
      restart: on_failure

  watch-docs:
    command: watchexec -w systems/docs/website/docs -w systems/docs/website/.vitepress/config.ts -e md,ts -- task vitepress:build
    availability:
      restart: on_failure

  # ── Optional ───────────────────────────────────────────────────────────────
  # Start from TUI when needed (disabled by default)

  shape-viewer:
    command: task truck:run:shape-viewer
    disabled: true
    description: "Geometry viewer for debugging WASM shape ops"
    availability:
      restart: on_failure
