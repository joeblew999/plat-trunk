# ============================================================================
# Process Compose — local dev orchestrator
#
# Start:  task up:detached   (background)  or  task up  (TUI)
# Stop:   task down
# Attach: task attach        (reconnect to running TUI)
#
# URL:  http://localhost:8788  (GUI, API, MCP, /docs/* via service binding)
# TUI:  http://localhost:8000
# ============================================================================

version: "0.5"

processes:
  # ── CAD Worker ─────────────────────────────────────────────────────────────
  # wrangler dev — serves everything: GUI, API, MCP, /docs/*
  # Service binding to docs-worker resolved automatically by wrangler
  gui-worker:
    command: task truck:gui:serve
    availability:
      restart: on_failure

  # ── File Watchers ──────────────────────────────────────────────────────────
  # Auto-rebuild WASM on Rust source changes
  watch-gui:
    command: task truck:watch:gui
    availability:
      restart: on_failure

  watch-worker:
    command: task truck:watch:worker
    availability:
      restart: on_failure

  # ── Optional ───────────────────────────────────────────────────────────────
  # Start from TUI when needed (disabled by default)

  docs-hmr:
    command: task vitepress:serve
    disabled: true
    description: "VitePress HMR on :5173 (doc authoring)"
    availability:
      restart: on_failure

  shape-viewer:
    command: task truck:run:shape-viewer
    disabled: true
    description: "Geometry viewer for debugging WASM shape ops"
    availability:
      restart: on_failure
