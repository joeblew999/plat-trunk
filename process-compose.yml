# Process Compose — local dev orchestrator
#
# Start:  task up:detached   (background)  or  task up  (TUI)
# Stop:   task down
# Attach: task attach        (reconnect to running TUI)
#
# All workers run on one port via service bindings:
#   http://localhost:8788       — CAD app, API, MCP
#   http://localhost:8788/docs/ — Docs (service binding → docs-worker)
#   env.TEST binding            — Test worker (service binding → test-worker)
#   http://localhost:8000       — TUI

version: "0.5"

processes:
  # All workers: truck-cad + docs-worker + test-worker (via service bindings)
  workers:
    command: task truck:gui:serve
    availability:
      restart: on_failure

  # Rust WASM rebuilds on source change
  watch-gui:
    command: task truck:watch:gui
    availability:
      restart: on_failure

  watch-worker:
    command: task truck:watch:worker
    availability:
      restart: on_failure

  watch-docs:
    command: task vitepress:watch
    availability:
      restart: on_failure

  # Optional (start from TUI when needed)
  shape-viewer:
    command: task truck:run:shape-viewer
    disabled: true
    description: "Geometry viewer for debugging WASM shape ops"
    availability:
      restart: on_failure
