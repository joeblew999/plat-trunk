name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

jobs:
  ci:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: go-task/setup-task@v1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .src/truck/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('.src/truck/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Build + test (all branches)
      - run: task truck:ci

      # Main push: upload tagged Worker version (does NOT deploy — promote is manual)
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            task cf:worker:upload
          else
            echo "Skipping Worker deploy — CLOUDFLARE_API_TOKEN not set"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Main push: upload docs Worker version (versioned, does NOT promote)
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            task vitepress:build && task cf:docs:upload
          else
            echo "Skipping docs deploy — CLOUDFLARE_API_TOKEN not set"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # PR: upload preview Worker version with per-PR alias
      - if: github.event_name == 'pull_request'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            task cf:worker:preview PR_NUMBER=${{ github.event.pull_request.number }}
          else
            echo "Skipping preview deploy — CLOUDFLARE_API_TOKEN not set"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Read config for PR comment URLs
      - if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        id: cfg
        env:
          CLOUDFLARE_API_TOKEN: placeholder
        run: |
          echo "worker_name=$(bun scripts/cf-deploy.ts config worker.name)" >> $GITHUB_OUTPUT
          echo "worker_domain=$(bun scripts/cf-deploy.ts config worker.domain)" >> $GITHUB_OUTPUT
          echo "worker_prod=$(bun scripts/cf-deploy.ts config worker.production)" >> $GITHUB_OUTPUT
          echo "docs_prod=$(bun scripts/cf-deploy.ts config docs.production)" >> $GITHUB_OUTPUT

      # Post preview URLs as PR comment
      - if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        uses: marocchino/sticky-pull-request-comment@v2
        env:
          CLOUDFLARE_API_TOKEN: placeholder
        with:
          header: preview-url
          message: |
            ### Preview Deployment

            | | URL |
            |--|--|
            | Preview (App) | https://pr-${{ github.event.pull_request.number }}-${{ steps.cfg.outputs.worker_name }}.${{ steps.cfg.outputs.worker_domain }} |
            | Production (App) | ${{ steps.cfg.outputs.worker_prod }} |
            | Production (Docs) | ${{ steps.cfg.outputs.docs_prod }} |

            Built from ${{ github.sha }}
