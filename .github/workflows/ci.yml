name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

jobs:
  ci:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: dtolnay/rust-action@stable

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .src/truck/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('.src/truck/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Build + test (all branches)
      - run: task truck:ci

      # Main push: upload tagged version (does NOT deploy — promote is manual)
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: task truck:deploy:upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # PR: deploy preview (separate Worker, production untouched)
      - if: github.event_name == 'pull_request'
        run: task truck:deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Tear down preview when PR is closed/merged
  preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - uses: oven-sh/setup-bun@v2

      - run: task truck:deploy:preview:down
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
