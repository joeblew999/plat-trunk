name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

jobs:
  ci:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: go-task/setup-task@v1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .src/truck/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('.src/truck/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Build + test (all branches)
      - run: task truck:ci

      # Main push: upload tagged version (does NOT deploy — promote is manual)
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            task cf:upload
          else
            echo "Skipping deploy — CLOUDFLARE_API_TOKEN not set"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # PR: upload preview version with per-PR alias (pr-42-truck-cad.gedw99.workers.dev)
      - if: github.event_name == 'pull_request'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            task cf:preview PR_NUMBER=${{ github.event.pull_request.number }}
          else
            echo "Skipping preview deploy — CLOUDFLARE_API_TOKEN not set"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Post preview URL as PR comment
      - if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        uses: marocchino/sticky-pull-request-comment@v2
        env:
          CLOUDFLARE_API_TOKEN: placeholder
        with:
          header: preview-url
          message: |
            ### Preview Deployment

            | | URL |
            |--|--|
            | Preview | https://pr-${{ github.event.pull_request.number }}-truck-cad.gedw99.workers.dev |
            | Production | https://cad.ubuntusoftware.net |

            Built from ${{ github.sha }} — [Compare versions side-by-side](https://cad.ubuntusoftware.net)
