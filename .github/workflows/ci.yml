name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise installs bun, node, wasm-pack from .mise.toml.
      # Rust + wasm targets are handled by rust-toolchain.toml — mise respects it automatically.
      - uses: jdx/mise-action@v2

      # Clone vendored Rust kernel sources (.src/ is gitignored, must be present for cargo)
      - name: Clone .src/truck
        run: git clone --depth=1 https://github.com/joeblew999/truck.git .src/truck

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .src/truck/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Fail fast if deploy secrets are missing
      - name: Check required secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Build + test (build includes truck WASM + docs)
      - run: bun run build && bun run test

      # Main push: deploy all workers (sub-workers first, then router)
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: bun scripts/cf-deploy.ts deploy-all
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # PR: upload preview versions (sub-workers first, then router)
      - if: github.event_name == 'pull_request'
        run: |
          PR=${{ github.event.pull_request.number }}
          bun scripts/cf-deploy.ts upload --target truck --tag pr-$PR --preview-alias pr-$PR
          bun scripts/cf-deploy.ts upload --target test --tag pr-$PR --preview-alias pr-$PR
          bun scripts/cf-deploy.ts upload --target router --tag pr-$PR --preview-alias pr-$PR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Read config for PR comment URLs
      - if: github.event_name == 'pull_request'
        id: cfg
        env:
          CLOUDFLARE_API_TOKEN: placeholder
        run: |
          echo "router_name=$(bun scripts/cf-deploy.ts config workers.router.name)" >> $GITHUB_OUTPUT
          echo "router_domain=$(bun scripts/cf-deploy.ts config workers.router.domain)" >> $GITHUB_OUTPUT
          echo "router_prod=$(bun scripts/cf-deploy.ts config workers.router.production)" >> $GITHUB_OUTPUT

      # Post preview URLs as PR comment
      - if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            ### Preview Deployment

            | | URL |
            |--|--|
            | Preview | https://pr-${{ github.event.pull_request.number }}-${{ steps.cfg.outputs.router_name }}.${{ steps.cfg.outputs.router_domain }} |
            | Production | ${{ steps.cfg.outputs.router_prod }} |

            Built from ${{ github.sha }}
