name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise installs bun, gh, wasm-pack from .mise.toml.
      # Rust + wasm targets are handled by rust-toolchain.toml — mise respects it automatically.
      - uses: jdx/mise-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Clone all vendored .src repos (truck, ifc-lite, ezpz) — idempotent
      - name: Sync .src repos
        run: mise run src:sync

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .src/truck/target
            .src/ifc-lite/target
            .src/ezpz/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check required secrets
        run: mise run ci:check-secrets
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build + test
        run: mise run ci

      # Main push: deploy all workers
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        name: Deploy
        run: mise run deploy
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # PR: upload preview versions
      - if: github.event_name == 'pull_request'
        name: Deploy PR preview
        run: mise run deploy:pr
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Read config for PR comment URLs (GitHub-specific output — stays in CI)
      - if: github.event_name == 'pull_request'
        id: cfg
        env:
          CLOUDFLARE_API_TOKEN: placeholder
        run: |
          echo "router_name=$(bun scripts/cf-deploy.ts config workers.router.name)" >> $GITHUB_OUTPUT
          echo "router_domain=$(bun scripts/cf-deploy.ts config workers.router.domain)" >> $GITHUB_OUTPUT
          echo "router_prod=$(bun scripts/cf-deploy.ts config workers.router.production)" >> $GITHUB_OUTPUT

      # Post preview URLs as PR comment (GitHub-specific action — stays in CI)
      - if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            ### Preview Deployment

            | | URL |
            |--|--|
            | Preview | https://pr-${{ github.event.pull_request.number }}-${{ steps.cfg.outputs.router_name }}.${{ steps.cfg.outputs.router_domain }} |
            | Production | ${{ steps.cfg.outputs.router_prod }} |

            Built from ${{ github.sha }}
