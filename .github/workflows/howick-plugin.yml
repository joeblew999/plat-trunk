name: Howick Plugin CI

# Triggered only when howick plugin files change.
# All logic lives in mise tasks — this file is infrastructure only.
#
# What runs (defined in systems/plugins/howick/.mise.toml ci task):
#   check    → clippy (wasm32) + fmt check
#   test     → Rust unit tests (native)
#   build:wasm → wasm-pack release build
#   test:size  → enforce < 3MB CF Worker WASM limit
#   build:ts   → bundle plugin.ts → public/plugin.js

on:
  push:
    branches: [main]
    paths: ['systems/plugins/howick/**']
  pull_request:
    branches: [main]
    paths: ['systems/plugins/howick/**']

permissions:
  contents: read

jobs:
  ci:
    name: Howick Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync .src repos
        run: mise run src:sync

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            systems/plugins/howick/crate/target
          key: ${{ runner.os }}-howick-${{ hashFiles('systems/plugins/howick/crate/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-howick-

      - name: CI
        run: mise run howick:ci

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: howick-wasm-${{ github.sha }}
          path: systems/plugins/howick/crate/pkg/
          retention-days: 7
