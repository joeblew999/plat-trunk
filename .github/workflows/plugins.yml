name: Plugins CI

# Triggered when any plugin changes — runs the full plugin group CI.
# All logic lives in mise tasks — this file is infrastructure only.
#
# What runs (defined in systems/plugins/mise.toml ci task):
#   howick:  check (clippy + fmt) + test + build:wasm + test:size + build:ts
#   example: build + typecheck

on:
  push:
    branches: [main]
    paths:
      - 'systems/plugins/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths:
      - 'systems/plugins/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  ci:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            systems/plugins/howick/crate/target
            systems/plugins/example/crate/target
          key: ${{ runner.os }}-plugins-${{ hashFiles('systems/plugins/**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-plugins-

      - uses: actions/cache@v4
        with:
          path: |
            systems/plugins/howick/crate/pkg
            systems/plugins/example/crate/pkg
          key: ${{ runner.os }}-plugins-wasm-${{ hashFiles('systems/plugins/**/src/**/*.rs', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-plugins-wasm-

      - name: CI
        run: mise --cd systems/plugins run ci

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: plugins-wasm-${{ github.sha }}
          path: |
            systems/plugins/howick/crate/pkg/
            systems/plugins/example/crate/pkg/
          retention-days: 7
