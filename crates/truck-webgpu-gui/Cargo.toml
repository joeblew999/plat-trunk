[package]
name = "truck-webgpu-gui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.106"
wgpu = "27.0.1"
winit = "0.30.12"
web-sys = { version = "0.3.83", features = ["HtmlCanvasElement", "Window", "Document", "Element"] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
log = "0.4.29"
wasm-bindgen-futures = "0.4.42"

# Truck rendering stack (Scene, Camera, Lights, PBR shaders, InstanceCreator)
truck-platform = { version = "0.6.0", path = "../../.src/truck/truck-platform" }
truck-rendimpl = { version = "0.6.0", path = "../../.src/truck/truck-rendimpl" }

# Truck CAD kernel (modeling primitives, tessellation, booleans)
truck-modeling = { version = "0.6.0", path = "../../.src/truck/truck-modeling" }
truck-meshalgo = { version = "0.4.0", path = "../../.src/truck/truck-meshalgo" }
truck-shapeops = { version = "0.4.0", path = "../../.src/truck/truck-shapeops", default-features = false }

# Serialization (save/load solids as JSON)
serde_json = "1.0"

[features]
default = []
webgl = ["wgpu/webgl", "truck-platform/webgl", "truck-rendimpl/webgl"]

[profile.release]
opt-level = "s"
