# ───────────────────────────────────────────────────────
# test-worker — Validates N-worker topology pattern
# ───────────────────────────────────────────────────────
#
# Minimal worker proving the platform supports N independent systems.
# Accessed via TEST service binding from plat-router at /test/*.
#
# Direct: http://localhost:5175 (dev) or https://test-worker.gedw99.workers.dev
# ───────────────────────────────────────────────────────

name = "test-worker"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# ─── CF-native Observability ────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.05

[dev]
ip = "0.0.0.0"
port = 5175
inspector_port = 9231
local_protocol = "http"
