[package]
name = "truck-cad"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.106"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
log = "0.4.29"
wasm-bindgen-futures = "0.4.42"
js-sys = "0.3.83"

# Rendering stack — optional, gated behind `rendering` feature (ADR-0018 Phase 0.5)
wgpu = { version = "27.0.1", optional = true }
winit = { version = "0.30.12", optional = true }
web-sys = { version = "0.3.83", features = ["HtmlCanvasElement", "Window", "Document", "Element"], optional = true }
monstertruck-gpu = { version = "0.1.1", path = "../../../.src/truck/monstertruck-gpu", optional = true }
monstertruck-render = { version = "0.1.1", path = "../../../.src/truck/monstertruck-render", optional = true }

# Truck CAD kernel (modeling primitives, tessellation, booleans) — always compiled
monstertruck-modeling = { version = "0.1.1", path = "../../../.src/truck/monstertruck-modeling" }
monstertruck-meshing = { version = "0.1.1", path = "../../../.src/truck/monstertruck-meshing" }
monstertruck-mesh = { version = "0.1.1", path = "../../../.src/truck/monstertruck-mesh" }
monstertruck-topology = { version = "0.1.1", path = "../../../.src/truck/monstertruck-topology" }
monstertruck-solid = { version = "0.1.1", path = "../../../.src/truck/monstertruck-solid", default-features = false }
monstertruck-step = { version = "0.1.1", path = "../../../.src/truck/monstertruck-step" }
monstertruck-assembly = { version = "0.1.1", path = "../../../.src/truck/monstertruck-assembly" }

# Serialization (save/load solids as JSON)
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }

# JSON Schema generation from Rust types (single source of truth for all actors)
schemars = { version = "0.8", features = ["derive"] }

# Stable object identity (UUID v4 for WASM)
uuid = { version = "1", features = ["v4", "js", "serde"] }

# Linear algebra for BIM/IFC transformations
nalgebra = "0.33"

# Semantic BIM Layer (IFC parsing)
ifc-lite-core = { path = "../../../.src/ifc-lite/rust/core" }
ifc-lite-geometry = { path = "../../../.src/ifc-lite/rust/geometry" }

# 2D constraint solver for parametric sketching
kcl-ezpz = { package = "ezpz", path = "../../../.src/ezpz/ezpz" }

# Optional features
geozero = { version = "0.15.1", features = ["with-mvt"], optional = true }
earcutr = { version = "0.5.0", optional = true }
bytes = { version = "1.11.1", optional = true }
prost = { version = "0.14.3", optional = true }
gltf = { version = "1.4.1", optional = true }
base64 = "0.22.1"

[[bin]]
name = "generate-schema"
path = "src/bin/generate_schema.rs"

[dev-dependencies]
truck-sync = { path = "../../sync/crate" }

[features]
default = ["rendering", "mvt"]
rendering = ["dep:monstertruck-gpu", "dep:monstertruck-render", "dep:wgpu", "dep:winit", "dep:web-sys"]
webgl = ["wgpu/webgl", "monstertruck-gpu/webgl", "monstertruck-render/webgl"]
mvt = ["dep:geozero", "dep:earcutr", "dep:bytes", "dep:prost"]
gltf = ["dep:gltf"]
# Enables HeadlessController on native targets for `cargo test --features native`
native = []

[profile.release]
opt-level = "s"
panic = "unwind"  # Required: catch_unwind in boolean ops needs unwind (default wasm=abort)

[profile.dev]
panic = "unwind"

[build-dependencies]
prost-build = "0.14.3"
