version: '3'

# Truck - Rust CAD Kernel  https://github.com/ricosjp/truck

vars:
  # ROOT_DIR passed by parent include — do NOT redefine
  SYSTEM_DIR: '{{.ROOT_DIR}}/systems/truck'
  BIN_DIR: '{{.ROOT_DIR}}/.bin'
  SRC_DIR: '{{.ROOT_DIR}}/.src'
  TRUCK_SRC_DIR: '{{.SRC_DIR}}/truck'
  TRUCK_UPSTREAM: 'github.com/ricosjp/truck'
  TRUCK_FORK: 'github.com/joeblew999/truck'
  TRUCK_REPO: '{{.TRUCK_FORK}}'
  TRUCK_RELEASE_REPO: 'joeblew999/plat-trunk'
  TRUCK_VERSION: 'v0.1.0'
  IFC_LITE_SRC_DIR: '{{.SRC_DIR}}/ifc-lite'
  IFC_LITE_REPO: 'github.com/louistrue/ifc-lite'
  EZPZ_SRC_DIR: '{{.SRC_DIR}}/ezpz'
  EZPZ_REPO: 'github.com/KittyCAD/ezpz'
  BASE_URL:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.production
  WORKER_NAME:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.name
  WORKER_DOMAIN:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.domain
  WORKER_DIR:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config worker.dir)"
  LOCAL_URL:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config local.worker
  SCHEMA_FILE:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config version.source)"
  CAD_VERSION:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.SCHEMA_FILE}}','utf8')).version)"
  CAD_VERSION_SLUG:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.SCHEMA_FILE}}','utf8')).version.replaceAll('.','-'))"

tasks:
  default:
    internal: true
    cmds:
      - task: debug:self

  # --- Debug ---

  "debug:self":
    desc: Print vars
    cmds:
      - echo "ROOT={{.ROOT_DIR}} SRC={{.TRUCK_SRC_DIR}} FORK={{.TRUCK_FORK}}"
      - cd {{.TRUCK_SRC_DIR}} && echo "HEAD=$(git rev-parse --short HEAD)"
    silent: true

  # --- Dependencies ---

  "deps:clone":
    desc: Clone dependencies
    cmds:
      - task: deps:clone:truck
      - task: deps:clone:ifc-lite
      - task: deps:clone:ezpz

  "deps:clone:truck":
    internal: true
    desc: Clone truck fork
    status:
      - test -f {{.TRUCK_SRC_DIR}}/Cargo.toml
    cmds:
      - mkdir -p {{.SRC_DIR}}
      - rm -rf {{.TRUCK_SRC_DIR}}
      - git clone https://{{.TRUCK_FORK}}.git {{.TRUCK_SRC_DIR}}
      - cd {{.TRUCK_SRC_DIR}} && git remote add upstream https://{{.TRUCK_UPSTREAM}}.git || true
      - cd {{.TRUCK_SRC_DIR}} && git submodule update --init

  "deps:clone:ifc-lite":
    internal: true
    desc: Clone ifc-lite (skips LFS — large IFC test models not needed for build)
    status:
      - test -d {{.IFC_LITE_SRC_DIR}}/.git
    cmds:
      - mkdir -p {{.SRC_DIR}}
      - GIT_LFS_SKIP_SMUDGE=1 git clone https://{{.IFC_LITE_REPO}}.git {{.IFC_LITE_SRC_DIR}}

  "deps:clone:ezpz":
    internal: true
    desc: Clone ezpz (KittyCAD kcl-ezpz dependency)
    status:
      - test -d {{.EZPZ_SRC_DIR}}/.git
    cmds:
      - mkdir -p {{.SRC_DIR}}
      - git clone https://{{.EZPZ_REPO}}.git {{.EZPZ_SRC_DIR}}

  "deps:install":
    desc: Install truck binaries
    deps: ["deps:clone"]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - cd {{.TRUCK_SRC_DIR}} && cargo build --release --example simple-shape-viewer
      - cp {{.TRUCK_SRC_DIR}}/target/release/examples/simple-shape-viewer {{.BIN_DIR}}/

  "deps:wasm-pack":
    desc: Install wasm-pack
    cmds:
      - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    status:
      - wasm-pack --version

  "deps:clean":
    desc: Remove truck source and binaries
    cmds:
      - rm -rf {{.TRUCK_SRC_DIR}}
      - rm -rf {{.BIN_DIR}}

  # --- Fork Workflow ---

  "fork:sync":
    desc: Sync fork with upstream
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch upstream
      - cd {{.TRUCK_SRC_DIR}} && git checkout master
      - cd {{.TRUCK_SRC_DIR}} && git merge upstream/master --ff-only
      - cd {{.TRUCK_SRC_DIR}} && git push origin master

  "fork:status":
    desc: Show fork vs upstream status
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch origin && git fetch upstream
      - |
        cd {{.TRUCK_SRC_DIR}}
        AHEAD=$(git rev-list --count upstream/master..origin/master)
        BEHIND=$(git rev-list --count origin/master..upstream/master)
        echo "Fork: $AHEAD ahead, $BEHIND behind upstream"
    silent: true

  "upgrade":
    desc: Pull latest truck
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch origin && git checkout master && git pull origin master && git submodule update --init
      - echo "Truck updated to $(cd {{.TRUCK_SRC_DIR}} && git rev-parse --short HEAD)"

  # --- Build ---

  build:
    desc: Build truck library
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo build --release

  check:
    desc: Cargo check (fast)
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo check
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo check

  # --- WASM ---

  "wasm:build":
    desc: Compile headless truck-webgpu-gui WASM (for Worker, no rendering)
    deps: ["deps:wasm-pack"]
    cmds:
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && wasm-pack build --target bundler --no-default-features --out-dir {{.SYSTEM_DIR}}/worker/pkg

  "wasm:build-browser":
    desc: Compile truck-webgpu-gui WASM (for browser)
    deps: ["deps:clone", "deps:wasm-pack"]
    cmds:
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && wasm-pack build --target web --release --out-dir {{.SYSTEM_DIR}}/web/pkg-browser-renderer

  # --- Watch ---

  "watch:gui":
    desc: Watch and rebuild browser WASM + schema
    cmds:
      - watchexec -w {{.ROOT_DIR}}/crates/truck-webgpu-gui/src -e rs -- "task truck:gui:build"

  "watch:worker":
    desc: Watch and rebuild headless worker WASM
    cmds:
      - watchexec -w {{.ROOT_DIR}}/crates/truck-webgpu-gui/src -e rs -- "task truck:wasm:build"

  "watch:all":
    desc: Watch everything (requires process-compose or multiple terminals)
    cmds:
      - |
        echo "Starting full watch mode..."
        echo "Terminal 1: task truck:watch:gui"
        echo "Terminal 2: task truck:watch:worker"
        echo "Terminal 3: task truck:gui:serve"
    silent: true

  # --- GUI (browser + Worker) ---

  "gui:schema":
    desc: Generate cad-schema.json from Rust structs
    dir: "{{.ROOT_DIR}}/crates/truck-webgpu-gui"
    sources:
      - src/**/*.rs
      - Cargo.toml
    generates:
      - "{{.SCHEMA_FILE}}"
    cmds:
      - cargo run --bin generate-schema 2>/dev/null > {{.SCHEMA_FILE}}

  "gui:build":
    desc: Build browser WASM + generate schema
    deps: ["wasm:build-browser"]
    cmds:
      - task: gui:schema
      - cp {{.SYSTEM_DIR}}/llms.txt {{.SYSTEM_DIR}}/web/llms.txt

  "mcp:bootstrap":
    desc: "Bootstrap all MCP components: schema, deps, configs"
    deps: ["gui:schema"]
    cmds:
      - task: mcp:install
      - task: mcp:configure

  "mcp:install":
    desc: "Install dependencies for MCP bridge (scripts/)"
    dir: "{{.ROOT_DIR}}/scripts"
    sources:
      - package.json
    generates:
      - node_modules/@modelcontextprotocol/sdk/package.json
    cmds:
      - bun install --silent

  "mcp:configure":
    desc: "Generate MCP client configs (Gemini, Cursor)"
    cmds:
      - '{{.ROOT_DIR}}/scripts/mcp-setup.sh'
    silent: true

  "mcp:doctor":
    desc: "Diagnose MCP connectivity (Worker → endpoint → bridge → config)"
    cmds:
      - |
        echo "=== MCP Doctor ==="
        echo ""

        echo "1. Worker health..."
        if curl -sf {{.LOCAL_URL}}/api/health > /dev/null 2>&1; then
          VERSION=$(curl -sf {{.LOCAL_URL}}/api/health | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          echo "   OK (v${VERSION})"
        else
          echo "   FAIL — run: task up"
        fi
        echo ""

        echo "2. MCP endpoint (tools/list)..."
        TOOLS=$(curl -sf -X POST {{.LOCAL_URL}}/mcp \
          -H 'Content-Type: application/json' \
          -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' 2>/dev/null \
          | grep -o '"name"' | wc -l | tr -d ' ')
        if [ "$TOOLS" -gt 0 ] 2>/dev/null; then
          echo "   OK (${TOOLS} tools)"
        else
          echo "   FAIL — Worker running but /mcp not responding"
        fi
        echo ""

        echo "3. .mcp.json config..."
        if [ -f "{{.ROOT_DIR}}/.mcp.json" ]; then
          CMD=$(cat "{{.ROOT_DIR}}/.mcp.json" | grep -o '"command"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1)
          echo "   OK — ${CMD}"
        else
          echo "   MISSING — run: task truck:mcp:bootstrap"
        fi
        echo ""

        echo "4. Bridge log (last 5 lines)..."
        if [ -f "$HOME/.cache/{{.WORKER_NAME}}/mcp-bridge.log" ]; then
          tail -5 "$HOME/.cache/{{.WORKER_NAME}}/mcp-bridge.log" | sed 's/^/   /'
        else
          echo "   No log file yet (bridge hasn't run)"
        fi
        echo ""

        echo "5. Bridge deps..."
        if [ -f "{{.ROOT_DIR}}/scripts/node_modules/@modelcontextprotocol/sdk/package.json" ]; then
          echo "   OK"
        else
          echo "   MISSING — run: task truck:mcp:bootstrap"
        fi
    silent: true

  "mcp:teardown":
    desc: Remove MCP settings (server not running)
    cmds:
      - '{{.ROOT_DIR}}/scripts/mcp-teardown.sh'
    silent: true

  "gui:serve":
    desc: Local dev server
    deps: ["gui:build", "mcp:bootstrap"]
    preconditions:
      - sh: test -f {{.SYSTEM_DIR}}/web/vendor/lit.js
        msg: "vendor/lit.js missing — run: git checkout HEAD -- systems/truck/web/vendor/lit.js"
      - sh: test -f {{.SYSTEM_DIR}}/web/vendor/three.js
        msg: "vendor/three.js missing — run: git checkout HEAD -- systems/truck/web/vendor/three.js"
    cmds:
      - cd {{.SYSTEM_DIR}}/worker && bun install && bun x wrangler dev

  "gui:restart":
    desc: Restart local dev server (kills wrangler, starts fresh)
    cmds:
      - pkill -f "wrangler dev" 2>/dev/null || true
      - sleep 1
      - task: gui:serve

  "gui:deploy":
    desc: "Build + upload + smoke + git tag v{{.CAD_VERSION}} (does NOT promote — use cf:worker:promote when ready)"
    deps: ["gui:build", "deploy:setup", "version:check"]
    cmds:
      - task: :cf:worker:upload
        vars:
          APP_VERSION: '{{.CAD_VERSION}}'
          VERSION_SLUG: '{{.CAD_VERSION_SLUG}}'
      - task: :cf:versions
      # Smoke test the preview URL before tagging — catches broken uploads
      - task: :cf:worker:smoke
      - task: deploy:tag
      - 'echo "Uploaded v{{.CAD_VERSION}} → https://v{{.CAD_VERSION_SLUG}}-{{.WORKER_NAME}}.{{.WORKER_DOMAIN}}"'
      - 'echo "To promote to production: task cf:worker:promote"'

  # --- Tests & Docs ---
  #
  # Two MCP systems power the dev+test workflow:
  #
  #   1. CAD MCP   — lives at LOCAL_URL/mcp (part of dev server)
  #      Provides: cad_add_cube, cad_translate, cad_boolean_subtract, ...
  #      Config:   .claude/settings.json → {{.WORKER_NAME}}
  #      Start:    task truck:gui:serve
  #
  #   2. Playwright MCP — browser automation (already running via Claude Code)
  #      Provides: browser_navigate, browser_snapshot, browser_click, ...
  #      Used for: visual verification during development
  #
  # Workflow:
  #   Terminal 1: task truck:gui:serve       → build + start server (CAD MCP alive)
  #   Terminal 2: task truck:test:api        → L2 Worker contract (no server needed)
  #   Terminal 2: task truck:test:e2e        → L3 cadCommand integration
  #   Terminal 2: task truck:test:ui         → L4 UI wiring
  #
  # MCP-driven development (Claude uses both MCPs):
  #   Claude: cad_add_cube({size: 1})        → drive via CAD MCP
  #   Claude: browser_snapshot               → verify via Playwright MCP
  #   Then: task truck:test:e2e              → capture as automated test
  #
  # Test layers (schema contract pyramid):
  #   L1: WASM kernel   — sketch, gizmo (test:sketch)
  #   L2: Worker/MCP    — schema contract, route validation (test:api)
  #   L3: cadCommand    — integration via same contract as MCP (test:e2e)
  #   L4: UI wiring     — toolbar→cadCommand, data-testid (test:ui)
  #
  # Env flags:
  #   SLOW=1         pauses between steps + video recording
  #   SCREENSHOTS=1  save PNGs → docs/hugo/static/screenshots/
  #   EXAMPLES=1     save scene JSON → systems/truck/web/examples/
  #   BASE_URL=...   override local worker URL

  "test:install":
    desc: Install Playwright + Chrome
    cmds:
      - cd {{.SYSTEM_DIR}}/tests && bun install
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright install chromium
    status:
      - test -d {{.SYSTEM_DIR}}/tests/node_modules

  "test:status":
    desc: Check if dev server + CAD MCP are running
    cmds:
      - |
        echo "=== Dev Server ==="
        if curl -sf {{.LOCAL_URL}}/api/health > /dev/null 2>&1; then
          echo "  ✓ running ({{.LOCAL_URL}})"
        else
          echo "  ✗ not running → task truck:gui:serve"
          exit 1
        fi
        echo "=== CAD MCP ==="
        if curl -sf {{.LOCAL_URL}}/api/cad/schema > /dev/null 2>&1; then
          CMDS=$(curl -s {{.LOCAL_URL}}/api/cad/schema | bun -e "process.stdout.write(String(Object.keys(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).commands).length))" 2>/dev/null || echo "?")
          echo "  ✓ schema: $CMDS commands ({{.LOCAL_URL}}/mcp)"
        else
          echo "  ✗ not available"
          exit 1
        fi
        echo "=== MCP Registration ==="
        if [ -f {{.ROOT_DIR}}/.mcp.json ]; then
          echo "  ✓ .mcp.json exists (project-scope)"
        else
          echo "  ✗ .mcp.json missing → task truck:gui:mcp"
        fi
        if command -v claude >/dev/null 2>&1; then
          if CLAUDECODE= claude mcp list 2>/dev/null | grep -q "{{.WORKER_NAME}}.*Connected"; then
            echo "  ✓ {{.WORKER_NAME}} registered + connected in Claude Code"
          elif CLAUDECODE= claude mcp list 2>/dev/null | grep -q "{{.WORKER_NAME}}"; then
            echo "  ⚠ {{.WORKER_NAME}} registered but not connected (restart Claude Code)"
          else
            echo "  ✗ {{.WORKER_NAME}} not registered → task truck:gui:mcp"
          fi
        fi
        echo "=== Playwright MCP ==="
        echo "  ✓ provided by Claude Code (always available)"
    silent: true

  # --- Test commands ---

  test:
    desc: Rust truck tests
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo test

  "test:crate":
    desc: Rust truck-webgpu-gui crate tests
    deps: ["deps:clone"]
    cmds:
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo test

  "test:api":
    desc: "L2: Worker API + MCP contract tests (vitest, no server needed)"
    cmds:
      - cd {{.SYSTEM_DIR}}/worker && bun x vitest run

  "test:preflight":
    internal: true
    desc: "Verify dev server is running and serving fresh assets"
    silent: true
    cmds:
      - |
        if ! curl -sf {{.LOCAL_URL}}/api/health > /dev/null 2>&1; then
          echo "FAIL: dev server not running at {{.LOCAL_URL}}"
          echo "  → run: task up:detached"
          exit 1
        fi
        if ! curl -sf {{.LOCAL_URL}}/vendor/lit.js > /dev/null 2>&1; then
          echo "FAIL: vendor/lit.js not served (missing or 404)"
          echo "  → run: git checkout HEAD -- systems/truck/web/vendor/lit.js && task truck:gui:restart"
          exit 1
        fi
        echo "Preflight OK: dev server healthy at {{.LOCAL_URL}}"

  "test:e2e":
    desc: "L3: cadCommand integration tests (requires: gui:serve running)"
    deps: ["test:install", "test:preflight"]
    cmds:
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test --project=e2e

  "test:ui":
    desc: "L4: UI wiring tests — toolbar, outliner, canvas (requires: gui:serve running)"
    deps: ["test:install", "test:preflight"]
    cmds:
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test --project=ui

  "test:e2e:slow":
    desc: E2E tests (slow + video)
    deps: ["test:install"]
    cmds:
      - cd {{.SYSTEM_DIR}}/tests && SLOW=1 bun x playwright test --project=e2e

  "test:sketch":
    desc: "L1: Sketch WASM kernel tests (requires: gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test e2e/sketch.spec.ts --project=e2e

  "test:sync":
    desc: "Cross-tab Automerge sync tests (runs alone, requires gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test --project=sync

  "test:videos":
    desc: Record doc videos (webm)
    deps: ["test:install"]
    cmds:
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test --project=docs

  "test:all":
    desc: "All tests (requires gui:serve running in another terminal)"
    deps: ["test:install", "test:preflight"]
    cmds:
      - cd {{.SYSTEM_DIR}}/worker && bun x vitest run
      - cd {{.SYSTEM_DIR}}/tests && SCREENSHOTS=1 EXAMPLES=1 bun x playwright test --project=e2e
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test --project=ui
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test --project=sync
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test --project=docs

  "test:full":
    desc: "Build, start server, run all tests, then stop"
    cmds:
      - task: gui:build
      - task: :up:detached
      - |
        echo "Waiting for server to be ready..."
        for i in {1..30}; do
          if curl -sf {{.LOCAL_URL}}/api/health > /dev/null 2>&1; then
            echo "Server ready!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Server failed to start"
            exit 1
          fi
          sleep 1
        done
      - task: test:all
      - task: :down

  ci:
    desc: Full CI (check + test + WASM)
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo check
      # Exclude GPU-dependent crates (need Vulkan) and truck-base (flaky proptest newton solver)
      - cd {{.TRUCK_SRC_DIR}} && cargo test --workspace --exclude truck-platform --exclude truck-rendimpl --exclude truck-base
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo test
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && wasm-pack build --target web --release --out-dir {{.SYSTEM_DIR}}/web/pkg-browser-renderer

  # --- Version Management ---
  # Source of truth: commands/mod.rs → build_schema() → cad-schema.json → CAD_VERSION
  # Flow: version:bump → gui:deploy (upload + promote + tag)

  "version:bump":
    desc: "Bump CAD version (usage: task truck:version:bump -- 0.4.0)"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task truck:version:bump -- 0.4.0"
      - sh: 'echo "{{.CLI_ARGS}}" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"'
        msg: "Invalid semver — expected format: 1.2.3"
      - sh: '! git rev-parse "v{{.CLI_ARGS}}" >/dev/null 2>&1'
        msg: "Tag v{{.CLI_ARGS}} already exists — pick a new version"
    cmds:
      # Cross-platform version replacement (works on macOS + Linux)
      - |
        MOD_RS="{{.ROOT_DIR}}/crates/truck-webgpu-gui/src/commands/mod.rs"
        bun -e "
          const fs = require('fs');
          const f = process.env.MOD_RS;
          fs.writeFileSync(f, fs.readFileSync(f,'utf8').replace(/\"version\":\s*\"[0-9]+\.[0-9]+\.[0-9]+\"/, '\"version\": \"{{.CLI_ARGS}}\"'));
        "
      - task: gui:schema
      - |
        cd {{.ROOT_DIR}}
        git add crates/truck-webgpu-gui/src/commands/mod.rs {{.SCHEMA_FILE}}
        git commit -m "release: v{{.CLI_ARGS}}"
        git tag "v{{.CLI_ARGS}}"
        echo ""
        echo "Version bumped to v{{.CLI_ARGS}} (committed + tagged)"
        echo "Next: task truck:gui:deploy"

  "version:current":
    desc: Show current CAD version
    cmds:
      - echo "v{{.CAD_VERSION}}"
    silent: true

  "version:check":
    desc: Verify commands/mod.rs and cad-schema.json versions match
    cmds:
      - |
        RUST_VER=$(bun -e "const s=require('fs').readFileSync('{{.ROOT_DIR}}/crates/truck-webgpu-gui/src/commands/mod.rs','utf8'); const m=s.match(/\"version\":\s*\"([0-9]+\.[0-9]+\.[0-9]+)\"/); process.stdout.write(m?m[1]:'?')")
        SCHEMA_VER=$(bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.SCHEMA_FILE}}','utf8')).version)")
        echo "Rust (mod.rs):         v${RUST_VER}"
        echo "Schema (cad-schema):   v${SCHEMA_VER}"
        if [ "$RUST_VER" = "$SCHEMA_VER" ]; then
          echo ""
          echo "OK: versions match"
        else
          echo ""
          echo "MISMATCH: run 'task truck:gui:schema' to regenerate"
          exit 1
        fi
    silent: true

  # --- Deploy ---
  # Generic CF tasks are in cf: include (taskfiles/Taskfile.cloudflare.yml).
  # Truck-specific: tag (GitHub release), setup (gh secret), smoke:extra (schema + MCP).
  # Flow: gui:deploy → version:check → cf:worker:upload → cf:worker:smoke → tag → cf:worker:promote

  "deploy:tag":
    internal: true
    desc: "Create git tag + GitHub release (delegates to cf:deploy:tag)"
    cmds:
      - task: :cf:deploy:tag

  "deploy:setup":
    internal: true
    desc: Ensure Cloudflare auth + GitHub CI secret (idempotent, runs once)
    cmds:
      - task: :gh:secret:set:cloudflare

  smoke:
    desc: "Full smoke test (generic + truck-specific schema/MCP checks)"
    cmds:
      - task: :cf:worker:smoke
      - task: smoke:extra

  "smoke:extra":
    internal: true
    desc: "Truck-specific smoke checks (schema + MCP)"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        eval $(bun scripts/cf-deploy.ts status --env)
        URL="${WORKER_IMMUTABLE_URL:-${WORKER_URL:-{{.BASE_URL}}}}"
        echo "Truck-specific checks: $URL"
        # Schema check
        SCHEMA=$(curl -sf "$URL/api/cad/schema" 2>&1) || { echo "FAIL: /api/cad/schema unreachable"; exit 1; }
        SCHEMA_INFO=$(echo "$SCHEMA" | bun -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); process.stdout.write(d.version+' '+Object.keys(d.commands).length)")
        SCHEMA_VER=$(echo "$SCHEMA_INFO" | cut -d' ' -f1)
        SCHEMA_CMDS=$(echo "$SCHEMA_INFO" | cut -d' ' -f2)
        echo "  schema:    OK (v${SCHEMA_VER}, ${SCHEMA_CMDS} commands)"
        # MCP tools/list
        MCP=$(curl -sf "$URL/mcp" -X POST -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' 2>&1) || { echo "FAIL: /mcp unreachable"; exit 1; }
        MCP_TOOLS=$(echo "$MCP" | bun -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).result?.tools?.length||0))")
        echo "  mcp:       OK (${MCP_TOOLS} tools)"
        echo ""
        echo "PASS: Truck-specific checks passed"

  "deploy:full":
    desc: Deploy Worker + docs site
    cmds:
      - task: gui:deploy
      - task: :vitepress:build
      - task: :vitepress:worker:deploy

  # --- Visual Examples (opens window) ---

  "run:shape-viewer":
    desc: View JSON shapes (drag & drop)
    deps: ["deps:install"]
    cmds:
      - open {{.TRUCK_SRC_DIR}}/resources/shape/
      - '{{.BIN_DIR}}/simple-shape-viewer'

  "run:obj-viewer":
    desc: View OBJ meshes (drag & drop)
    deps: ["deps:clone"]
    cmds:
      - open {{.TRUCK_SRC_DIR}}/resources/obj/
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example simple-obj-viewer

  # --- Generate JSON (stdout) ---

  "make:cube":
    desc: Generate cube JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example cube

  "make:sphere":
    desc: Generate sphere JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example sphere

  "make:cylinder":
    desc: Generate cylinder JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example cylinder

  "make:torus":
    desc: Generate torus JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example torus

  "make:bottle":
    desc: Generate bottle JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example bottle

  # --- Resources ---

  "resources:list":
    desc: List sample files
    deps: ["deps:clone"]
    cmds:
      - ls {{.TRUCK_SRC_DIR}}/resources/shape/ {{.TRUCK_SRC_DIR}}/resources/obj/
