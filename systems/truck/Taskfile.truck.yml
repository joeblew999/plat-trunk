version: '3'

# Truck - Rust CAD Kernel  https://github.com/ricosjp/truck

vars:
  ROOT_DIR: '{{.ROOT_DIR | default "."}}'
  BIN_DIR: '{{.ROOT_DIR}}/.bin'
  SRC_DIR: '{{.ROOT_DIR}}/.src'
  TRUCK_SRC_DIR: '{{.SRC_DIR}}/truck'
  TRUCK_UPSTREAM: 'github.com/ricosjp/truck'
  TRUCK_FORK: 'github.com/joeblew999/truck'
  TRUCK_REPO: '{{.TRUCK_FORK}}'
  TRUCK_RELEASE_REPO: 'joeblew999/plat-trunk'
  TRUCK_VERSION: 'v0.1.0'
  BASE_URL: '{{.BASE_URL | default "https://cad.ubuntusoftware.net"}}'

tasks:
  default:
    internal: true
    cmds:
      - task: debug:self

  # --- Debug ---

  "debug:self":
    desc: Print vars
    cmds:
      - echo "ROOT={{.ROOT_DIR}} SRC={{.TRUCK_SRC_DIR}} FORK={{.TRUCK_FORK}}"
      - cd {{.TRUCK_SRC_DIR}} && echo "HEAD=$(git rev-parse --short HEAD)"
    silent: true

  # --- Dependencies ---

  "deps:clone":
    desc: Clone truck fork
    status:
      - test -d {{.TRUCK_SRC_DIR}}
    cmds:
      - mkdir -p {{.SRC_DIR}}
      - git clone https://{{.TRUCK_FORK}}.git {{.TRUCK_SRC_DIR}}
      - cd {{.TRUCK_SRC_DIR}} && git remote add upstream https://{{.TRUCK_UPSTREAM}}.git || true
      - cd {{.TRUCK_SRC_DIR}} && git submodule update --init

  "deps:install":
    desc: Install truck binaries
    deps: ["deps:clone"]
    cmds:
      - xplat binary install simple-shape-viewer {{.TRUCK_VERSION}} {{.TRUCK_RELEASE_REPO}} --dir {{.BIN_DIR}} --source-cargo {{.TRUCK_SRC_DIR}} --example

  "deps:wasm-pack":
    desc: Install wasm-pack
    cmds:
      - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    status:
      - wasm-pack --version

  "deps:clean":
    desc: Remove truck source and binaries
    cmds:
      - rm -rf {{.TRUCK_SRC_DIR}}
      - rm -rf {{.BIN_DIR}}

  # --- Fork Workflow ---

  "fork:sync":
    desc: Sync fork with upstream
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch upstream
      - cd {{.TRUCK_SRC_DIR}} && git checkout master
      - cd {{.TRUCK_SRC_DIR}} && git merge upstream/master --ff-only
      - cd {{.TRUCK_SRC_DIR}} && git push origin master

  "fork:status":
    desc: Show fork vs upstream status
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch origin && git fetch upstream
      - |
        cd {{.TRUCK_SRC_DIR}}
        AHEAD=$(git rev-list --count upstream/master..origin/master)
        BEHIND=$(git rev-list --count origin/master..upstream/master)
        echo "Fork: $AHEAD ahead, $BEHIND behind upstream"
    silent: true

  "upgrade":
    desc: Pull latest truck
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch origin && git checkout master && git pull origin master && git submodule update --init
      - echo "Truck updated to $(cd {{.TRUCK_SRC_DIR}} && git rev-parse --short HEAD)"

  # --- Build ---

  build:
    desc: Build truck library
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo build --release

  check:
    desc: Cargo check (fast)
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo check
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo check

  # --- WASM ---

  "wasm:build":
    desc: Compile truck-js WASM (for Worker)
    deps: ["deps:clone", "deps:wasm-pack"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}}/truck-js && wasm-pack build --target bundler --out-dir {{.ROOT_DIR}}/systems/truck/worker/pkg

  "wasm:build-browser":
    desc: Compile truck-webgpu-gui WASM (for browser)
    deps: ["deps:clone", "deps:wasm-pack"]
    cmds:
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && wasm-pack build --target web --release --out-dir {{.ROOT_DIR}}/web/gui/pkg-browser-renderer

  # --- GUI (browser + Worker) ---

  "gui:schema":
    desc: Generate cad-schema.json from Rust structs
    cmds:
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo run --bin generate-schema 2>/dev/null > {{.ROOT_DIR}}/web/cad-schema.json

  "gui:build":
    desc: Build browser WASM + generate schema
    deps: ["wasm:build-browser"]
    cmds:
      - task: gui:schema

  "gui:serve":
    desc: Local dev server (localhost:8787)
    deps: ["gui:build"]
    cmds:
      - cd {{.ROOT_DIR}}/systems/truck/worker && bun install && bun x wrangler dev

  "gui:deploy":
    desc: Deploy to Cloudflare Workers
    deps: ["gui:build"]
    cmds:
      - cd {{.ROOT_DIR}}/systems/truck/worker && bun install && bun x wrangler deploy

  # --- Tests & Docs ---
  #
  # Two MCP systems power the dev+test workflow:
  #
  #   1. CAD MCP   — lives at http://localhost:8787/mcp (part of dev server)
  #      Provides: cad_add_cube, cad_translate, cad_boolean_subtract, ...
  #      Config:   .claude/settings.json → truck-cad
  #      Start:    task truck:gui:serve
  #
  #   2. Playwright MCP — browser automation (already running via Claude Code)
  #      Provides: browser_navigate, browser_snapshot, browser_click, ...
  #      Used for: visual verification during development
  #
  # Workflow:
  #   Terminal 1: task truck:gui:serve       → build + start server (CAD MCP alive)
  #   Terminal 2: task truck:test:api        → L2 Worker contract (no server needed)
  #   Terminal 2: task truck:test:e2e        → L3 cadCommand integration
  #   Terminal 2: task truck:test:ui         → L4 UI wiring
  #
  # MCP-driven development (Claude uses both MCPs):
  #   Claude: cad_add_cube({size: 1})        → drive via CAD MCP
  #   Claude: browser_snapshot               → verify via Playwright MCP
  #   Then: task truck:test:e2e              → capture as automated test
  #
  # Test layers (schema contract pyramid):
  #   L1: WASM kernel   — sketch, gizmo (test:sketch)
  #   L2: Worker/MCP    — schema contract, route validation (test:api)
  #   L3: cadCommand    — integration via same contract as MCP (test:e2e)
  #   L4: UI wiring     — toolbar→cadCommand, data-testid (test:ui)
  #
  # Env flags:
  #   SLOW=1         pauses between steps + video recording
  #   SCREENSHOTS=1  save PNGs → docs/hugo/static/screenshots/
  #   EXAMPLES=1     save scene JSON → web/gui/examples/
  #   BASE_URL=...   override localhost:8787

  "test:install":
    desc: Install Playwright + Chrome
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun install
      - cd {{.ROOT_DIR}}/tests && bun x playwright install chromium
    status:
      - test -d {{.ROOT_DIR}}/tests/node_modules

  "test:status":
    desc: Check if dev server + CAD MCP are running
    cmds:
      - |
        echo "=== Dev Server ==="
        if curl -sf http://localhost:8787/api/health > /dev/null 2>&1; then
          echo "  ✓ running (http://localhost:8787)"
        else
          echo "  ✗ not running → task truck:gui:serve"
          exit 1
        fi
        echo "=== CAD MCP ==="
        if curl -sf http://localhost:8787/api/cad/schema > /dev/null 2>&1; then
          CMDS=$(curl -s http://localhost:8787/api/cad/schema | python3 -c "import sys,json; print(len(json.load(sys.stdin)['commands']))" 2>/dev/null || echo "?")
          echo "  ✓ schema: $CMDS commands (http://localhost:8787/mcp)"
        else
          echo "  ✗ not available"
          exit 1
        fi
        echo "=== Playwright MCP ==="
        echo "  ✓ provided by Claude Code (always available)"
    silent: true

  # --- Test commands ---

  test:
    desc: Rust truck tests
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo test

  "test:crate":
    desc: Rust truck-webgpu-gui crate tests
    deps: ["deps:clone"]
    cmds:
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo test

  "test:api":
    desc: "L2: Worker API + MCP contract tests (vitest, no server needed)"
    cmds:
      - cd {{.ROOT_DIR}}/systems/truck/worker && bun x vitest run

  "test:e2e":
    desc: "L3: cadCommand integration tests (requires: gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=e2e

  "test:ui":
    desc: "L4: UI wiring tests — toolbar, outliner, canvas (requires: gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=ui

  "test:e2e:slow":
    desc: E2E tests (slow + video)
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && SLOW=1 bun x playwright test --project=e2e

  "test:sketch":
    desc: "L1: Sketch WASM kernel tests (requires: gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test e2e/sketch.spec.ts --project=e2e

  "test:sync":
    desc: "Cross-tab Automerge sync tests (runs alone, requires gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=sync

  "test:videos":
    desc: Record doc videos (webm)
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=docs

  "test:all":
    desc: "All tests (requires gui:serve running in another terminal)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/systems/truck/worker && bun x vitest run
      - cd {{.ROOT_DIR}}/tests && SCREENSHOTS=1 EXAMPLES=1 bun x playwright test --project=e2e
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=ui
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=sync
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=docs

  ci:
    desc: Full CI (check + test + WASM)
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo check
      - cd {{.TRUCK_SRC_DIR}} && cargo test
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo test
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && wasm-pack build --target web --release --out-dir {{.ROOT_DIR}}/web/gui/pkg-browser-renderer

  "docs:publish":
    desc: Generate screenshots + videos against BASE_URL + upload to R2
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && BASE_URL={{.BASE_URL}} SCREENSHOTS=1 bun x playwright test --project=e2e
      - cd {{.ROOT_DIR}}/tests && BASE_URL={{.BASE_URL}} bun x playwright test --project=docs
      - |
        cd {{.ROOT_DIR}}/systems/truck/worker
        for f in ../../../docs/hugo/static/screenshots/*.png; do
          [ -s "$f" ] && echo "Uploading $(basename $f)..." && bun x wrangler r2 object put "cad-docs/docs/screenshots/$(basename $f)" --file="$f" --ct="image/png" --remote
        done
        for f in ../../../docs/hugo/static/videos/*.webm; do
          [ -s "$f" ] && echo "Uploading $(basename $f)..." && bun x wrangler r2 object put "cad-docs/docs/videos/$(basename $f)" --file="$f" --ct="video/webm" --remote
        done

  # --- Deploy ---

  "deploy:full":
    desc: Deploy Worker + publish docs to R2
    cmds:
      - task: gui:deploy
      - task: docs:publish

  # --- Visual Examples (opens window) ---

  "run:shape-viewer":
    desc: View JSON shapes (drag & drop)
    deps: ["deps:install"]
    cmds:
      - open {{.TRUCK_SRC_DIR}}/resources/shape/
      - '{{.BIN_DIR}}/simple-shape-viewer'

  "run:obj-viewer":
    desc: View OBJ meshes (drag & drop)
    deps: ["deps:clone"]
    cmds:
      - open {{.TRUCK_SRC_DIR}}/resources/obj/
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example simple-obj-viewer

  # --- Generate JSON (stdout) ---

  "make:cube":
    desc: Generate cube JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example cube

  "make:sphere":
    desc: Generate sphere JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example sphere

  "make:cylinder":
    desc: Generate cylinder JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example cylinder

  "make:torus":
    desc: Generate torus JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example torus

  "make:bottle":
    desc: Generate bottle JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example bottle

  # --- Resources ---

  "resources:list":
    desc: List sample files
    deps: ["deps:clone"]
    cmds:
      - ls {{.TRUCK_SRC_DIR}}/resources/shape/ {{.TRUCK_SRC_DIR}}/resources/obj/
