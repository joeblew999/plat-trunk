version: '3'

# Truck - Rust CAD Kernel  https://github.com/ricosjp/truck

vars:
  ROOT_DIR: '{{.ROOT_DIR | default "."}}'
  BIN_DIR: '{{.ROOT_DIR}}/.bin'
  SRC_DIR: '{{.ROOT_DIR}}/.src'
  TRUCK_SRC_DIR: '{{.SRC_DIR}}/truck'
  TRUCK_UPSTREAM: 'github.com/ricosjp/truck'
  TRUCK_FORK: 'github.com/joeblew999/truck'
  TRUCK_REPO: '{{.TRUCK_FORK}}'
  TRUCK_RELEASE_REPO: 'joeblew999/plat-trunk'
  TRUCK_VERSION: 'v0.1.0'
  IFC_LITE_SRC_DIR: '{{.SRC_DIR}}/ifc-lite'
  IFC_LITE_REPO: 'github.com/louistrue/ifc-lite'
  EZPZ_SRC_DIR: '{{.SRC_DIR}}/ezpz'
  EZPZ_REPO: 'github.com/KittyCAD/ezpz'
  BASE_URL: '{{.BASE_URL | default "https://cad.ubuntusoftware.net"}}'
  WORKER_DIR: '{{.ROOT_DIR}}/systems/truck/worker'
  CAD_VERSION:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.ROOT_DIR}}/web/cad-schema.json','utf8')).version)"
  CAD_VERSION_SLUG:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.ROOT_DIR}}/web/cad-schema.json','utf8')).version.replaceAll('.','-'))"

tasks:
  default:
    internal: true
    cmds:
      - task: debug:self

  # --- Debug ---

  "debug:self":
    desc: Print vars
    cmds:
      - echo "ROOT={{.ROOT_DIR}} SRC={{.TRUCK_SRC_DIR}} FORK={{.TRUCK_FORK}}"
      - cd {{.TRUCK_SRC_DIR}} && echo "HEAD=$(git rev-parse --short HEAD)"
    silent: true

  # --- Dependencies ---

  "deps:clone":
    desc: Clone dependencies
    cmds:
      - task: deps:clone:truck
      - task: deps:clone:ifc-lite
      - task: deps:clone:ezpz

  "deps:clone:truck":
    desc: Clone truck fork
    status:
      - test -d {{.TRUCK_SRC_DIR}}
    cmds:
      - mkdir -p {{.SRC_DIR}}
      - git clone https://{{.TRUCK_FORK}}.git {{.TRUCK_SRC_DIR}}
      - cd {{.TRUCK_SRC_DIR}} && git remote add upstream https://{{.TRUCK_UPSTREAM}}.git || true
      - cd {{.TRUCK_SRC_DIR}} && git submodule update --init

  "deps:clone:ifc-lite":
    desc: Clone ifc-lite (skips LFS — large IFC test models not needed for build)
    status:
      - test -d {{.IFC_LITE_SRC_DIR}}
    cmds:
      - mkdir -p {{.SRC_DIR}}
      - GIT_LFS_SKIP_SMUDGE=1 git clone https://{{.IFC_LITE_REPO}}.git {{.IFC_LITE_SRC_DIR}}

  "deps:clone:ezpz":
    desc: Clone ezpz (KittyCAD kcl-ezpz dependency)
    status:
      - test -d {{.EZPZ_SRC_DIR}}
    cmds:
      - mkdir -p {{.SRC_DIR}}
      - git clone https://{{.EZPZ_REPO}}.git {{.EZPZ_SRC_DIR}}

  "deps:install":
    desc: Install truck binaries
    deps: ["deps:clone"]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - cd {{.TRUCK_SRC_DIR}} && cargo build --release --example simple-shape-viewer
      - cp {{.TRUCK_SRC_DIR}}/target/release/examples/simple-shape-viewer {{.BIN_DIR}}/

  "deps:wasm-pack":
    desc: Install wasm-pack
    cmds:
      - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    status:
      - wasm-pack --version

  "deps:clean":
    desc: Remove truck source and binaries
    cmds:
      - rm -rf {{.TRUCK_SRC_DIR}}
      - rm -rf {{.BIN_DIR}}

  # --- Fork Workflow ---

  "fork:sync":
    desc: Sync fork with upstream
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch upstream
      - cd {{.TRUCK_SRC_DIR}} && git checkout master
      - cd {{.TRUCK_SRC_DIR}} && git merge upstream/master --ff-only
      - cd {{.TRUCK_SRC_DIR}} && git push origin master

  "fork:status":
    desc: Show fork vs upstream status
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch origin && git fetch upstream
      - |
        cd {{.TRUCK_SRC_DIR}}
        AHEAD=$(git rev-list --count upstream/master..origin/master)
        BEHIND=$(git rev-list --count origin/master..upstream/master)
        echo "Fork: $AHEAD ahead, $BEHIND behind upstream"
    silent: true

  "upgrade":
    desc: Pull latest truck
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch origin && git checkout master && git pull origin master && git submodule update --init
      - echo "Truck updated to $(cd {{.TRUCK_SRC_DIR}} && git rev-parse --short HEAD)"

  # --- Build ---

  build:
    desc: Build truck library
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo build --release

  check:
    desc: Cargo check (fast)
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo check
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo check

  # --- WASM ---

  "wasm:build":
    desc: Compile truck-js WASM (for Worker)
    deps: ["deps:clone", "deps:wasm-pack"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}}/truck-js && wasm-pack build --target bundler --out-dir {{.ROOT_DIR}}/systems/truck/worker/pkg

  "wasm:build-browser":
    desc: Compile truck-webgpu-gui WASM (for browser)
    deps: ["deps:clone", "deps:wasm-pack"]
    cmds:
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && wasm-pack build --target web --release --out-dir {{.ROOT_DIR}}/web/gui/pkg-browser-renderer

  # --- Watch ---

  "watch:gui":
    desc: Watch and rebuild browser WASM + schema
    cmds:
      - watchexec -w {{.ROOT_DIR}}/crates/truck-webgpu-gui/src -e rs -- "task truck:gui:build"

  "watch:worker":
    desc: Watch and rebuild worker WASM
    cmds:
      - watchexec -w {{.TRUCK_SRC_DIR}}/truck-js/src -e rs -- "task truck:wasm:build"

  "watch:all":
    desc: Watch everything (requires process-compose or multiple terminals)
    cmds:
      - |
        echo "Starting full watch mode..."
        echo "Terminal 1: task truck:watch:gui"
        echo "Terminal 2: task truck:watch:worker"
        echo "Terminal 3: task truck:gui:serve"
    silent: true

  # --- GUI (browser + Worker) ---

  "gui:schema":
    desc: Generate cad-schema.json from Rust structs
    dir: "{{.ROOT_DIR}}/crates/truck-webgpu-gui"
    sources:
      - src/**/*.rs
      - Cargo.toml
    generates:
      - "{{.ROOT_DIR}}/web/cad-schema.json"
    cmds:
      - cargo run --bin generate-schema 2>/dev/null > {{.ROOT_DIR}}/web/cad-schema.json

  "gui:build":
    desc: Build browser WASM + generate schema
    deps: ["wasm:build-browser"]
    cmds:
      - task: gui:schema

  "mcp:bootstrap":
    desc: "Bootstrap all MCP components: schema, deps, configs"
    deps: ["gui:schema"]
    cmds:
      - task: mcp:install
      - task: mcp:configure

  "mcp:install":
    desc: "Install dependencies for MCP bridge (scripts/)"
    dir: "{{.ROOT_DIR}}/scripts"
    sources:
      - package.json
    generates:
      - node_modules/@modelcontextprotocol/sdk/package.json
    cmds:
      - bun install --silent

  "mcp:configure":
    desc: "Generate MCP client configs (Gemini, Cursor)"
    cmds:
      - '{{.ROOT_DIR}}/scripts/mcp-setup.sh'
    silent: true

  "mcp:teardown":
    desc: Remove MCP settings (server not running)
    cmds:
      - '{{.ROOT_DIR}}/scripts/mcp-teardown.sh'
    silent: true

  "gui:serve":
    desc: Local dev server (localhost:8788)
    deps: ["gui:build", "mcp:bootstrap"]
    cmds:
      - cd {{.ROOT_DIR}}/systems/truck/worker && bun install && bun x wrangler dev

  "gui:deploy":
    desc: "Build + upload + git tag v{{.CAD_VERSION}} (does NOT promote — use deploy:promote when ready)"
    deps: ["gui:build"]
    cmds:
      - task: deploy:upload
      - task: deploy:tag
      - 'echo "Uploaded v{{.CAD_VERSION}} → https://v{{.CAD_VERSION_SLUG}}-truck-cad.gedw99.workers.dev"'
      - 'echo "To promote to production: task truck:deploy:promote"'

  # --- Tests & Docs ---
  #
  # Two MCP systems power the dev+test workflow:
  #
  #   1. CAD MCP   — lives at http://localhost:8788/mcp (part of dev server)
  #      Provides: cad_add_cube, cad_translate, cad_boolean_subtract, ...
  #      Config:   .claude/settings.json → truck-cad
  #      Start:    task truck:gui:serve
  #
  #   2. Playwright MCP — browser automation (already running via Claude Code)
  #      Provides: browser_navigate, browser_snapshot, browser_click, ...
  #      Used for: visual verification during development
  #
  # Workflow:
  #   Terminal 1: task truck:gui:serve       → build + start server (CAD MCP alive)
  #   Terminal 2: task truck:test:api        → L2 Worker contract (no server needed)
  #   Terminal 2: task truck:test:e2e        → L3 cadCommand integration
  #   Terminal 2: task truck:test:ui         → L4 UI wiring
  #
  # MCP-driven development (Claude uses both MCPs):
  #   Claude: cad_add_cube({size: 1})        → drive via CAD MCP
  #   Claude: browser_snapshot               → verify via Playwright MCP
  #   Then: task truck:test:e2e              → capture as automated test
  #
  # Test layers (schema contract pyramid):
  #   L1: WASM kernel   — sketch, gizmo (test:sketch)
  #   L2: Worker/MCP    — schema contract, route validation (test:api)
  #   L3: cadCommand    — integration via same contract as MCP (test:e2e)
  #   L4: UI wiring     — toolbar→cadCommand, data-testid (test:ui)
  #
  # Env flags:
  #   SLOW=1         pauses between steps + video recording
  #   SCREENSHOTS=1  save PNGs → docs/hugo/static/screenshots/
  #   EXAMPLES=1     save scene JSON → web/gui/examples/
  #   BASE_URL=...   override localhost:8788

  "test:install":
    desc: Install Playwright + Chrome
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun install
      - cd {{.ROOT_DIR}}/tests && bun x playwright install chromium
    status:
      - test -d {{.ROOT_DIR}}/tests/node_modules

  "test:status":
    desc: Check if dev server + CAD MCP are running
    cmds:
      - |
        echo "=== Dev Server ==="
        if curl -sf http://localhost:8788/api/health > /dev/null 2>&1; then
          echo "  ✓ running (http://localhost:8788)"
        else
          echo "  ✗ not running → task truck:gui:serve"
          exit 1
        fi
        echo "=== CAD MCP ==="
        if curl -sf http://localhost:8788/api/cad/schema > /dev/null 2>&1; then
          CMDS=$(curl -s http://localhost:8788/api/cad/schema | bun -e "process.stdout.write(String(Object.keys(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).commands).length))" 2>/dev/null || echo "?")
          echo "  ✓ schema: $CMDS commands (http://localhost:8788/mcp)"
        else
          echo "  ✗ not available"
          exit 1
        fi
        echo "=== MCP Registration ==="
        if [ -f {{.ROOT_DIR}}/.mcp.json ]; then
          echo "  ✓ .mcp.json exists (project-scope)"
        else
          echo "  ✗ .mcp.json missing → task truck:gui:mcp"
        fi
        if command -v claude >/dev/null 2>&1; then
          if CLAUDECODE= claude mcp list 2>/dev/null | grep -q "truck-cad.*Connected"; then
            echo "  ✓ truck-cad registered + connected in Claude Code"
          elif CLAUDECODE= claude mcp list 2>/dev/null | grep -q "truck-cad"; then
            echo "  ⚠ truck-cad registered but not connected (restart Claude Code)"
          else
            echo "  ✗ truck-cad not registered → task truck:gui:mcp"
          fi
        fi
        echo "=== Playwright MCP ==="
        echo "  ✓ provided by Claude Code (always available)"
    silent: true

  # --- Test commands ---

  test:
    desc: Rust truck tests
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo test

  "test:crate":
    desc: Rust truck-webgpu-gui crate tests
    deps: ["deps:clone"]
    cmds:
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo test

  "test:api":
    desc: "L2: Worker API + MCP contract tests (vitest, no server needed)"
    cmds:
      - cd {{.ROOT_DIR}}/systems/truck/worker && bun x vitest run

  "test:e2e":
    desc: "L3: cadCommand integration tests (requires: gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=e2e

  "test:ui":
    desc: "L4: UI wiring tests — toolbar, outliner, canvas (requires: gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=ui

  "test:e2e:slow":
    desc: E2E tests (slow + video)
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && SLOW=1 bun x playwright test --project=e2e

  "test:sketch":
    desc: "L1: Sketch WASM kernel tests (requires: gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test e2e/sketch.spec.ts --project=e2e

  "test:sync":
    desc: "Cross-tab Automerge sync tests (runs alone, requires gui:serve running)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=sync

  "test:videos":
    desc: Record doc videos (webm)
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=docs

  "test:all":
    desc: "All tests (requires gui:serve running in another terminal)"
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/systems/truck/worker && bun x vitest run
      - cd {{.ROOT_DIR}}/tests && SCREENSHOTS=1 EXAMPLES=1 bun x playwright test --project=e2e
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=ui
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=sync
      - cd {{.ROOT_DIR}}/tests && bun x playwright test --project=docs

  "test:full":
    desc: "Build, start server, run all tests, then stop"
    cmds:
      - task: gui:build
      - task: :up:detached
      - |
        echo "Waiting for server to be ready..."
        for i in {1..30}; do
          if curl -sf http://localhost:8788/api/health > /dev/null 2>&1; then
            echo "Server ready!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Server failed to start"
            exit 1
          fi
          sleep 1
        done
      - task: test:all
      - task: :down

  ci:
    desc: Full CI (check + test + WASM)
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo check
      # Exclude GPU-dependent crates (need Vulkan) and truck-base (flaky proptest newton solver)
      - cd {{.TRUCK_SRC_DIR}} && cargo test --workspace --exclude truck-platform --exclude truck-rendimpl --exclude truck-base
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && cargo test
      - cd {{.ROOT_DIR}}/crates/truck-webgpu-gui && wasm-pack build --target web --release --out-dir {{.ROOT_DIR}}/web/gui/pkg-browser-renderer

  "docs:publish":
    desc: Generate screenshots + videos against BASE_URL + upload to R2
    deps: ["test:install"]
    cmds:
      - cd {{.ROOT_DIR}}/tests && BASE_URL={{.BASE_URL}} SCREENSHOTS=1 bun x playwright test --project=e2e
      - cd {{.ROOT_DIR}}/tests && BASE_URL={{.BASE_URL}} bun x playwright test --project=docs
      - |
        cd {{.ROOT_DIR}}/systems/truck/worker
        for f in ../../../docs/hugo/static/screenshots/*.png; do
          [ -s "$f" ] && echo "Uploading $(basename $f)..." && bun x wrangler r2 object put "cad-docs/docs/screenshots/$(basename $f)" --file="$f" --ct="image/png" --remote
        done
        for f in ../../../docs/hugo/static/videos/*.webm; do
          [ -s "$f" ] && echo "Uploading $(basename $f)..." && bun x wrangler r2 object put "cad-docs/docs/videos/$(basename $f)" --file="$f" --ct="video/webm" --remote
        done

  # --- Version Management ---
  # Source of truth: commands.rs → build_schema() → cad-schema.json → CAD_VERSION
  # Flow: version:bump → gui:deploy (upload + promote + tag)

  "version:bump":
    desc: "Bump CAD version (usage: task truck:version:bump -- 0.4.0)"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task truck:version:bump -- 0.4.0"
    cmds:
      - |
        sed -i '' 's/"version": "[0-9]*\.[0-9]*\.[0-9]*"/"version": "{{.CLI_ARGS}}"/' {{.ROOT_DIR}}/crates/truck-webgpu-gui/src/commands.rs
      - task: gui:schema
      - |
        cd {{.ROOT_DIR}}
        git add crates/truck-webgpu-gui/src/commands.rs web/cad-schema.json
        git commit -m "release: v{{.CLI_ARGS}}"
        git tag "v{{.CLI_ARGS}}"
        echo ""
        echo "Version bumped to v{{.CLI_ARGS}} (committed + tagged)"
        echo "Next: task truck:gui:deploy"

  "version:current":
    desc: Show current CAD version
    cmds:
      - echo "v{{.CAD_VERSION}}"
    silent: true

  # --- Deploy (versioned) ---
  # Uses Cloudflare Workers Versions + Gradual Deployments.
  # Schema version (cad-schema.json) is the release tag.
  # Flow: setup → upload → canary (optional) → promote → tag → verify

  "deploy:tag":
    desc: "Create git tag v{{.CAD_VERSION}} + GitHub release (idempotent)"
    deps: [":gh:deps:install"]
    cmds:
      - |
        VERSION="v{{.CAD_VERSION}}"
        cd {{.ROOT_DIR}}
        if git rev-parse "$VERSION" >/dev/null 2>&1; then
          echo "Tag $VERSION already exists"
        else
          git tag "$VERSION"
          echo "Created tag $VERSION"
        fi
        if git remote get-url origin >/dev/null 2>&1; then
          git push origin "$VERSION" 2>/dev/null || echo "Tag $VERSION already pushed"
        fi
      - |
        VERSION="v{{.CAD_VERSION}}"
        GH={{.BIN_DIR}}/gh
        if $GH release view "$VERSION" >/dev/null 2>&1; then
          echo "Release $VERSION already exists"
        else
          BODY=$(cat <<NOTES
        ## Try this version

        **Preview URL**: https://v{{.CAD_VERSION_SLUG}}-truck-cad.gedw99.workers.dev

        ## All URLs

        | Endpoint | URL |
        |----------|-----|
        | This version | https://v{{.CAD_VERSION_SLUG}}-truck-cad.gedw99.workers.dev |
        | Production | https://cad.ubuntusoftware.net |
        | API Health | https://cad.ubuntusoftware.net/api/health |
        | MCP | https://cad.ubuntusoftware.net/mcp |
        | CF Dashboard | [Deployments](https://dash.cloudflare.com/7384af54e33b8a54ff240371ea368440/workers/services/view/truck-cad/production/deployments) |

        ## Verify
        \`\`\`sh
        curl -sf https://v{{.CAD_VERSION_SLUG}}-truck-cad.gedw99.workers.dev/api/health
        # {"version":"{{.CAD_VERSION}}"}
        \`\`\`
        NOTES
          )
          $GH release create "$VERSION" --title "$VERSION" --notes "$BODY"
          echo "Created GitHub release $VERSION"
        fi

  "deploy:setup":
    desc: Ensure Cloudflare auth + GitHub CI secret (idempotent, runs once)
    cmds:
      - task: :gh:secret:set:cloudflare

  "deploy:upload":
    desc: "Upload new Worker version (tagged v{{.CAD_VERSION}}, does NOT deploy)"
    deps: ["gui:build", "deploy:setup"]
    cmds:
      - task: deploy:versions:json
      - cd {{.WORKER_DIR}} && bun install && bun x wrangler versions upload --tag "v{{.CAD_VERSION}}" --message "v{{.CAD_VERSION}}"

  "deploy:versions:json":
    desc: Generate versions.json for GUI version picker (releases + PR previews)
    dir: "{{.ROOT_DIR}}/systems/truck/worker"
    cmds:
      - |
        bun x wrangler versions list --env="" 2>&1 | \
          awk '/^Version ID:/{id=$NF} /^Created:/{ts=$NF} /^Tag:/{tag=$NF; if(tag!="-") print tag, ts}' | \
          bun -e "
            const lines = require('fs').readFileSync('/dev/stdin','utf8').trim().split('\n').filter(Boolean);
            const releases = [];
            const previews = [];
            for (const l of lines) {
              const [tag, ts] = l.split(' ');
              if (tag.startsWith('pr-')) {
                previews.push({ label: 'PR #' + tag.replace('pr-',''), tag, date: ts, url: 'https://' + tag + '-truck-cad.gedw99.workers.dev' });
              } else if (tag.match(/^v\d/)) {
                const ver = tag.replace('v','');
                const slug = ver.replaceAll('.','-');
                releases.push({ version: ver, tag, date: ts, url: 'https://v' + slug + '-truck-cad.gedw99.workers.dev' });
              }
            }
            // Dedupe releases by version, keep latest
            const deduped = [...new Map(releases.map(r => [r.version, r])).values()];
            deduped.sort((a,b) => b.version.localeCompare(a.version, undefined, {numeric:true}));
            const current = '{{.CAD_VERSION}}';
            if (!deduped.find(v => v.version === current)) {
              const slug = current.replaceAll('.','-');
              deduped.unshift({ version: current, tag: 'v'+current, date: new Date().toISOString(), url: 'https://v' + slug + '-truck-cad.gedw99.workers.dev' });
            }
            const out = { production: 'https://cad.ubuntusoftware.net', versions: deduped, previews };
            require('fs').writeFileSync('{{.ROOT_DIR}}/web/gui/versions.json', JSON.stringify(out, null, 2) + '\n');
            console.log('versions.json: ' + deduped.length + ' versions, ' + previews.length + ' PR previews');
          "
    silent: true

  "deploy:promote":
    desc: Deploy latest uploaded version to 100% traffic
    cmds:
      - |
        cd {{.WORKER_DIR}}
        LATEST=$(bun x wrangler versions list --env="" 2>&1 | grep "Version ID:" | tail -1 | awk '{print $NF}')
        echo "Deploying $LATEST to 100%..."
        bun x wrangler versions deploy "$LATEST@100" --env="" --yes

  "deploy:canary":
    desc: Deploy with gradual traffic split (interactive)
    cmds:
      - cd {{.WORKER_DIR}} && bun x wrangler versions deploy
  "deploy:rollback":
    desc: Roll back to previous version
    cmds:
      - cd {{.WORKER_DIR}} && bun x wrangler rollback
  "deploy:versions":
    desc: List recent versions (tags, dates, authors)
    cmds:
      - cd {{.WORKER_DIR}} && bun x wrangler versions list
  "deploy:list":
    desc: Show all preview URLs (versions + PR previews)
    dir: "{{.ROOT_DIR}}/systems/truck/worker"
    cmds:
      - |
        VERSIONS=$(bun x wrangler versions list --env="" 2>&1 | \
          awk '/^Version ID:/{id=$NF} /^Created:/{ts=$NF} /^Tag:/{tag=$NF; if(tag!="-") print id, ts, tag}' | \
          sort -k2 -r)

        echo "=== Release Versions ==="
        echo ""
        echo "$VERSIONS" | grep "^.* .* v[0-9]" | while read VID TS TAG; do
          SLUG=$(echo "$TAG" | sed 's/^v//' | tr '.' '-')
          echo "  $TAG  ($TS)"
          echo "    https://v${SLUG}-truck-cad.gedw99.workers.dev"
          echo ""
        done

        PR_LINES=$(echo "$VERSIONS" | grep "^.* .* pr-" || true)
        if [ -n "$PR_LINES" ]; then
          echo "=== PR Previews ==="
          echo ""
          echo "$PR_LINES" | while read VID TS TAG; do
            echo "  $TAG  ($TS)"
            echo "    https://${TAG}-truck-cad.gedw99.workers.dev"
            echo ""
          done
        fi

        echo "Production:  https://cad.ubuntusoftware.net"
        echo "Dashboard:   https://dash.cloudflare.com/7384af54e33b8a54ff240371ea368440/workers/services/view/truck-cad/production/deployments"

  "deploy:status":
    desc: Show current deployment (versions + traffic split)
    cmds:
      - cd {{.WORKER_DIR}} && bun x wrangler deployments list
  "deploy:preview":
    desc: "Upload preview version with alias (pr-{N}-truck-cad.gedw99.workers.dev)"
    deps: ["gui:build", "deploy:setup"]
    vars:
      PR_NUMBER: '{{.PR_NUMBER | default "preview"}}'
    cmds:
      - cd {{.WORKER_DIR}} && bun install && bun x wrangler versions upload --env="" --tag "pr-{{.PR_NUMBER}}" --message "PR #{{.PR_NUMBER}} — v{{.CAD_VERSION}}" --preview-alias "pr-{{.PR_NUMBER}}"
      - |
        echo ""
        echo 'Preview: https://pr-{{.PR_NUMBER}}-truck-cad.gedw99.workers.dev'
        echo 'Production untouched: https://cad.ubuntusoftware.net'

  "deploy:full":
    desc: Deploy Worker + publish docs to R2
    cmds:
      - task: gui:deploy
      - task: docs:publish

  # --- Visual Examples (opens window) ---

  "run:shape-viewer":
    desc: View JSON shapes (drag & drop)
    deps: ["deps:install"]
    cmds:
      - open {{.TRUCK_SRC_DIR}}/resources/shape/
      - '{{.BIN_DIR}}/simple-shape-viewer'

  "run:obj-viewer":
    desc: View OBJ meshes (drag & drop)
    deps: ["deps:clone"]
    cmds:
      - open {{.TRUCK_SRC_DIR}}/resources/obj/
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example simple-obj-viewer

  # --- Generate JSON (stdout) ---

  "make:cube":
    desc: Generate cube JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example cube

  "make:sphere":
    desc: Generate sphere JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example sphere

  "make:cylinder":
    desc: Generate cylinder JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example cylinder

  "make:torus":
    desc: Generate torus JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example torus

  "make:bottle":
    desc: Generate bottle JSON
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example bottle

  # --- Resources ---

  "resources:list":
    desc: List sample files
    deps: ["deps:clone"]
    cmds:
      - ls {{.TRUCK_SRC_DIR}}/resources/shape/ {{.TRUCK_SRC_DIR}}/resources/obj/
