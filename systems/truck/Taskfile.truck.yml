version: '3'

# Truck CAD system — crate + worker + web + tests

vars:
  SYSTEM_DIR: '{{.ROOT_DIR}}/systems/truck'
  SRC_DIR: '{{.ROOT_DIR}}/.src'
  TRUCK_SRC_DIR: '{{.SRC_DIR}}/truck'
  TRUCK_FORK: 'github.com/joeblew999/truck'
  TRUCK_UPSTREAM: 'github.com/ricosjp/truck'
  IFC_LITE_SRC_DIR: '{{.SRC_DIR}}/ifc-lite'
  EZPZ_SRC_DIR: '{{.SRC_DIR}}/ezpz'
  LOCAL_URL:
    sh: echo "http://localhost:$(grep '^port' {{.SYSTEM_DIR}}/worker/wrangler.toml | head -1 | tr -dc '0-9')"
  BASE_URL:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config workers.worker.production
  SCHEMA_FILE:
    sh: echo "{{.ROOT_DIR}}/$(cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config version.source)"
  CAD_VERSION:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.SCHEMA_FILE}}','utf8')).version)"

tasks:

  # --- Setup ---

  "deps:clone":
    desc: Clone source dependencies (.src/truck, ifc-lite, ezpz)
    cmds:
      - mkdir -p {{.SRC_DIR}}
      - |
        if [ ! -f {{.TRUCK_SRC_DIR}}/Cargo.toml ]; then
          git clone https://{{.TRUCK_FORK}}.git {{.TRUCK_SRC_DIR}}
          cd {{.TRUCK_SRC_DIR}} && git remote add upstream https://{{.TRUCK_UPSTREAM}}.git || true
          cd {{.TRUCK_SRC_DIR}} && git submodule update --init
        fi
      - test -d {{.IFC_LITE_SRC_DIR}}/.git || GIT_LFS_SKIP_SMUDGE=1 git clone https://github.com/louistrue/ifc-lite.git {{.IFC_LITE_SRC_DIR}}
      - test -d {{.EZPZ_SRC_DIR}}/.git || git clone https://github.com/KittyCAD/ezpz.git {{.EZPZ_SRC_DIR}}

  upgrade:
    desc: Pull latest truck fork
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git pull origin master && git submodule update --init

  check:
    desc: Cargo check (fast compile test)
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo check
      - cd {{.SYSTEM_DIR}}/crate && cargo check

  # --- Build ---

  "wasm:build":
    desc: Build headless WASM (for Worker)
    cmds:
      - cd {{.SYSTEM_DIR}}/crate && wasm-pack build --target bundler --no-default-features --out-dir {{.SYSTEM_DIR}}/worker/pkg

  "wasm:build-browser":
    desc: Build browser WASM (with rendering)
    deps: ["deps:clone"]
    cmds:
      - cd {{.SYSTEM_DIR}}/crate && wasm-pack build --target web --release --out-dir {{.SYSTEM_DIR}}/web/pkg-browser-renderer

  "gui:schema":
    desc: Generate cad-schema.json from Rust structs
    dir: "{{.SYSTEM_DIR}}/crate"
    sources: [src/**/*.rs, Cargo.toml]
    generates: ["{{.SCHEMA_FILE}}"]
    cmds:
      - cargo run --bin generate-schema 2>/dev/null > {{.SCHEMA_FILE}}

  "gui:build":
    desc: Build browser WASM + schema
    deps: ["wasm:build-browser"]
    cmds:
      - task: gui:schema
      - cp {{.SYSTEM_DIR}}/llms.txt {{.SYSTEM_DIR}}/web/llms.txt

  "mcp:bootstrap":
    desc: Bootstrap MCP (schema + deps + configs)
    deps: ["gui:schema"]
    cmds:
      - cd {{.ROOT_DIR}}/scripts && bun install --silent
      - '{{.ROOT_DIR}}/scripts/mcp-setup.sh'

  # --- Serve ---

  "gui:serve":
    desc: Local dev server (builds first, starts wrangler)
    deps: ["gui:build", "mcp:bootstrap"]
    preconditions:
      - sh: test -f {{.SYSTEM_DIR}}/web/vendor/lit.js
        msg: "vendor/lit.js missing — run: git checkout HEAD -- systems/truck/web/vendor/lit.js"
    cmds:
      - cd {{.SYSTEM_DIR}}/worker && bun install --silent && exec bun x wrangler dev

  # --- Watch (used by process-compose) ---

  "watch:gui":
    desc: Watch Rust src → rebuild browser WASM + schema
    cmds:
      - watchexec -w {{.SYSTEM_DIR}}/crate/src -e rs -- "task truck:gui:build"

  "watch:worker":
    desc: Watch Rust src → rebuild headless WASM
    cmds:
      - watchexec -w {{.SYSTEM_DIR}}/crate/src -e rs -- "task truck:wasm:build"

  # --- Test ---

  "test:crate":
    desc: Rust crate tests
    deps: ["deps:clone"]
    cmds:
      - cd {{.SYSTEM_DIR}}/crate && cargo test

  "test:api":
    desc: Worker API + MCP contract tests (vitest)
    cmds:
      - cd {{.SYSTEM_DIR}}/worker && bun x vitest run

  "test:e2e":
    desc: Playwright E2E tests (requires dev server running)
    cmds:
      - cd {{.SYSTEM_DIR}}/tests && bun install && bun x playwright install chromium
      - |
        if ! curl -sf {{.LOCAL_URL}}/api/health > /dev/null 2>&1; then
          echo "FAIL: dev server not running at {{.LOCAL_URL}} → run: task up"
          exit 1
        fi
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test --project=e2e

  "test:all":
    desc: All tests (requires dev server running)
    cmds:
      - task: test:api
      - cd {{.SYSTEM_DIR}}/tests && bun install && bun x playwright install chromium
      - |
        if ! curl -sf {{.LOCAL_URL}}/api/health > /dev/null 2>&1; then
          echo "FAIL: dev server not running at {{.LOCAL_URL}} → run: task up"
          exit 1
        fi
      - cd {{.SYSTEM_DIR}}/tests && SCREENSHOTS=1 EXAMPLES=1 bun x playwright test --project=e2e
      - cd {{.SYSTEM_DIR}}/tests && bun x playwright test --project=ui

  "test:full":
    desc: Build + start + test + stop (standalone)
    cmds:
      - task: gui:build
      - task: :up:detached
      - |
        for i in {1..30}; do
          curl -sf {{.LOCAL_URL}}/api/health > /dev/null 2>&1 && break
          [ $i -eq 30 ] && echo "Server failed to start" && exit 1
          sleep 1
        done
      - task: test:all
      - task: :down

  ci:
    desc: Full CI pipeline
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo check
      - cd {{.TRUCK_SRC_DIR}} && cargo test --workspace --exclude truck-platform --exclude truck-rendimpl --exclude truck-base
      - cd {{.SYSTEM_DIR}}/crate && cargo test
      - cd {{.SYSTEM_DIR}}/crate && wasm-pack build --target web --release --out-dir {{.SYSTEM_DIR}}/web/pkg-browser-renderer

  # --- Version ---

  "version:current":
    desc: Show current version
    cmds: ['echo "v{{.CAD_VERSION}}"']
    silent: true

  "version:bump":
    desc: "Bump version (usage: task truck:version:bump -- 0.8.0)"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task truck:version:bump -- 0.8.0"
      - sh: 'echo "{{.CLI_ARGS}}" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"'
        msg: "Invalid semver"
    cmds:
      - |
        MOD_RS="{{.SYSTEM_DIR}}/crate/src/commands/mod.rs"
        bun -e "
          const fs = require('fs');
          const f = process.env.MOD_RS;
          fs.writeFileSync(f, fs.readFileSync(f,'utf8').replace(/\"version\":\s*\"[0-9]+\.[0-9]+\.[0-9]+\"/, '\"version\": \"{{.CLI_ARGS}}\"'));
        "
      - task: gui:schema
      - |
        cd {{.ROOT_DIR}}
        git add systems/truck/crate/src/commands/mod.rs {{.SCHEMA_FILE}}
        git commit -m "release: v{{.CLI_ARGS}}"
        git tag "v{{.CLI_ARGS}}"
        echo "Bumped to v{{.CLI_ARGS}}"

  # --- Deploy ---

  "gui:deploy":
    desc: Build + upload + smoke (truck worker only)
    deps: ["gui:build"]
    cmds:
      - task: :cf:upload
      - task: :cf:versions
      - task: :cf:smoke

  smoke:
    desc: Full smoke (generic + truck-specific)
    cmds:
      - task: :cf:smoke
      - task: smoke:extra

  "smoke:extra":
    desc: Truck-specific smoke (schema + MCP)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        URL="${SMOKE_URL:-{{.BASE_URL}}}"
        echo "Truck checks: $URL"
        SCHEMA=$(curl -sf "$URL/api/cad/schema") || { echo "FAIL: /api/cad/schema"; exit 1; }
        echo "  schema: OK ($(echo "$SCHEMA" | bun -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); process.stdout.write(d.version+' '+Object.keys(d.commands).length+' commands')"))"
        MCP=$(curl -sf "$URL/mcp" -X POST -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}') || { echo "FAIL: /mcp"; exit 1; }
        echo "  mcp:    OK ($(echo "$MCP" | bun -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).result?.tools?.length||0))+' tools'"))"
        echo "PASS"

  # --- Fork (upstream truck management) ---

  "fork:sync":
    desc: Sync fork with upstream
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git fetch upstream && git checkout master && git merge upstream/master --ff-only && git push origin master

  "fork:switch":
    desc: "Switch .src/truck branch (usage: task truck:fork:switch -- remote/branch)"
    deps: ["deps:clone"]
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task truck:fork:switch -- <remote/branch>"
    cmds:
      - |
        cd {{.TRUCK_SRC_DIR}}
        BRANCH="test/$(echo '{{.CLI_ARGS}}' | tr '/' '-')"
        git fetch $(echo '{{.CLI_ARGS}}' | cut -d'/' -f1) --no-recurse-submodules 2>/dev/null || true
        git checkout -b "$BRANCH" "{{.CLI_ARGS}}" 2>/dev/null || git checkout "$BRANCH"
        echo "Now on: $(git branch --show-current) @ $(git rev-parse --short HEAD)"

  "fork:reset":
    desc: Switch .src/truck back to master
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && git checkout master

  # --- Visual (opens native window) ---

  "run:shape-viewer":
    desc: View JSON shapes (drag & drop)
    deps: ["deps:clone"]
    cmds:
      - cd {{.TRUCK_SRC_DIR}} && cargo run --release --example simple-shape-viewer
