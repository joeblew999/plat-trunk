# ───────────────────────────────────────────────────────
# truck-cad — CAD kernel sub-worker
# ───────────────────────────────────────────────────────
#
# Rust/WASM B-Rep CAD engine exposed as:
#   - REST API (/api/*)
#   - MCP endpoint (/mcp)
#   - Web UI (static assets from ../web)
#
# Accessed via TRUCK service binding from plat-router.
# Direct: http://localhost:8789 (dev) or https://truck-cad.gedw99.workers.dev
#
# Build: bun run build:truck  (wasm-pack + schema generation)
# Test:  bun run test:api     (vitest)
# ───────────────────────────────────────────────────────

name = "truck-cad"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Web UI — static assets served at the edge
# Source: systems/truck/web/dist/ (built by Vite: bun run build:truck-web)
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "none"

# R2 bucket for persistent model storage
[[r2_buckets]]
binding = "MODELS"
bucket_name = "cad-documents"

# D1 database for truck-sync op log (ADR-0036 Step 8)
[[d1_databases]]
binding = "OP_LOG_DB"
database_name = "cad-op-log"
database_id = "616ba28e-c967-4d34-95cd-fa3fe6d141a8"
migrations_dir = "migrations"

[dev]
ip = "0.0.0.0"
port = 8789
inspector_port = 9230
local_protocol = "http"
