# ───────────────────────────────────────────────────────
# truck-cad — CAD kernel sub-worker
# ───────────────────────────────────────────────────────
#
# Rust/WASM B-Rep CAD engine exposed as:
#   - REST API (/api/*)
#   - MCP endpoint (/mcp)
#   - Web UI (static assets from ../web)
#
# Accessed via TRUCK service binding from plat-router.
# Direct: http://localhost:8789 (dev) or https://truck-cad.gedw99.workers.dev
#
# Build: bun run build:truck  (wasm-pack + schema generation)
# Test:  bun run test:api     (vitest)
# ───────────────────────────────────────────────────────

name = "truck-cad"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Web UI — static assets served at the edge
# Source: systems/truck/web/dist/ (built by Vite via bun run build:truck)
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "none"

# R2 bucket for persistent model storage
[[r2_buckets]]
binding = "MODELS"
bucket_name = "cad-documents"

# Auth worker — session verification via service binding (no public HTTP)
# optional = true: allows tests + local dev to run without auth-worker
[[services]]
binding = "AUTH"
service = "auth-worker"
optional = true

# ── Real-time CRDT sync via PartyKit / automerge-partyserver ────────────────
# Each CAD model gets its own DO instance:
#   /parties/ops/{modelId}       — Automerge CRDT op log (automerge-partyserver)
#   /parties/presence/{modelId}  — Ephemeral cursor/selection broadcast
[durable_objects]
bindings = [
  { name = "OPS",      class_name = "Ops" },
  { name = "PRESENCE", class_name = "Presence" },
]

[[migrations]]
tag = "v1"
new_classes = ["Ops", "Presence"]

# Feature flags
[vars]
# Set to "true" to require authentication on the /mcp endpoint.
# Leave unset or "false" to keep MCP open (useful for local dev + AI agent testing).
MCP_AUTH_ENABLED = "false"

# ─── CF-native Observability ────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.05

[dev]
ip = "0.0.0.0"
port = 8789
inspector_port = 9230
local_protocol = "http"
