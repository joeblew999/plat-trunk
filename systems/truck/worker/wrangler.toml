# Keep name, routes, port in sync with cf-deploy.json
# (wrangler.toml can't import JSON)
name = "truck-cad"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
preview_urls = true

# Custom domain: cad.ubuntusoftware.net
# Also keeps truck-cad.gedw99.workers.dev active
routes = [
  { pattern = "cad.ubuntusoftware.net", custom_domain = true },
]

# Serve systems/truck/web/ as static assets at the edge (no worker overhead).
# not_found_handling = "none" passes unmatched paths to the worker, which handles:
#   /api/*, /mcp, /docs/*, /test/*, /model/* (redirect to /?model=:id)
[assets]
directory = "../web"
not_found_handling = "none"

[[r2_buckets]]
binding = "CAD_DOCS_BUCKET"
bucket_name = "cad-documents"

[[services]]
binding = "DOCS"
service = "docs-worker"

[[services]]
binding = "TEST"
service = "test-worker"

[vars]
MY_VAR = "hello world"

[dev]
ip = "0.0.0.0"
port = 8788
local_protocol = "http"

# PR previews use --preview-alias on the main Worker (not a separate env).
# Example: pr-42-truck-cad.gedw99.workers.dev
# See: task truck:deploy:preview PR_NUMBER=42
