# Truck CAD sub-worker — API, MCP, SSE, WASM.
# Accessed via service binding from the root router.
name = "truck-cad"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
preview_urls = true

# Serve web UI as static assets at the edge
[assets]
directory = "../web"
not_found_handling = "none"

[[r2_buckets]]
binding = "CAD_DOCS_BUCKET"
bucket_name = "cad-documents"

[vars]
MY_VAR = "hello world"

[dev]
ip = "0.0.0.0"
port = 8789
inspector_port = 9230
local_protocol = "http"
