name = "truck-cad"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# Custom domain: cad.ubuntusoftware.net
# Also keeps truck-cad.gedw99.workers.dev active
routes = [
  { pattern = "cad.ubuntusoftware.net", custom_domain = true },
]

# Serve web/gui/ as static assets — HTML, JS, WASM all served from the edge
# SPA routing: /model/:id paths serve index.html (JS reads pathname for modelId)
[assets]
directory = "../../../web/gui"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "cad-docs"

[[r2_buckets]]
binding = "CAD_DOCS_BUCKET"
bucket_name = "cad-documents"

[vars]
MY_VAR = "hello world"

[dev]
ip = "0.0.0.0"
port = 8788
local_protocol = "http"

# Preview environment — branch testing without touching production
# Deploys to: truck-cad-preview.gedw99.workers.dev
# Usage: task truck:deploy:preview
[env.preview]
name = "truck-cad-preview"
workers_dev = true
routes = []
