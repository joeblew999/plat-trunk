# Keep name, routes, port, r2 bucket_name in sync with cf-deploy.json
# (wrangler.toml can't import JSON)
name = "truck-cad"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
preview_urls = true

# Custom domain: cad.ubuntusoftware.net
# Also keeps truck-cad.gedw99.workers.dev active
routes = [
  { pattern = "cad.ubuntusoftware.net", custom_domain = true },
]

# Serve systems/truck/web/ as static assets — HTML, JS, WASM all served from the edge
# SPA routing: /model/:id paths serve index.html (JS reads pathname for modelId)
[assets]
directory = "../web"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "PAGES_BUCKET"
bucket_name = "cad-docs"

[[r2_buckets]]
binding = "CAD_DOCS_BUCKET"
bucket_name = "cad-documents"

[[services]]
binding = "DOCS"
service = "docs-worker"

[vars]
MY_VAR = "hello world"

[dev]
ip = "0.0.0.0"
port = 8788
local_protocol = "http"

# PR previews use --preview-alias on the main Worker (not a separate env).
# Example: pr-42-truck-cad.gedw99.workers.dev
# See: task truck:deploy:preview PR_NUMBER=42
