version: '3'

# ============================================================================
# Docs — VitePress site on Workers Static Assets (ADR-0027, ADR-0031)
# https://vitepress.dev/ — same setup as hono.dev
#
# Quick start:
#   task vitepress:serve       # Local preview (VitePress HMR, port 5173)
#   task vitepress:build       # Build for production
#   task vitepress:worker:dev  # Serve via docs Worker (port 5174)
#   task vitepress:worker:deploy # Deploy to Cloudflare
#   task vitepress:screenshots # Generate screenshots + videos from E2E tests
#
# Required var: ROOT_DIR (passed by parent include)
# ============================================================================

vars:
  DOCS_DIR: '{{.ROOT_DIR}}/systems/docs'
  WEBSITE_DIR: '{{.ROOT_DIR}}/systems/docs/website'
  DOCS_WORKER_DIR: '{{.ROOT_DIR}}/systems/docs/worker'
  LOCAL_PAGES_URL: 'http://localhost:5173'
  LOCAL_WORKER_URL: 'http://localhost:5174'
  DOCS_PROD_URL:
    sh: cd {{.ROOT_DIR}} && bun scripts/cf-deploy.ts config docs.production 2>/dev/null || echo "https://docs.ubuntusoftware.net"

tasks:
  default:
    internal: true
    cmds:
      - task: debug:self

  # ===========================================================================
  # Debug
  # ===========================================================================
  "debug:self":
    desc: Print pages vars
    silent: true
    cmds:
      - |
        echo "=== Pages ==="
        echo "  ROOT_DIR:        {{.ROOT_DIR}}"
        echo "  DOCS_DIR:        {{.DOCS_DIR}}"
        echo "  WEBSITE_DIR:     {{.WEBSITE_DIR}}"
        echo "  DOCS_WORKER_DIR: {{.DOCS_WORKER_DIR}}"
        echo "  LOCAL_PAGES_URL: {{.LOCAL_PAGES_URL}}"
        echo "  LOCAL_WORKER_URL: {{.LOCAL_WORKER_URL}}"
        echo "  DOCS_PROD_URL:   {{.DOCS_PROD_URL}}"
        echo ""
        echo "=== VitePress ==="
        cd {{.WEBSITE_DIR}} && bun -e "console.log('  version:', require('vitepress/package.json').version)" 2>/dev/null || echo "  not installed (run: cd website && bun install)"

  # ===========================================================================
  # Dependencies
  # ===========================================================================
  "deps:install":
    desc: Install VitePress dependencies
    dir: '{{.WEBSITE_DIR}}'
    cmds:
      - bun install
    status:
      - test -d {{.WEBSITE_DIR}}/node_modules/vitepress

  # ===========================================================================
  # Serve & Build
  # ===========================================================================
  serve:
    desc: Start VitePress dev server
    deps: ["deps:install"]
    dir: '{{.WEBSITE_DIR}}'
    cmds:
      - echo "Pages server starting at {{.LOCAL_PAGES_URL}}"
      - cd {{.WEBSITE_DIR}} && bun run dev

  build:
    desc: Build VitePress static site for production
    deps: ["deps:install"]
    dir: '{{.WEBSITE_DIR}}'
    cmds:
      - cd {{.WEBSITE_DIR}} && bun scripts/build-llm-docs.ts
      - cd {{.WEBSITE_DIR}} && bun run build
      - echo "Site built at {{.WEBSITE_DIR}}/.vitepress/dist/"

  # ===========================================================================
  # Screenshots & Videos
  # ===========================================================================
  screenshots:
    desc: Generate doc screenshots + videos from E2E tests
    cmds:
      - cd {{.ROOT_DIR}}/systems/truck/tests && DOCS=1 SLOW=1 bun x playwright test --project=e2e

  # ===========================================================================
  # Open in browser
  # ===========================================================================
  open:
    desc: Open pages site in browser (local)
    cmds:
      - open {{.LOCAL_PAGES_URL}}

  "open:prod":
    desc: Open production docs site in browser
    cmds:
      - open {{.DOCS_PROD_URL}}

  # ===========================================================================
  # List
  # ===========================================================================
  list:
    desc: List all docs in the website
    silent: true
    cmds:
      - |
        echo "=== User Docs ==="
        ls {{.WEBSITE_DIR}}/docs/user/*.md 2>/dev/null | xargs -I{} basename {}
        echo ""
        echo "=== Technical Docs ==="
        ls {{.WEBSITE_DIR}}/docs/technical/*.md 2>/dev/null | xargs -I{} basename {}
        echo ""
        echo "=== Other ==="
        ls {{.WEBSITE_DIR}}/docs/ROADMAP.md 2>/dev/null | xargs -I{} basename {}

  # ===========================================================================
  # Clean
  # ===========================================================================
  clean:
    desc: Remove VitePress build artifacts
    cmds:
      - rm -rf {{.WEBSITE_DIR}}/.vitepress/dist
      - rm -rf {{.WEBSITE_DIR}}/.vitepress/cache

  # ===========================================================================
  # Worker — Workers Static Assets (ADR-0031)
  # Serves VitePress dist via a Cloudflare Worker instead of Pages.
  # ===========================================================================

  "worker:deps":
    desc: Install docs Worker dependencies
    internal: true
    dir: '{{.DOCS_WORKER_DIR}}'
    cmds:
      - bun install --silent
    status:
      - test -d {{.DOCS_WORKER_DIR}}/node_modules/wrangler

  "worker:dev":
    desc: Serve docs via Worker locally (port 5174)
    deps: ["worker:deps", "build"]
    dir: '{{.DOCS_WORKER_DIR}}'
    cmds:
      - echo "Docs Worker starting at {{.LOCAL_WORKER_URL}}"
      - bun x wrangler dev

  "worker:deploy":
    desc: Deploy docs Worker to Cloudflare
    deps: ["worker:deps", "build"]
    dir: '{{.DOCS_WORKER_DIR}}'
    cmds:
      - bun x wrangler deploy
      - echo "Deployed → {{.DOCS_PROD_URL}}"

  "worker:status":
    desc: Show docs Worker deployment info
    deps: ["worker:deps"]
    dir: '{{.DOCS_WORKER_DIR}}'
    cmds:
      - bun x wrangler deployments list
