version: '3'

# ============================================================================
# Docs - VitePress Documentation Site (ADR-0027)
# https://vitepress.dev/ — same setup as hono.dev
#
# Quick start:
#   task docs:serve       # Local preview at http://localhost:5173
#   task docs:build       # Build for production
#   task docs:deploy      # Deploy to Cloudflare Pages
#   task docs:screenshots # Generate screenshots + videos from E2E tests
# ============================================================================

vars:
  ROOT_DIR: '{{.ROOT_DIR | default "."}}'
  WEBSITE_DIR: '{{.ROOT_DIR}}/website'
  PAGES_PROJECT: 'cad-docs'
  PAGES_DOMAIN: 'cad-docs.pages.dev'
  PRODUCTION_URL: 'https://docs.ubuntusoftware.net'
  GITHUB_REPO: 'joeblew999/plat-trunk'
  APP_VERSION:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.ROOT_DIR}}/web/cad-schema.json','utf8')).version)" 2>/dev/null || echo "0.0.0"
  VERSION_SLUG:
    sh: bun -e "process.stdout.write(JSON.parse(require('fs').readFileSync('{{.ROOT_DIR}}/web/cad-schema.json','utf8')).version.replaceAll('.','-'))" 2>/dev/null || echo "0-0-0"

tasks:
  default:
    internal: true
    cmds:
      - task: debug:self

  # ===========================================================================
  # Debug
  # ===========================================================================
  "debug:self":
    desc: Print docs vars
    cmds:
      - echo "=== Docs Vars ==="
      - echo "ROOT_DIR={{.ROOT_DIR}}"
      - echo "WEBSITE_DIR={{.WEBSITE_DIR}}"
      - echo "---"
      - cmd: cd {{.WEBSITE_DIR}} && bunx vitepress --version 2>/dev/null || echo "VitePress not installed (run cd website && bun install)"
      - echo "---"
      - echo "Docs URL (local)  → http://localhost:5173"
      - echo "Docs URL (prod)   → https://docs.ubuntusoftware.net"
      - echo "CAD App URL       → https://cad.ubuntusoftware.net"
    silent: true

  # ===========================================================================
  # Dependencies
  # ===========================================================================
  "deps:install":
    desc: Install VitePress dependencies
    dir: '{{.WEBSITE_DIR}}'
    cmds:
      - bun install
    status:
      - test -d {{.WEBSITE_DIR}}/node_modules/vitepress

  # ===========================================================================
  # Serve & Build
  # ===========================================================================
  serve:
    desc: Start VitePress dev server (http://localhost:5173)
    deps: ["deps:install"]
    dir: '{{.WEBSITE_DIR}}'
    cmds:
      - echo "Docs server starting at http://localhost:5173"
      - bunx vitepress dev

  build:
    desc: Build VitePress static site for production
    deps: ["deps:install"]
    dir: '{{.WEBSITE_DIR}}'
    cmds:
      - cd {{.WEBSITE_DIR}} && bun scripts/build-llm-docs.ts
      - cd {{.WEBSITE_DIR}} && bunx vitepress build
      - echo "Site built at {{.WEBSITE_DIR}}/.vitepress/dist/"

  # ===========================================================================
  # Versioned Deploy Lifecycle (mirrors Worker pattern in Taskfile.cloudflare.yml)
  # ===========================================================================

  upload:
    desc: "Build + upload versioned docs (v{{.VERSION_SLUG}}.{{.PAGES_DOMAIN}}) — does NOT update production"
    deps: ["build"]
    dir: '{{.WEBSITE_DIR}}'
    cmds:
      - bunx wrangler pages deploy .vitepress/dist --project-name={{.PAGES_PROJECT}} --branch v{{.VERSION_SLUG}} --commit-dirty=true
      - task: "versions:json"
      - 'echo "Uploaded v{{.APP_VERSION}} → https://v{{.VERSION_SLUG}}.{{.PAGES_DOMAIN}}"'
      - 'echo "To promote to production: task docs:promote"'

  promote:
    desc: Deploy latest build to production (updates custom domain)
    dir: '{{.WEBSITE_DIR}}'
    preconditions:
      - sh: test -d .vitepress/dist
        msg: "No build found — run task docs:upload first"
    cmds:
      - bunx wrangler pages deploy .vitepress/dist --project-name={{.PAGES_PROJECT}} --branch main --commit-dirty=true
      - 'echo "Promoted to production → {{.PRODUCTION_URL}}"'

  deploy:
    desc: "Deploy docs (build + upload v{{.VERSION_SLUG}} + promote to production)"
    deps: ["build"]
    dir: '{{.WEBSITE_DIR}}'
    cmds:
      - bunx wrangler pages deploy .vitepress/dist --project-name={{.PAGES_PROJECT}} --branch v{{.VERSION_SLUG}} --commit-dirty=true
      - bunx wrangler pages deploy .vitepress/dist --project-name={{.PAGES_PROJECT}} --branch main --commit-dirty=true
      - task: "versions:json"
      - 'echo "Deployed v{{.APP_VERSION}} → {{.PRODUCTION_URL}}"'

  preview:
    desc: "Upload PR preview docs"
    deps: ["build"]
    dir: '{{.WEBSITE_DIR}}'
    vars:
      PR_NUMBER: '{{.PR_NUMBER | default "preview"}}'
    cmds:
      - bunx wrangler pages deploy .vitepress/dist --project-name={{.PAGES_PROJECT}} --branch pr-{{.PR_NUMBER}} --commit-dirty=true
      - 'echo "Preview → https://pr-{{.PR_NUMBER}}.{{.PAGES_DOMAIN}}"'

  smoke:
    desc: Smoke test a deployed docs URL
    vars:
      SMOKE_URL: '{{.SMOKE_URL | default .PRODUCTION_URL}}'
    cmds:
      - |
        URL="{{.SMOKE_URL}}"
        echo "Smoke testing: $URL"
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
        SIZE=$(curl -s -o /dev/null -w "%{size_download}" "$URL/")
        if [ "$STATUS" = "200" ]; then
          echo "  index:  OK (HTTP ${STATUS}, ${SIZE} bytes)"
        else
          echo "  FAIL:   HTTP ${STATUS}"
          exit 1
        fi
        LLMS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/llms.txt")
        echo "  llms:   OK (HTTP ${LLMS_STATUS})"
        echo ""
        echo "PASS: $URL"

  "versions:json":
    desc: Generate docs-versions.json (parallel to web/gui/versions.json)
    cmds:
      - cd {{.ROOT_DIR}} && ROOT_DIR={{.ROOT_DIR}} PAGES_PROJECT={{.PAGES_PROJECT}} PRODUCTION_URL={{.PRODUCTION_URL}} GITHUB_REPO={{.GITHUB_REPO}} OUTPUT_FILE={{.ROOT_DIR}}/website/docs-versions.json bun scripts/pages-versions-json.ts
    silent: true

  "versions:list":
    desc: List recent Pages deployments
    cmds:
      - bunx wrangler pages deployment list --project-name={{.PAGES_PROJECT}}

  # ===========================================================================
  # Screenshots & Videos
  # ===========================================================================
  screenshots:
    desc: Generate doc screenshots + videos from E2E tests
    cmds:
      - cd {{.ROOT_DIR}}/tests && DOCS=1 SLOW=1 bunx playwright test --project=e2e

  # ===========================================================================
  # Open in browser
  # ===========================================================================
  open:
    desc: Open docs site in browser (local)
    cmds:
      - open http://localhost:5173

  "open:prod":
    desc: Open production docs site in browser
    cmds:
      - open {{.PRODUCTION_URL}}

  # ===========================================================================
  # List
  # ===========================================================================
  list:
    desc: List all docs in the website
    cmds:
      - |
        echo "=== User Docs ==="
        ls {{.WEBSITE_DIR}}/docs/user/*.md 2>/dev/null | xargs -I{} basename {}
        echo ""
        echo "=== Technical Docs ==="
        ls {{.WEBSITE_DIR}}/docs/technical/*.md 2>/dev/null | xargs -I{} basename {}
        echo ""
        echo "=== Other ==="
        ls {{.WEBSITE_DIR}}/docs/ROADMAP.md 2>/dev/null | xargs -I{} basename {}
    silent: true

  # ===========================================================================
  # Clean
  # ===========================================================================
  clean:
    desc: Remove VitePress build artifacts
    cmds:
      - rm -rf {{.WEBSITE_DIR}}/.vitepress/dist
      - rm -rf {{.WEBSITE_DIR}}/.vitepress/cache
