# Docs Worker — serves VitePress static site via Workers Static Assets (ADR-0031)
# Accessed via service binding from truck-cad Worker at /docs/*
name = "docs-worker"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Serve VitePress build output as static assets
[assets]
directory = "../website/.vitepress/dist"
binding = "ASSETS"
not_found_handling = "404-page"

[dev]
ip = "0.0.0.0"
port = 5174
local_protocol = "http"
