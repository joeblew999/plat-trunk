# Docs Worker — serves VitePress static site via Workers Static Assets (ADR-0031)
# Accessed via service binding from truck-cad Worker at /docs/*
#
# Runs as separate wrangler dev process locally (miniflare multi-config
# shares the primary worker's asset directory — Cloudflare docs recommend
# separate processes for workers with independent static assets).
name = "docs-worker"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Serve VitePress build output as static assets
[assets]
directory = "../website/.vitepress/dist"
binding = "ASSETS"
not_found_handling = "404-page"

[dev]
ip = "0.0.0.0"
port = 5174
inspector_port = 9230
local_protocol = "http"
