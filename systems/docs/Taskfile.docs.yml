version: '3'

# ============================================================================
# Docs - Hugo Documentation Site (hugo-book theme)
# https://gohugo.io/
#
# Generates a static docs site from markdown in docs/ and serves via Cloudflare.
#
# Quick start:
#   task docs:serve       # Local preview at http://localhost:1313
#   task docs:build       # Build for production
#   task docs:deploy      # Deploy to Cloudflare Pages
#   task docs:list        # List all docs that will be synced
# ============================================================================

vars:
  ROOT_DIR: '{{.ROOT_DIR | default "."}}'
  DOCS_DIR: '{{.ROOT_DIR}}/docs'
  HUGO_DIR: '{{.DOCS_DIR}}/hugo'
  HUGO_CONTENT_DIR: '{{.HUGO_DIR}}/content/docs'
  HUGO_STATIC_DIR: '{{.HUGO_DIR}}/static'
  DOCS_ASSETS_DIR: '{{.DOCS_DIR}}/assets'

tasks:
  default:
    internal: true
    cmds:
      - task: debug:self

  # ===========================================================================
  # Debug
  # ===========================================================================
  "debug:self":
    desc: Print docs vars
    cmds:
      - echo "=== Docs Vars ==="
      - echo "ROOT_DIR={{.ROOT_DIR}}"
      - echo "DOCS_DIR={{.DOCS_DIR}}"
      - echo "HUGO_DIR={{.HUGO_DIR}}"
      - echo "HUGO_CONTENT_DIR={{.HUGO_CONTENT_DIR}}"
      - echo "---"
      - hugo version 2>/dev/null || echo "Hugo not installed (run task docs:deps:install)"
      - echo "---"
      - echo "Docs URL (local)  → http://localhost:1313"
      - echo "Docs URL (prod)   → https://cad-docs.pages.dev"
      - echo "CAD App URL       → https://cad.ubuntusoftware.net"
    silent: true

  # ===========================================================================
  # Dependencies
  # ===========================================================================
  "deps:install":
    desc: Install Hugo
    cmds:
      - brew install hugo
    status:
      - hugo version

  # ===========================================================================
  # Hugo Site Init
  # ===========================================================================
  init:
    desc: Initialize Hugo site (run once)
    deps: ["deps:install"]
    status:
      - test -f {{.HUGO_DIR}}/hugo.toml
    cmds:
      - hugo new site {{.HUGO_DIR}}
      - echo "Hugo site initialized at {{.HUGO_DIR}}"

  # ===========================================================================
  # Content Sync (markdown docs → Hugo content/docs/)
  # ===========================================================================
  "sync:content":
    desc: Sync markdown docs into Hugo content directory
    deps: ["init"]
    cmds:
      # User docs (getting-started, creating-shapes, sketch-and-extrude, etc.)
      - mkdir -p {{.HUGO_CONTENT_DIR}}/user
      - cp -f {{.DOCS_DIR}}/user/*.md {{.HUGO_CONTENT_DIR}}/user/ 2>/dev/null || true
      # Technical docs (architecture, sketch, automerge, etc.)
      - mkdir -p {{.HUGO_CONTENT_DIR}}/technical
      - cp -f {{.DOCS_DIR}}/technical/*.md {{.HUGO_CONTENT_DIR}}/technical/ 2>/dev/null || true
      # Architecture Decision Records
      - mkdir -p {{.HUGO_CONTENT_DIR}}/adr
      - cp -f {{.DOCS_DIR}}/adr/*.md {{.HUGO_CONTENT_DIR}}/adr/ 2>/dev/null || true
      # Roadmap (into docs root)
      - cp -f {{.DOCS_DIR}}/ROADMAP.md {{.HUGO_CONTENT_DIR}}/roadmap.md 2>/dev/null || true
      # Static assets — screenshots generated by Playwright, lesson videos
      - mkdir -p {{.HUGO_STATIC_DIR}}/screenshots {{.HUGO_STATIC_DIR}}/videos
      - cp -f {{.ROOT_DIR}}/web/gui/docs/screenshots/*.png {{.HUGO_STATIC_DIR}}/screenshots/ 2>/dev/null || true
      - cp -f {{.ROOT_DIR}}/web/gui/docs/lessons/*.webm {{.HUGO_STATIC_DIR}}/videos/ 2>/dev/null || true

  "list":
    desc: List all docs that will be synced to Hugo
    cmds:
      - |
        echo "=== User Docs ==="
        ls {{.DOCS_DIR}}/user/*.md 2>/dev/null | xargs -I{} basename {}
        echo ""
        echo "=== Technical Docs ==="
        ls {{.DOCS_DIR}}/technical/*.md 2>/dev/null | xargs -I{} basename {}
        echo ""
        echo "=== ADR Docs ==="
        ls {{.DOCS_DIR}}/adr/*.md 2>/dev/null | xargs -I{} basename {}
        echo ""
        echo "=== Other ==="
        ls {{.DOCS_DIR}}/ROADMAP.md 2>/dev/null | xargs -I{} basename {}
    silent: true

  # ===========================================================================
  # Serve & Build
  # ===========================================================================
  serve:
    desc: Start Hugo dev server with live reload (http://localhost:1313)
    deps: ["sync:content"]
    cmds:
      - echo "Docs server starting at http://localhost:1313"
      - cd {{.HUGO_DIR}} && hugo serve --bind 0.0.0.0 --port 1313

  build:
    desc: Build Hugo static site for production
    deps: ["sync:content"]
    cmds:
      - cd {{.HUGO_DIR}} && hugo --minify
      - echo "Site built at {{.HUGO_DIR}}/public/"

  # ===========================================================================
  # Deploy to Cloudflare Pages
  # ===========================================================================
  deploy:
    desc: Deploy docs site to Cloudflare Pages (https://cad-docs.pages.dev)
    deps: ["build"]
    cmds:
      - cd {{.HUGO_DIR}} && npx wrangler pages deploy public/ --project-name=cad-docs

  # ===========================================================================
  # Open in browser
  # ===========================================================================
  open:
    desc: Open docs site in browser (local or production)
    cmds:
      - open http://localhost:1313

  "open:prod":
    desc: Open production docs site in browser
    cmds:
      - open https://cad-docs.pages.dev

  # ===========================================================================
  # Clean
  # ===========================================================================
  clean:
    desc: Remove Hugo build artifacts
    cmds:
      - rm -rf {{.HUGO_DIR}}/public
      - rm -rf {{.HUGO_DIR}}/resources
