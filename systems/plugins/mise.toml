# systems/plugins/mise.toml — plugin group orchestrator
#
# Orchestrates all first-party plugins as a group.
# Each plugin owns its own mise.toml for standalone use.
#
# Usage (from systems/plugins/):
#   mise run build       Build all plugins
#   mise run build:dev   Build all plugins in dev mode
#   mise run test        Run all plugin tests
#   mise run ci          Full CI gate for all plugins
#
# To add a new plugin:
#   1. Create systems/plugins/{name}/mise.toml with build/test/ci tasks
#   2. Add it to each task below
#   3. Add it to root mise.toml ci task

[tools]
bun               = "1.3.10"   # JS runtime + package manager
node              = "22"       # Required for vitest
"cargo:wasm-pack" = "0.14.0"  # Rust → WASM build tool

# ── Build ─────────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build all first-party plugins (WASM + TS bundle)"
run = [
  "mise --cd howick run build",
  "mise --cd example run build",
]

[tasks."build:dev"]
description = "Build all plugins in dev mode (faster, larger WASM)"
run = [
  "mise --cd howick run build:dev",
  "mise --cd example run build:dev",
]

# ── Test ──────────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run all plugin tests"
run = [
  "mise --cd howick run test",
  "mise --cd example run test",
]

# ── CI ────────────────────────────────────────────────────────────────────────

[tasks.ci]
description = "Full CI gate for all plugins"
run = [
  "mise --cd howick run ci",
  "mise --cd example run ci",
]
