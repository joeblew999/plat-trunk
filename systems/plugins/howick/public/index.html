<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Howick</title>
  <style>
    :root {
      --bg:      #1c1c2e;
      --surface: #2a2a3d;
      --border:  #3a3a50;
      --accent:  #f59e0b;   /* Howick amber */
      --accent2: #d97706;
      --text:    #e2e2f0;
      --muted:   #9090a8;
      --ok:      #4ade80;
      --err:     #f87171;
      --radius:  5px;
      --font:    system-ui, -apple-system, sans-serif;
    }
    [data-theme="light"] {
      --bg:      #f9f5ee;
      --surface: #ffffff;
      --border:  #ddd8cc;
      --text:    #1c1a14;
      --muted:   #8a8070;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .tab {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.1s, border-color 0.1s;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Panels ── */
    .panel { display: none; flex: 1; overflow-y: auto; padding: 12px; flex-direction: column; gap: 12px; }
    .panel.active { display: flex; }

    /* ── Form rows ── */
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    select, input[type="number"], input[type="text"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 5px 8px;
      width: 100%;
    }
    select:focus, input:focus { outline: 1px solid var(--accent); }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    /* ── Buttons ── */
    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      transition: border-color 0.1s;
      text-align: center;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
    .btn.primary:hover { background: var(--accent2); }
    .btn.full { width: 100%; }

    /* ── Section headings ── */
    h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    /* ── Member list ── */
    .member-list { display: flex; flex-direction: column; gap: 4px; }
    .member-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 8px;
      cursor: pointer;
      transition: border-color 0.1s;
    }
    .member-item:hover { border-color: var(--accent); }
    .member-item .mid { font-size: 11px; font-weight: 600; }
    .member-item .msub { font-size: 10px; color: var(--muted); margin-top: 1px; }

    /* ── Status bar ── */
    .status {
      flex-shrink: 0;
      padding: 4px 12px;
      font-size: 10px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--surface);
      min-height: 22px;
    }
    .status.ok  { color: var(--ok); }
    .status.err { color: var(--err); }
  </style>
</head>
<body>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="member">Member</div>
    <div class="tab" data-tab="wall">Wall</div>
    <div class="tab" data-tab="cutlist">Cut List</div>
    <div class="tab" data-tab="scene">Scene</div>
  </div>

  <!-- ── Tab: Single member ── -->
  <div class="panel active" id="tab-member">
    <h3>Profile</h3>
    <div class="row2">
      <div class="field">
        <label>Profile</label>
        <select id="profile">
          <option value="C">C — stud / rafter</option>
          <option value="U">U — track</option>
          <option value="Z">Z — purlin</option>
          <option value="HAT">Hat — furring</option>
        </select>
      </div>
      <div class="field">
        <label>Gauge (mm)</label>
        <select id="gauge">
          <option value="0.55">0.55</option>
          <option value="0.75" selected>0.75</option>
          <option value="1.00">1.00</option>
          <option value="1.15">1.15</option>
          <option value="1.50">1.50</option>
          <option value="2.00">2.00</option>
        </select>
      </div>
    </div>

    <h3>Dimensions</h3>
    <div class="row3">
      <div class="field">
        <label>Web (mm)</label>
        <input type="number" id="web" value="90" min="50" max="300" step="5">
      </div>
      <div class="field">
        <label>Flange (mm)</label>
        <input type="number" id="flange" value="42" min="20" max="100" step="2">
      </div>
      <div class="field">
        <label>Lip (mm)</label>
        <input type="number" id="lip" value="12" min="0" max="30" step="1">
      </div>
    </div>

    <h3>Member</h3>
    <div class="row2">
      <div class="field">
        <label>Length (mm)</label>
        <input type="number" id="length" value="2700" min="100" max="12000" step="100">
      </div>
      <div class="field">
        <label>Rotation (°)</label>
        <input type="number" id="rotation" value="0" min="-360" max="360" step="90">
      </div>
    </div>

    <h3>Position</h3>
    <div class="row3">
      <div class="field"><label>X (mm)</label><input type="number" id="px" value="0" step="50"></div>
      <div class="field"><label>Y (mm)</label><input type="number" id="py" value="0" step="50"></div>
      <div class="field"><label>Z (mm)</label><input type="number" id="pz" value="0" step="50"></div>
    </div>

    <button class="btn primary full" id="btnAddMember">Add Member</button>
  </div>

  <!-- ── Tab: Wall layout ── -->
  <div class="panel" id="tab-wall">
    <h3>Wall Parameters</h3>
    <div class="row2">
      <div class="field">
        <label>Wall length (mm)</label>
        <input type="number" id="wallLength" value="4800" min="600" step="100">
      </div>
      <div class="field">
        <label>Wall height (mm)</label>
        <input type="number" id="wallHeight" value="2700" min="600" step="100">
      </div>
    </div>

    <h3>Stud Layout</h3>
    <div class="row2">
      <div class="field">
        <label>Stud spacing (mm)</label>
        <select id="spacing">
          <option value="300">300</option>
          <option value="400">400</option>
          <option value="450">450</option>
          <option value="600" selected>600</option>
        </select>
      </div>
      <div class="field">
        <label>Stud gauge</label>
        <select id="wallGauge">
          <option value="0.75" selected>0.75</option>
          <option value="1.00">1.00</option>
          <option value="1.15">1.15</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Stud profile</label>
      <select id="wallProfile">
        <option value="C" selected>C — stud</option>
        <option value="U">U — track</option>
      </select>
    </div>

    <button class="btn primary full" id="btnGenerateWall">Generate Wall Frame</button>
  </div>

  <!-- ── Tab: Cut list ── -->
  <div class="panel" id="tab-cutlist">
    <p style="color:var(--muted);font-size:11px;margin-bottom:8px;">
      Reads all Howick members from the current scene and generates a cut list.
    </p>
    <button class="btn full" id="btnGetCutList">Generate Cut List</button>
    <div id="cutListOutput" style="margin-top:8px;display:none;">
      <h3>Cut List</h3>
      <div id="cutListTable" style="font-size:11px;margin-top:6px;"></div>
      <button class="btn full" style="margin-top:8px;" id="btnExportCutList">Export CSV</button>
    </div>
  </div>

  <!-- ── Tab: Scene objects ── -->
  <div class="panel" id="tab-scene">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 style="border:none;padding:0;">Howick objects</h3>
      <button class="btn" id="btnRefreshScene" style="padding:3px 8px;font-size:11px;">Refresh</button>
    </div>
    <div class="member-list" id="memberList">
      <div style="color:var(--muted);font-size:11px;">No Howick members in scene yet.</div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status" id="status">Connecting…</div>

  <script>
    // ── Tab switching ───────────────────────────────────────────────────────
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'))
        tab.classList.add('active')
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active')
      })
    })

    // ── Status bar ──────────────────────────────────────────────────────────
    const statusEl = document.getElementById('status')
    function setStatus(msg, kind = '') {
      statusEl.textContent = msg
      statusEl.className = 'status ' + kind
    }

    // ── Outbound: send to plugin.ts ─────────────────────────────────────────
    function send(msg) {
      parent.postMessage(msg, '*')
    }

    // ── Member add ──────────────────────────────────────────────────────────
    document.getElementById('btnAddMember').addEventListener('click', () => {
      send({
        type: 'ADD_MEMBER',
        params: {
          profile:  document.getElementById('profile').value,
          gauge:    parseFloat(document.getElementById('gauge').value),
          web:      parseFloat(document.getElementById('web').value),
          flange:   parseFloat(document.getElementById('flange').value),
          lip:      parseFloat(document.getElementById('lip').value),
          length:   parseFloat(document.getElementById('length').value),
          rotation: parseFloat(document.getElementById('rotation').value),
          x:        parseFloat(document.getElementById('px').value),
          y:        parseFloat(document.getElementById('py').value),
          z:        parseFloat(document.getElementById('pz').value),
        }
      })
      setStatus('Adding member…')
    })

    // ── Wall layout ─────────────────────────────────────────────────────────
    document.getElementById('btnGenerateWall').addEventListener('click', () => {
      send({
        type: 'GENERATE_STUD_LAYOUT',
        params: {
          wallLength: parseFloat(document.getElementById('wallLength').value),
          wallHeight: parseFloat(document.getElementById('wallHeight').value),
          spacing:    parseFloat(document.getElementById('spacing').value),
          gauge:      parseFloat(document.getElementById('wallGauge').value),
          profile:    document.getElementById('wallProfile').value,
          openings:   []   // TODO: opening editor
        }
      })
      setStatus('Generating wall frame…')
    })

    // ── Cut list ────────────────────────────────────────────────────────────
    document.getElementById('btnGetCutList').addEventListener('click', () => {
      send({ type: 'GET_CUT_LIST' })
      setStatus('Computing cut list…')
    })

    document.getElementById('btnExportCutList').addEventListener('click', () => {
      const rows = window._cutListData
      if (!rows || !rows.length) return
      const headers = Object.keys(rows[0]).join(',')
      const lines = rows.map(r => Object.values(r).join(','))
      const csv = [headers, ...lines].join('\n')
      const blob = new Blob([csv], { type: 'text/csv' })
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = 'howick-cut-list.csv'
      a.click()
    })

    // ── Scene refresh ───────────────────────────────────────────────────────
    document.getElementById('btnRefreshScene').addEventListener('click', () => {
      send({ type: 'GET_HOWICK_OBJECTS' })
    })

    function renderMemberList(objects) {
      const list = document.getElementById('memberList')
      if (!objects || !objects.length) {
        list.innerHTML = '<div style="color:var(--muted);font-size:11px;">No Howick members in scene.</div>'
        return
      }
      list.innerHTML = objects.map(o => `
        <div class="member-item" data-id="${o.id}" onclick="selectMember('${o.id}')">
          <div class="mid">${o.name || o.id}</div>
          <div class="msub">${o.meta?.howick?.profile || '?'} · ${o.meta?.howick?.length || '?'}mm · ${o.meta?.howick?.gauge || '?'}mm gauge</div>
        </div>
      `).join('')
    }

    function selectMember(id) {
      send({ type: 'SELECT_MEMBER', objectId: id })
    }

    // ── Inbound: receive from plugin.ts ─────────────────────────────────────
    window.addEventListener('message', function(ev) {
      const msg = ev.data
      if (!msg || typeof msg !== 'object') return

      switch (msg.type) {

        case 'WASM_READY':
          setStatus('Ready', 'ok')
          break

        case 'WASM_UNAVAILABLE':
          setStatus('WASM unavailable — geometry only', '')
          break

        case 'MEMBER_ADDED':
          if (msg.error) {
            setStatus('Error: ' + msg.error, 'err')
          } else {
            setStatus('Member added: ' + msg.objectId, 'ok')
          }
          break

        case 'LAYOUT_GENERATED':
          setStatus('Generated ' + msg.count + ' members', 'ok')
          break

        case 'CUT_LIST_RESULT': {
          const rows = msg.cutList?.members ?? []
          window._cutListData = rows
          const output = document.getElementById('cutListOutput')
          const table = document.getElementById('cutListTable')
          output.style.display = 'block'
          if (!rows.length) {
            table.innerHTML = '<div style="color:var(--muted)">No members found.</div>'
          } else {
            const cols = Object.keys(rows[0])
            table.innerHTML = `
              <table style="width:100%;border-collapse:collapse;">
                <thead>
                  <tr>${cols.map(c => `<th style="text-align:left;border-bottom:1px solid var(--border);padding:2px 4px;color:var(--muted)">${c}</th>`).join('')}</tr>
                </thead>
                <tbody>
                  ${rows.map(r => `<tr>${cols.map(c => `<td style="padding:2px 4px;border-bottom:1px solid color-mix(in srgb, var(--border) 40%, transparent)">${r[c] ?? ''}</td>`).join('')}</tr>`).join('')}
                </tbody>
              </table>`
          }
          setStatus('Cut list ready (' + rows.length + ' rows)', 'ok')
          break
        }

        case 'HOWICK_OBJECTS':
          renderMemberList(msg.objects)
          setStatus(msg.objects.length + ' Howick objects', '')
          break

        case 'SELECTION_CHANGED':
          if (msg.objects.length) {
            setStatus(msg.objects.length + ' Howick member(s) selected', 'ok')
          }
          break

        case 'SELECTION_CLEARED':
          setStatus('No selection', '')
          break

        case 'MODEL_CHANGED':
          // silently re-request scene objects on model change
          send({ type: 'GET_HOWICK_OBJECTS' })
          break

        case 'ERROR':
          setStatus('Error: ' + msg.error, 'err')
          break
      }
    })

    // Request initial scene on load
    send({ type: 'GET_HOWICK_OBJECTS' })
    setStatus('Loading…')
  </script>
</body>
</html>
