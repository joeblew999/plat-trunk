[package]
name = "howick"
version = "0.1.0"
edition = "2021"
description = "Howick cold-formed steel framing — WASM geometry + cut list + CSV export kernel"

[lib]
# cdylib = WASM target (browser plugin)
# rlib   = native target (FrameExtractor, tests, future CLI)
crate-type = ["cdylib", "rlib"]

[features]
default = []
# native: enables FrameExtractor (Truck B-Rep → Frameset)
# Never compiled to WASM — Truck geometry crate is native-only
native = ["dep:monstertruck-modeling"]

[dependencies]
wasm-bindgen  = { version = "0.2", optional = false }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
howick-rs     = { git = "https://github.com/joeblew999/howick-rs" }

# Native-only: Truck B-Rep geometry for FrameExtractor
# The .src/truck vendored copy is used via workspace path
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
monstertruck-modeling = { path = "../../../../.src/truck/crates/modeling", optional = true }

[profile.release]
# Plugins share the 3MB Worker limit — optimise hard for size
opt-level    = "z"
lto          = true
codegen-units = 1

[dev-dependencies]
# Test FrameExtractor with real geometry
howick-rs = { git = "https://github.com/joeblew999/howick-rs" }
