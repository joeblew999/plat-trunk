[package]
name = "howick"
version = "0.1.0"
edition = "2021"
description = "Howick cold-formed steel framing — WASM geometry + cut list kernel"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen  = "0.2"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

[profile.release]
# Plugins share the 3MB Worker limit — optimise hard for size
opt-level    = "z"
lto          = true
codegen-units = 1
