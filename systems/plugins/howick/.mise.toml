# systems/plugins/howick/.mise.toml
#
# Howick steel framing plugin — WASM kernel + TypeScript plugin + Machine tab UI.
# Tool versions (bun, wasm-pack, Rust) inherited from root .mise.toml + rust-toolchain.toml.
#
# All tasks runnable from repo root OR from systems/plugins/howick/:
#   cd systems/plugins/howick && mise run ci
#   # OR from root:
#   mise run --cd systems/plugins/howick ci
#
# Root .mise.toml exposes:
#   mise run build:plugins:howick   ← full build (WASM + TS bundle)
#   mise run howick:ci              ← full CI gate

# ── Build ─────────────────────────────────────────────────────────────────────

[tasks."build:wasm"]
description = "Build Howick WASM kernel — includes howick-rs CSV serialiser (incremental)"
sources = [
  "crate/src/**/*.rs",
  "crate/Cargo.toml",
]
outputs = [
  "crate/pkg/howick_bg.wasm",
  "crate/pkg/howick.js",
  "crate/pkg/howick_bg.wasm.d.ts",
]
run = "cd crate && wasm-pack build --target web --release"

[tasks."build:wasm:dev"]
description = "Build Howick WASM kernel (debug — faster, larger)"
run = "cd crate && wasm-pack build --target web --dev"

[tasks."build:wasm:watch"]
description = "Auto-rebuild WASM on Rust source changes"
run = "mise watch build:wasm"

[tasks."build:ts"]
description = "Bundle plugin.ts → public/plugin.js (requires bun from root mise)"
run = "bun build plugin.ts --outfile public/plugin.js --target browser"

[tasks.build]
description = "Full plugin build: WASM + TS bundle"
depends = ["build:wasm", "build:ts"]

# ── Code quality ──────────────────────────────────────────────────────────────

[tasks.check]
description = "Clippy (native) + fmt check — WASM correctness verified by build:wasm"
run = """
cd crate
cargo clippy -- -D warnings
cargo fmt --check
"""

[tasks.fmt]
description = "Format howick crate"
run = "cd crate && cargo fmt"

# ── Test ──────────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run Rust unit tests including FrameExtractor (native — WASM via build:wasm)"
run = "cd crate && cargo test"

[tasks."test:extractor"]
description = "Run FrameExtractor tests only (native, no WASM)"
run = "cd crate && cargo test --lib frame_extractor"

[tasks."test:size"]
description = "Verify WASM binary is under 3MB CF Worker limit"
run = """
if [ ! -f crate/pkg/howick_bg.wasm ]; then
  echo "ERROR: crate/pkg/howick_bg.wasm not found — run mise run build:wasm first"
  exit 1
fi
SIZE=$(wc -c < crate/pkg/howick_bg.wasm)
KB=$(( SIZE / 1024 ))
echo "WASM size: ${SIZE} bytes (${KB} KB / 3072 KB limit)"
if [ $SIZE -gt 3145728 ]; then
  echo "ERROR: WASM exceeds 3MB CF Worker limit"
  exit 1
fi
echo "OK — within limit"
"""

# ── CI ────────────────────────────────────────────────────────────────────────
# This is the single source of truth for what CI runs.
# .github/workflows/howick-plugin.yml calls nothing directly — only mise run ci.

[tasks.ci]
description = "Full CI gate — check + test + WASM build + size check + TS bundle"
depends = ["check", "test", "build:wasm", "test:size", "build:ts"]

# ── Companion repos ───────────────────────────────────────────────────────────
# howick-rs (CSV parser/serialiser): https://github.com/joeblew999/howick-rs
# opcua-howick (edge agent):         https://github.com/joeblew999/opcua-howick
