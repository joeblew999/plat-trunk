version: '3'

# ============================================================================
# ezpz - 2D Geometric Constraint Solver
# https://github.com/KittyCAD/ezpz
#
# Quick start - just run: task ezpz:<tab> to see all options
# ============================================================================

vars:
  # ROOT_DIR passed by parent include — do NOT redefine
  SRC_DIR: '{{.ROOT_DIR}}/.src'
  EZPZ_SRC_DIR: '{{.SRC_DIR}}/ezpz'
  EZPZ_UPSTREAM: 'github.com/KittyCAD/ezpz'

tasks:
  default:
    internal: true
    cmds:
      - task: debug:self

  # ===========================================================================
  # Debug
  # ===========================================================================
  "debug:self":
    desc: Print all vars for debugging
    cmds:
      - echo "=== ezpz Vars ==="
      - echo "ROOT_DIR={{.ROOT_DIR}}"
      - echo "SRC_DIR={{.SRC_DIR}}"
      - echo "EZPZ_SRC_DIR={{.EZPZ_SRC_DIR}}"
      - echo "EZPZ_UPSTREAM={{.EZPZ_UPSTREAM}}"
      - echo "---"
      - cd {{.EZPZ_SRC_DIR}} && echo "HEAD=$(git rev-parse --short HEAD)" && git remote -v | head -2
    silent: true

  # ===========================================================================
  # Dependencies
  # ===========================================================================
  "deps:clone":
    desc: Clone ezpz constraint solver
    status:
      - test -d {{.EZPZ_SRC_DIR}}
    cmds:
      - mkdir -p {{.SRC_DIR}}
      - git clone --depth 1 https://{{.EZPZ_UPSTREAM}}.git {{.EZPZ_SRC_DIR}}

  "deps:clean":
    desc: Remove ezpz source
    cmds:
      - rm -rf {{.EZPZ_SRC_DIR}}

  # ===========================================================================
  # Upgrade
  # ===========================================================================
  upgrade:
    desc: Pull latest ezpz
    deps: ["deps:clone"]
    cmds:
      - cd {{.EZPZ_SRC_DIR}} && git pull origin main
      - echo "ezpz updated to $(cd {{.EZPZ_SRC_DIR}} && git rev-parse --short HEAD)"

  # ===========================================================================
  # Build & Test
  # ===========================================================================
  build:
    desc: Build ezpz library
    deps: ["deps:clone"]
    cmds:
      - cd {{.EZPZ_SRC_DIR}} && cargo build --release -p kcl-ezpz

  test:
    desc: Run ezpz tests
    deps: ["deps:clone"]
    cmds:
      - cd {{.EZPZ_SRC_DIR}} && cargo test -p kcl-ezpz

  check:
    desc: Run cargo check (fast compile check)
    deps: ["deps:clone"]
    cmds:
      - cd {{.EZPZ_SRC_DIR}} && cargo check -p kcl-ezpz

  ci:
    desc: Run full CI pipeline (check + test)
    deps: ["deps:clone"]
    cmds:
      - cd {{.EZPZ_SRC_DIR}} && cargo check -p kcl-ezpz
      - cd {{.EZPZ_SRC_DIR}} && cargo test -p kcl-ezpz
