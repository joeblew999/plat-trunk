version: '3'

# ============================================================================
# Envsubst - Template processor
# ============================================================================

vars:
  ROOT_DIR: '{{.ROOT_DIR | default "."}}'
  BIN_DIR: '{{.ROOT_DIR}}/.bin'

tasks:
  default:
    internal: true
    cmds:
      - task: debug:self

  # ===========================================================================
  # Debug
  # ===========================================================================
  "debug:self":
    desc: Print all vars for debugging
    cmds:
      - echo "=== Envsubst Vars ==="
      - echo "ROOT_DIR={{.ROOT_DIR}}"
      - echo "BIN_DIR={{.BIN_DIR}}"
    silent: true

  # ===========================================================================
  # Dependencies
  # ===========================================================================
  "deps:install":
    desc: Install envsubst (usually pre-installed on unix systems)
    cmds:
      - echo "envsubst is typically pre-installed via gettext"
      - which envsubst || echo "envsubst not found - install gettext"
