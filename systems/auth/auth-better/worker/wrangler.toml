# ─────────────────────────────────────────────────────────
# auth-better-worker — minimal better-auth reference backend
# ─────────────────────────────────────────────────────────
#
# Purpose: clean reference implementation — better-auth + all plugins.
# No zanzo, no R2, no domain schema.
# Used by auth-better/web/ (React UI) and auth-better/e2e/ (Playwright).
#
# Ports:
#   worker  8792  (existing auth-worker is 8790 — no conflict)
#   web     5174  (Vite)
#
# First-time (local dev — no provisioning needed):
#   cd auth-better/worker && bun install && wrangler dev
#   POST http://localhost:8792/auth/migrate  (first run only)
# ─────────────────────────────────────────────────────────

name = "auth-better-worker"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Static assets — built React SPA served by the worker in production.
# Run `bun run build` in web/ first.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"

# ── Local dev bindings ────────────────────────────────────────────────────────
# "local" is a wrangler miniflare placeholder — no real Cloudflare IDs needed.

[[d1_databases]]
binding       = "AUTH_DB"
database_name = "auth-better-db"
database_id   = "local"

[[kv_namespaces]]
binding = "AUTH_KV"
id      = "local"

[vars]
# Dev: worker's own URL. Production: set via wrangler secret / dashboard.
# better-auth uses this for callback URLs, cookie domain, CORS validation.
BETTER_AUTH_URL = "http://localhost:8792"
# BETTER_AUTH_SECRET — set via: wrangler secret put BETTER_AUTH_SECRET
# Generate: openssl rand -base64 32

# ── Production ────────────────────────────────────────────────────────────────

[env.production]
name = "auth-better-worker"

[env.production.vars]
BETTER_AUTH_URL = "https://auth-better-worker.gedw99.workers.dev"

[[env.production.d1_databases]]
binding       = "AUTH_DB"
database_name = "auth-better-db"
database_id   = "69f62edf-88ec-41ef-be41-4dd341b2da0d"

[[env.production.kv_namespaces]]
binding = "AUTH_KV"
id      = "476719674e124d6b9f5e70965cb017d0"

[dev]
ip             = "::"
port           = 8792   # must match AUTH_BETTER_PORT in mise.toml
inspector_port = 9233
local_protocol = "http"
