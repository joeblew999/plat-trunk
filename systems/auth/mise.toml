# systems/auth/mise.toml — auth system tasks
#
# Ports + tool versions inherited from root mise.toml [env] + [tools].
# Run from systems/auth/ or anywhere via: mise --cd systems/auth run <task>
#
# Workflow:
#   mise run dev                → start worker on :$AUTH_PORT
#   mise run test:e2e           → seed + run all Playwright tests  (worker must be up)
#   mise run test:e2e:headed    → same, with visible browser
#   mise run test:e2e:report    → open last HTML report
#   mise run seed               → seed fixtures only  (worker must be up, idempotent)
#   mise run ci                 → self-contained: kill → start → seed → test → stop
#   mise run kill               → kill auth dev ports

[tasks.kill]
description = "Kill auth dev ports ($AUTH_PORT + $AUTH_INSPECTOR)"
run = "lsof -ti:$AUTH_PORT,$AUTH_INSPECTOR | xargs kill -9 2>/dev/null; true"

[tasks.dev]
description = "Start auth worker on $AUTH_PORT (kills first)"
depends = ["kill"]
run = "bunx wrangler dev --config worker/wrangler.toml"

[tasks."install:playwright"]
description = "Install e2e deps + Playwright Chromium browser"
run = "cd e2e && bun install && bunx playwright install chromium"

[tasks."test:e2e"]
description = "Run all Playwright e2e tests — globalSetup seeds fixtures automatically (worker must be running)"
run = "cd e2e && bunx playwright test"

[tasks."test:e2e:headed"]
description = "Run Playwright e2e tests with visible browser"
run = "cd e2e && bunx playwright test --headed"

[tasks."test:e2e:report"]
description = "Open the last Playwright HTML report in browser"
run = "cd e2e && bunx playwright show-report"

[tasks.seed]
description = "Seed all fixture accounts + permission tuples via global-setup.ts (idempotent — worker must be running)"
run = "WORKER_URL=http://localhost:$AUTH_PORT bun e2e/global-setup.ts"

[tasks.ci]
description = "Full self-contained CI — kill → start worker → seed → test → stop"
run = """
set -euo pipefail
PORT="${AUTH_PORT:-8790}"
BASE="http://localhost:${PORT}"

echo "[ci] stopping any existing worker on :${PORT}"
lsof -ti:"${PORT}" | xargs kill -9 2>/dev/null || true
sleep 1

echo "[ci] starting auth worker on :${PORT}"
bunx wrangler dev --config worker/wrangler.toml > /tmp/auth-worker-ci.log 2>&1 &
WORKER_PID=$!
trap 'kill $WORKER_PID 2>/dev/null || true; lsof -ti:"${PORT}" | xargs kill -9 2>/dev/null || true' EXIT

echo "[ci] waiting for worker health (up to 30s)…"
for i in $(seq 1 30); do
  curl -sf "${BASE}/auth/health" > /dev/null 2>&1 && echo "[ci] worker ready (${i}s)" && break
  sleep 1
done
curl -sf "${BASE}/auth/health" > /dev/null || {
  echo "[ci] ERROR: worker not ready after 30s"
  tail -20 /tmp/auth-worker-ci.log
  exit 1
}

cd e2e && BASE_URL="${BASE}" WORKER_URL="${BASE}" bunx playwright test
"""
