# systems/auth/.mise.toml — auth system tasks
#
# Ports + tool versions inherited from root .mise.toml [env] + [tools].
#
# Usage (from systems/auth/):
#   mise run dev    Start auth worker + Vite web dev server
#   mise run test   Run TS tests
#   mise run kill   Kill auth dev ports

[tasks.kill]
description = "Kill auth dev ports"
run = "lsof -ti:$AUTH_PORT,$AUTH_INSPECTOR,$AUTH_WEB_PORT | xargs kill -9 2>/dev/null; true"

[tasks.dev]
description = "Start auth worker + Vite web dev (build web first, then kill, then start)"
depends = ["build", "kill"]
run = [
  "cd ../.. && bunx wrangler dev --config systems/auth/worker/wrangler.toml",
  "cd web && bunx vite --port $AUTH_WEB_PORT",
]

[tasks.test]
description = "Run auth TS tests"
run = "cd worker && bunx vitest run"

[tasks.build]
description = "Build auth web (incremental — skips if source unchanged)"
sources = ["web/src/**/*", "web/index.html", "web/package.json"]
outputs = ["web/dist/index.html"]
run = "cd web && bun run build"

# ── CI ────────────────────────────────────────────────────────────────────────

[tasks.ci]
description = "Full CI gate — build web + test"
depends = ["build", "test"]
