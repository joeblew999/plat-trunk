<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CAD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,10 90,30 90,70 50,90 10,70 10,30' fill='%23444' stroke='%23fff' stroke-width='3'/></svg>">
  <script type="module" src="/src/main.ts"></script>
</head>
<body
  class="min-h-screen bg-base-200 flex items-center justify-center p-4"
  data-signals="{
    email: '',
    password: '',
    name: '',
    loading: false,
    error: '',
    success: ''
  }"
>
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body gap-4">

      <!-- Logo + title -->
      <div class="flex flex-col items-center gap-2 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-10 opacity-80" viewBox="0 0 100 100">
          <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="#444" stroke="#fff" stroke-width="3"/>
          <line x1="50" y1="10" x2="50" y2="90" stroke="#fff" stroke-width="2"/>
          <line x1="10" y1="30" x2="90" y2="30" stroke="#fff" stroke-width="2"/>
        </svg>
        <h1 class="text-xl font-bold">Sign in to CAD</h1>
      </div>

      <!-- Error alert -->
      <div class="alert alert-error text-sm py-2" data-show="$error">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span data-text="$error"></span>
      </div>

      <!-- Email -->
      <fieldset class="fieldset">
        <label class="label text-sm" for="email">Email</label>
        <input
          id="email"
          type="email"
          class="input input-bordered w-full"
          placeholder="you@example.com"
          data-bind="email"
          autocomplete="email"
          data-attr:disabled="$loading"
        />
      </fieldset>

      <!-- Password -->
      <fieldset class="fieldset">
        <label class="label text-sm" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="input input-bordered w-full"
          placeholder="••••••••"
          data-bind="password"
          autocomplete="current-password"
          data-attr:disabled="$loading"
          data-on:keydown.enter="window.authSignIn()"
        />
        <div class="label">
          <a href="/auth/reset-password" class="label-text-alt link link-primary">Forgot password?</a>
        </div>
      </fieldset>

      <!-- Submit -->
      <button
        class="btn btn-primary w-full mt-2"
        data-on:click="window.authSignIn()"
        data-attr:disabled="$loading || !$email || !$password"
      >
        <span class="loading loading-spinner loading-sm" data-show="$loading"></span>
        <span data-show="!$loading">Sign in</span>
      </button>

      <div class="divider text-xs opacity-40">or</div>

      <p class="text-center text-sm opacity-60">
        No account?
        <a href="/auth/sign-up" class="link link-primary">Create one</a>
      </p>

    </div>
  </div>
</body>
</html>
