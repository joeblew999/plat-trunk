<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authorize — CAD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,10 90,30 90,70 50,90 10,70 10,30' fill='%23444' stroke='%23fff' stroke-width='3'/></svg>">
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Extract OAuth params from URL
    const p = new URLSearchParams(location.search);
    window.__oauthParams = {
      clientId: p.get('client_id') ?? '',
      redirectUri: p.get('redirect_uri') ?? '',
      scope: p.get('scope') ?? '',
      state: p.get('state') ?? '',
    };
  </script>
</head>
<body
  class="min-h-screen bg-base-200 flex items-center justify-center p-4"
  data-signals="{
    loading: false,
    error: '',
    clientId: window.__oauthParams.clientId,
    scope: window.__oauthParams.scope
  }"
>
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body gap-4">
      <div class="flex flex-col items-center gap-2 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-10 opacity-80" viewBox="0 0 100 100">
          <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="#444" stroke="#fff" stroke-width="3"/>
        </svg>
        <h1 class="text-xl font-bold">Authorize Access</h1>
        <p class="text-xs opacity-50 text-center">
          <span data-text="'Client: ' + $clientId"></span>
        </p>
        <p class="text-xs opacity-50 text-center" data-show="$scope">
          <span data-text="'Requesting: ' + $scope"></span>
        </p>
      </div>

      <div class="alert alert-error text-sm py-2" data-show="$error">
        <span data-text="$error"></span>
      </div>

      <button
        class="btn btn-primary w-full"
        data-on:click="window.oauthConsent(true)"
        data-attr:disabled="$loading"
      >
        <span class="loading loading-spinner loading-sm" data-show="$loading"></span>
        <span data-show="!$loading">Allow</span>
      </button>

      <button
        class="btn btn-ghost w-full"
        data-on:click="window.oauthConsent(false)"
        data-attr:disabled="$loading"
      >
        Deny
      </button>
    </div>
  </div>
</body>
</html>
