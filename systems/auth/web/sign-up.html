<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — CAD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,10 90,30 90,70 50,90 10,70 10,30' fill='%23444' stroke='%23fff' stroke-width='3'/></svg>">
  <script type="module" src="/src/main.ts"></script>
</head>
<body
  class="min-h-screen bg-base-200 flex items-center justify-center p-4"
  data-signals="{
    email: '',
    password: '',
    name: '',
    loading: false,
    error: '',
    success: ''
  }"
>
  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body gap-4">

      <!-- Logo + title -->
      <div class="flex flex-col items-center gap-2 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-10 opacity-80" viewBox="0 0 100 100">
          <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="#444" stroke="#fff" stroke-width="3"/>
          <line x1="50" y1="10" x2="50" y2="90" stroke="#fff" stroke-width="2"/>
          <line x1="10" y1="30" x2="90" y2="30" stroke="#fff" stroke-width="2"/>
        </svg>
        <h1 class="text-xl font-bold">Create account</h1>
      </div>

      <!-- Success alert -->
      <div class="alert alert-success text-sm py-2" data-show="$success">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        <span data-text="$success"></span>
      </div>

      <!-- Error alert -->
      <div class="alert alert-error text-sm py-2" data-show="$error">
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span data-text="$error"></span>
      </div>

      <!-- Name -->
      <fieldset class="fieldset">
        <label class="label text-sm" for="name">Name</label>
        <input
          id="name"
          type="text"
          class="input input-bordered w-full"
          placeholder="Your name"
          data-bind="name"
          autocomplete="name"
          data-attr:disabled="$loading || $success"
        />
      </fieldset>

      <!-- Email -->
      <fieldset class="fieldset">
        <label class="label text-sm" for="email">Email</label>
        <input
          id="email"
          type="email"
          class="input input-bordered w-full"
          placeholder="you@example.com"
          data-bind="email"
          autocomplete="email"
          data-attr:disabled="$loading || $success"
        />
      </fieldset>

      <!-- Password -->
      <fieldset class="fieldset">
        <label class="label text-sm" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="input input-bordered w-full"
          placeholder="Min. 8 characters"
          data-bind="password"
          autocomplete="new-password"
          data-attr:disabled="$loading || $success"
          data-on:keydown.enter="window.authSignUp()"
        />
      </fieldset>

      <!-- Submit -->
      <button
        class="btn btn-primary w-full mt-2"
        data-on:click="window.authSignUp()"
        data-attr:disabled="$loading || $success || !$name || !$email || !$password"
      >
        <span class="loading loading-spinner loading-sm" data-show="$loading"></span>
        <span data-show="!$loading">Create account</span>
      </button>

      <div class="divider text-xs opacity-40">or</div>

      <p class="text-center text-sm opacity-60">
        Already have an account?
        <a href="/auth/sign-in" class="link link-primary">Sign in</a>
      </p>

    </div>
  </div>
</body>
</html>
