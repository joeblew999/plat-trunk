[package]
name = "plat-sync"
version = "0.1.0"
edition = "2021"
description = "Plugin-agnostic CRDT op log for plat-trunk systems"

# ── Standalone workspace ───────────────────────────────────────────────────────
# plat-sync has zero dependencies on truck geometry or any other plat-trunk
# crate. Declaring its own workspace here means:
#   cd systems/sync/crate && cargo test   ← works with NO .src repos cloned
#   cargo test -p plat-sync              ← still works from monorepo root
# Without this, Cargo resolves ALL workspace members first (including howick
# which has a .src/truck path dep), breaking sync tests in a fresh checkout.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CRDT document — Automerge for merge-safe op log
automerge = "0.7.4"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1.0"

# JSON Schema generation (ADR-0001 Part E — Op type codegen)
schemars = { version = "0.8", features = ["derive"] }

# Unique op IDs
uuid = { version = "1", features = ["v4", "js", "serde"] }

# Content hashing for change detection and storage integrity
blake3 = { version = "1.8", default-features = false }

# WASM bridge (only used when compiled to wasm32)
wasm-bindgen              = "0.2.106"
console_error_panic_hook  = "0.1.7"
log                       = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
# getrandom 0.3.x requires explicit opt-in for wasm32-unknown-unknown
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# Nothing browser-specific — all tests are native Rust

[[bin]]
name = "generate-sync-schema"
path = "src/bin/generate_sync_schema.rs"

[profile.release]
opt-level = "z"       # optimize for size (WASM binary)
lto = true            # link-time optimization
codegen-units = 1     # slower compile, smaller output
strip = true          # strip symbols

# wasm-opt bundled by wasm-pack fails on macOS ARM — disable it.
# Rust-level opts (opt-level=z, lto) handle size optimization.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = []
