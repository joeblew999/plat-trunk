<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Protocol Debugger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; padding: 0.75rem; background: #fafafa; }
    h1 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #333; }
    .top-bar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .top-bar .stat { font-size: 0.8rem; color: #666; }
    .top-bar .stat strong { color: #333; }
    .top-bar button { font-size: 0.75rem; padding: 0.2rem 0.5rem; }
    .main { display: grid; grid-template-columns: 1fr 320px; gap: 0.75rem; }
    .actors-grid { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .actor-card { flex: 1; min-width: 240px; max-width: 400px; border: 2px solid #ddd; border-radius: 6px; background: #fff; padding: 0.5rem; }
    .actor-card.offline { border-color: #f5c6cb; background: #fff5f5; }
    .actor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .actor-name { font-weight: bold; font-size: 0.85rem; }
    .actor-color { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .badge { display: inline-block; padding: 0.05rem 0.35rem; border-radius: 3px; font-size: 0.7rem; font-weight: bold; }
    .online { background: #d4edda; color: #155724; }
    .offline { background: #f8d7da; color: #721c24; }
    .actor-stats { font-size: 0.75rem; color: #666; margin-bottom: 0.4rem; }
    .actor-buttons { display: flex; flex-wrap: wrap; gap: 0.15rem; margin-bottom: 0.4rem; }
    .actor-buttons button { font-size: 0.7rem; padding: 0.15rem 0.4rem; cursor: pointer; border: 1px solid #ccc; border-radius: 3px; background: #fff; }
    .actor-buttons button:hover { background: #f0f0f0; }
    .actor-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }
    .ops-list { font-family: monospace; font-size: 0.7rem; max-height: 140px; overflow-y: auto; background: #f8f9fa; padding: 0.3rem; border-radius: 3px; }
    .op-chip { display: inline-block; padding: 0.05rem 0.3rem; margin: 0.05rem; border-radius: 2px; cursor: pointer; font-size: 0.7rem; }
    .op-enabled { background: #d4edda; }
    .op-disabled { background: #f8d7da; text-decoration: line-through; }
    .log-panel { border: 1px solid #ddd; border-radius: 6px; background: #fff; padding: 0.5rem; }
    .log-panel h2 { font-size: 0.85rem; color: #666; margin-bottom: 0.3rem; display: flex; justify-content: space-between; }
    .log-panel h2 button { font-size: 0.65rem; }
    #log-filter { font-size: 0.7rem; padding: 0.15rem 0.3rem; margin-bottom: 0.3rem; width: 100%; border: 1px solid #ddd; border-radius: 3px; }
    .log-entries { font-family: monospace; font-size: 0.65rem; max-height: calc(100vh - 200px); overflow-y: auto; }
    .log-entry { padding: 0.1rem 0; border-bottom: 1px solid #f0f0f0; display: flex; gap: 0.3rem; }
    .log-ts { color: #999; min-width: 65px; }
    .log-actor { min-width: 50px; font-weight: bold; }
    .log-event { min-width: 90px; }
    .log-detail { color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-entry.had-new-ops { background: #fffde7; }
    .presence-bar { margin-top: 0.5rem; font-size: 0.75rem; color: #666; }
    .presence-dot { display: inline-flex; align-items: center; gap: 2px; margin-right: 0.5rem; }
  </style>
</head>
<body>
  <h1>Sync Protocol Debugger</h1>
  <div class="top-bar">
    <span class="stat">Model: <strong id="model-id">—</strong></span>
    <span class="stat">Actors: <strong id="actor-count">0</strong></span>
    <button id="btn-add-actor" data-testid="add-actor">+ Actor</button>
    <button id="btn-reset" data-testid="reset">Reset All</button>
    <button id="btn-export-log" data-testid="export-log">Export Log</button>
  </div>
  <div class="main">
    <div>
      <div id="actors-grid" class="actors-grid" data-testid="actors-grid"></div>
      <div id="presence-bar" class="presence-bar" data-testid="presence-bar"></div>
    </div>
    <div class="log-panel">
      <h2>Sync Log <button id="btn-clear-log" data-testid="clear-log">clear</button></h2>
      <input id="log-filter" data-testid="log-filter" placeholder="filter by actor or event..." />
      <div id="log-entries" class="log-entries" data-testid="log-entries"></div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
