<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SyncDoc E2E Test GUI</title>
  <style>
    body { font-family: monospace; margin: 20px; background: #1a1a2e; color: #e0e0e0; }
    h1 { font-size: 16px; color: #7fdbca; }
    .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .status.connected { background: #2d6a4f; }
    .status.disconnected { background: #6a2d2d; }
    button { padding: 6px 12px; margin: 4px; cursor: pointer; background: #2a2a4a; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; }
    button:hover { background: #3a3a5a; }
    #ops-list { margin-top: 12px; }
    .op { padding: 4px 8px; margin: 2px 0; border-left: 3px solid #7fdbca; background: #2a2a4a; font-size: 13px; }
    .op.disabled { opacity: 0.4; border-left-color: #6a2d2d; text-decoration: line-through; }
    #log { margin-top: 12px; font-size: 11px; color: #888; max-height: 200px; overflow-y: auto; }
    #doc-id { font-size: 11px; color: #666; word-break: break-all; }
  </style>
</head>
<body>
  <h1>SyncDoc E2E</h1>
  <div>
    <span id="status" class="status disconnected">disconnected</span>
    <span id="actor-id"></span>
  </div>
  <div id="doc-id"></div>
  <div>
    <button id="btn-create">Create Doc</button>
    <button id="btn-add-op">Add Op</button>
    <button id="btn-undo-last">Undo Last</button>
    <button id="btn-redo-last">Redo Last</button>
  </div>
  <div>
    <label>Join Doc ID: <input id="join-id" size="50" /></label>
    <button id="btn-join">Join</button>
  </div>
  <div id="ops-list"></div>
  <div id="log"></div>
  <script type="module" src="./e2e-main.ts"></script>
</body>
</html>
