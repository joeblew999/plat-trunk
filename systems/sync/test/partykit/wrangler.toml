name = "sync-partykit-test"
main = "worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Three DO classes — one per feature, one per route:
#   /parties/sync/:room      → Sync DO (raw Automerge transport)
#   /parties/ops/:room       → Ops DO (SyncDoc add/undo/redo/group)
#   /parties/presence/:room  → Presence DO (ephemeral broadcast)

[durable_objects]
bindings = [
  { name = "SYNC", class_name = "Sync" },
  { name = "OPS", class_name = "Ops" },
  { name = "PRESENCE", class_name = "Presence" },
]

[[migrations]]
tag = "v1"
new_classes = ["Sync", "Ops", "Presence"]

[dev]
port = 1999
