# ───────────────────────────────────────────────────────
# sync-tests — minimal worker for vitest-pool-workers
# ───────────────────────────────────────────────────────
#
# The sync system has no deployed worker — it's a WASM library.
# This wrangler.toml exists solely to provide the execution
# context that @cloudflare/vitest-pool-workers requires.
#
# Tests: bun run test:sync  (or: cd systems/sync/test && bun x vitest run)
# ───────────────────────────────────────────────────────

name = "sync-test"
main = "client/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

# ─── CF-native Observability ────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
