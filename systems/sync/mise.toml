# systems/sync/mise.toml — sync WASM library tasks
#
# Self-contained: pins its own tools so this system can be used standalone
# (e.g. as a git submodule, copied into another repo, or run in CI without
# the plat-trunk root). Tool versions must be kept in sync with root mise.toml.
#
# Global mise config (~/.config/mise/config.toml) can provide these as
# cross-repo defaults — see: https://mise.jdx.dev/configuration.html#global-config
#
# Usage (from systems/sync/):
#   mise run build:wasm        Build all WASM targets via root pipeline (incremental)
#   mise run build:wasm:self   Build WASM standalone — no root pipeline needed
#   mise run build:schema      Regenerate sync-schema.json only
#   mise run install           Install JS deps
#   mise run test:rust         Run Rust CRDT tests only (fast, no WASM build)
#   mise run test:ts           Run TS boundary tests (WASM must be built)
#   mise run test              Build WASM + run all tests
#   mise run typecheck         Typecheck sync test runner TS
#   mise run ci                Full standalone CI gate
#
#   mise run partyserver:build    Build fork → .tgz in .packages/
#   mise run partyserver:install  Build + install .tgz in test/partykit
#   mise run test:partykit        Run automerge-partyserver tests (wrangler + DO)
#
# Rust is pinned in ../../rust-toolchain.toml — mise respects it automatically.
# When used standalone (outside plat-trunk), copy rust-toolchain.toml alongside.

[tools]
bun               = "1.3.10"   # JS runtime + package manager
node              = "22"       # Required for vitest-pool-workers
"cargo:wasm-pack" = "0.14.0"  # Rust → WASM build tool

# ── Build ─────────────────────────────────────────────────────────────────────

[tasks."build:wasm"]
description = "Build sync WASM via root pipeline (incremental — skips if Rust src unchanged)"
sources = [
  "crate/src/**/*.rs",
  "crate/Cargo.toml",
]
outputs = [
  "pkg/web/plat_sync_bg.wasm",
  "pkg/bundler/plat_sync_bg.wasm",
  "test/pkg-sync/plat_sync_bg.wasm",
]
run = "cd ../.. && bun run build:sync"

[tasks."build:wasm:self"]
description = "Build sync WASM standalone — no root pipeline, no consumer dirs needed"
sources = [
  "crate/src/**/*.rs",
  "crate/Cargo.toml",
]
outputs = [
  "pkg/web/plat_sync_bg.wasm",
  "pkg/bundler/plat_sync_bg.wasm",
  "test/pkg-sync/plat_sync_bg.wasm",
]
run = """
cd crate
wasm-pack build --target web     --release --out-dir ../pkg/web
wasm-pack build --target bundler --release --out-dir ../pkg/bundler
wasm-pack build --target bundler --release --out-dir ../test/pkg-sync
cargo run --bin generate-sync-schema > ../sync-schema.json 2>/dev/null || true
"""

[tasks."build:size"]
description = "Report WASM sizes and write to wasm-size.txt"
depends = ["build:wasm:self"]
run = """
echo "plat-sync WASM size report ($(date -u +%Y-%m-%dT%H:%M:%SZ))" > wasm-size.txt
echo "" >> wasm-size.txt
for target in web bundler; do
  f="pkg/$target/plat_sync_bg.wasm"
  if [ -f "$f" ]; then
    raw=$(wc -c < "$f" | tr -d ' ')
    gz=$(gzip -c "$f" | wc -c | tr -d ' ')
    echo "$target: ${raw} bytes raw, ${gz} bytes gzipped" >> wasm-size.txt
    echo "$target: ${raw} bytes raw, ${gz} bytes gzipped"
  fi
done
echo "" >> wasm-size.txt
echo "Build profile: opt-level=z, lto=true, codegen-units=1, strip=true" >> wasm-size.txt
cat wasm-size.txt
"""

[tasks."build:schema"]
description = "Regenerate sync-schema.json from Rust types only (no WASM build)"
run = "cd crate && cargo run --bin generate-sync-schema > ../sync-schema.json"

[tasks."build:wasm:watch"]
description = "Auto-rebuild sync WASM on Rust source changes"
run = "mise watch build:wasm:self"

# ── PartyKit (automerge-partyserver fork) ────────────────────────────────────
# Fork: joeblew999/partykit → packages/automerge-partyserver
# Builds to .tgz in plat-trunk/.packages/ — no npm publish needed.
# Any consumer: "automerge-partyserver": "file:../../.packages/automerge-partyserver-0.1.0.tgz"
#
#   mise run partyserver:build    Build fork → .tgz in .packages/
#   mise run partyserver:install  Build + install in sync test/partykit

[tasks."partyserver:build"]
description = "Build automerge-partyserver fork → .tgz in .packages/"
run = """
FORK="$(cd ../../.. && pwd)/partykit/packages/automerge-partyserver"
ROOT="$(cd ../.. && pwd)"
echo "→ Building $FORK"
cd "$FORK"
bun install --silent
npx tsx scripts/build.ts

# Pack to .tgz — npm pack outputs the filename
TGZ=$(npm pack --pack-destination "$ROOT/.packages" 2>/dev/null)
echo "✓ $ROOT/.packages/$TGZ"
"""

[tasks."partyserver:install"]
description = "Build fork + install .tgz in sync test/partykit"
depends = ["partyserver:build"]
run = """
ROOT="$(cd ../.. && pwd)"
TGZ=$(ls -t "$ROOT/.packages"/automerge-partyserver-*.tgz | head -1)
echo "→ Installing $TGZ"
cd test/partykit
bun add "$TGZ"
echo "✓ Installed in systems/sync/test/partykit"
"""

# ── Install ───────────────────────────────────────────────────────────────────

[tasks.install]
description = "Install JS deps for PartyKit test suite"
run = "cd test/partykit && bun install"

# ── Test ──────────────────────────────────────────────────────────────────────

[tasks."test:rust"]
description = "Run Rust CRDT unit + integration tests — standalone, no .src repos needed"
run = "cd crate && cargo test"

[tasks."test:partykit"]
description = "Run SyncDoc + automerge-partyserver E2E — real DO + wrangler (12 tests)"
depends = ["install"]
run = """
cd test/partykit
# Start wrangler dev in background
npx wrangler dev --port 1999 &
WRANGLER_PID=$!
# Wait for server to be ready
for i in $(seq 1 20); do
  curl -s http://localhost:1999/health > /dev/null 2>&1 && break
  sleep 0.5
done
# Run tests
npx vitest run
EXIT=$?
# Clean up
kill $WRANGLER_PID 2>/dev/null
exit $EXIT
"""

[tasks."test:e2e"]
description = "Run Playwright E2E — real browser + real wrangler DO + Hono + hono-party"
depends = ["install"]
run = "cd test/partykit/e2e && npx playwright test"

[tasks.test]
description = "Run all tests (Rust + PartyKit Node + Playwright E2E)"
run = [
  "mise run test:rust",
  "mise run test:partykit",
  "mise run test:e2e",
]

# ── Dev ──────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Start PartyKit sync server (wrangler dev + DO on :1999)"
run = "cd test/partykit && npx wrangler dev --port 1999"

[tasks."dev:gui"]
description = "Start sync test GUI (:5199) + DO server (:1999)"
depends = ["install"]
run = """
cd test/partykit
npx wrangler dev --port 1999 &
npx vite --config e2e/vite.config.ts
"""

# ── CI ────────────────────────────────────────────────────────────────────────
# Fully standalone — does not require the root pipeline.
# Invoked by root: mise --cd systems/sync run ci
# Also runnable directly from systems/sync/: mise run ci

[tasks.ci]
description = "Full standalone CI gate — Rust tests + PartyKit E2E"
run = [
  "cd crate && cargo test",
  "mise run test:partykit",
]
