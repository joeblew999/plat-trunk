[workspace]
resolver = "2"

members = [
    "systems/truck/crate",
    "systems/plugins/howick/crate",
    "systems/plugins/example/crate",
]

# lib/observe and systems/sync/crate are self-contained workspaces.
# sync/crate declares its own [workspace] so `cargo test` works without
# .src repos cloned (howick has a .src/truck path dep that breaks fresh checkouts).
# Run sync tests via: cd systems/sync/crate && cargo test
#                 or: mise --cd systems/sync run test:rust
exclude = [
    ".src",
    "systems/sync/crate",
]

[profile.release]
opt-level = "s"
panic = "unwind"

[profile.dev]
panic = "unwind"

[workspace.dependencies]
# Shared across system crates — pin here, reference with { workspace = true }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1.0"
wasm-bindgen = "0.2.106"
uuid        = { version = "1", features = ["v4", "js", "serde"] }
log         = "0.4"
