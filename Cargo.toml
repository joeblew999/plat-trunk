[workspace]
resolver = "2"

members = [
    "systems/truck/crate",
    "systems/sync/crate",
]

# Exclude vendored upstream workspaces from this workspace
exclude = [
    ".src",
]

[profile.release]
opt-level = "s"
panic = "unwind"

[profile.dev]
panic = "unwind"

[workspace.dependencies]
# Shared across system crates — pin here, reference with { workspace = true }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1.0"
wasm-bindgen = "0.2.106"
uuid        = { version = "1", features = ["v4", "js", "serde"] }
log         = "0.4"
