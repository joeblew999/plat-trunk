baseURL = 'https://docs.cad.ubuntusoftware.net/'
languageCode = 'en-us'
title = 'CAD Documentation'
theme = 'hugo-book'

# Book theme configuration
[params]
  BookTheme = 'dark'
  BookToC = true
  BookSection = 'docs'
  BookRepo = 'https://github.com/joeblew999/plat-trunk'
  BookLogo = '/logo.png'
  BookMenuBundle = '/menu'
  BookSearch = true

[menu]

[[menu.after]]
  name = "CAD App"
  url = "https://cad.ubuntusoftware.net"
  weight = 1

[[menu.after]]
  name = "GitHub"
  url = "https://github.com/joeblew999/plat-trunk"
  weight = 2

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
