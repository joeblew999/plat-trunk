# mise.toml — tool version pins for plat-trunk
#
# Install: https://mise.jdx.dev
# Usage:   mise install   (installs all tools at pinned versions)
#
# Secrets: managed via Doppler → .env (gitignored, loaded by mise [env] _.file)
#   Setup (one-time): brew install dopplerhq/cli/doppler && doppler login
#                     mise run secrets:pull     ← generates .env from Doppler
#   CI/container:     DOPPLER_TOKEN=<service token> mise run secrets:pull
#   After rotation:   update in Doppler dashboard, then mise run secrets:pull
#
# Rust version is pinned separately in rust-toolchain.toml (wasm targets + components).
# mise respects rust-toolchain.toml automatically.

[tools]
bun                = "1.3.10"  # JS runtime + package manager — https://bun.sh
node               = "22"      # Node.js 22 — required for node:sqlite (vitest environment:node workers)
gh                 = "2.87.3"  # GitHub CLI — manage secrets, PRs, releases
"cargo:wasm-pack"  = "0.14.0"  # Rust → WASM build tool — https://rustwasm.github.io/wasm-pack
doppler            = "latest"  # Secrets manager CLI — https://doppler.com
# ── VM automation — UTM + Windows/Pi/Android guest management ───────────────
"github:joeblew999/utm-dev" = "latest"  # UTM VM automation (Windows ARM64, Pi, Android) — https://github.com/joeblew999/utm-dev
# ── Tauri (macOS + Windows builds; iOS extras macOS only) ───────────────────
"cargo:tauri-cli" = {version = "2",      os = ["macos", "windows"]}  # Tauri v2 — builds macOS + Windows apps
xcodegen          = {version = "latest", os = ["macos"]}              # generates Xcode project from spec (macOS/iOS only)
ruby              = {version = "3.3",    os = ["macos"]}              # required by CocoaPods (macOS/iOS only)
# CocoaPods is a Ruby gem — install manually after ruby is available:
#   gem install cocoapods
# Rust is managed by rust-toolchain.toml (pins version + wasm targets + components) — do not add here
# playwright browsers installed separately via mise run install:playwright

# ── Port registry — single source of truth for all system ports ───────────────
# Add new systems here. Ports must be unique across all systems.
# Workers:   8788–8799   Inspector: 9229–9239
# Dev servers (Vite etc): 5173–5179
[env]
_.file = ".env"
# plat-router (root)
ROUTER_PORT           = "8788"
ROUTER_INSPECTOR      = "9229"
# truck-cad worker
TRUCK_PORT            = "8789"
TRUCK_INSPECTOR       = "9230"
# auth-worker
AUTH_PORT             = "8790"
AUTH_INSPECTOR        = "9231"
# test-worker
TEST_PORT             = "5175"
TEST_INSPECTOR        = "9232"
# Dev servers (Vite / VitePress)
AUTH_WEB_PORT         = "5174"
TRUCK_WEB_PORT        = "5173"
DOCS_PORT             = "5176"

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tasks."src:sync"]
description = "Clone/update all vendored .src repos (truck, ifc-lite, ezpz)"
run = "bash scripts/src-sync.sh"

# ── MCP ───────────────────────────────────────────────────────────────────────

[tasks."mcp:setup"]
description = "Configure MCP for Gemini + Cursor + Claude Code (uses ports from env)"
run = "bash scripts/mcp-setup.sh"

[tasks."mcp:teardown"]
description = "Remove generated MCP configs for Gemini + Cursor"
run = "bash scripts/mcp-teardown.sh"

# ── Dev ──────────────────────────────────────────────────────────────────────

[tasks.kill]
description = "Kill all plat-trunk dev ports"
run = "lsof -ti:$ROUTER_PORT,$TRUCK_PORT,$AUTH_PORT,$TEST_PORT,$AUTH_WEB_PORT,$TRUCK_WEB_PORT,$ROUTER_INSPECTOR,$TRUCK_INSPECTOR,$AUTH_INSPECTOR,$TEST_INSPECTOR | xargs kill -9 2>/dev/null; true"

[tasks.dev]
description = "Start all workers (router + truck + auth + test + web devservers)"
depends = ["install", "kill"]
run = "bun run dev"

# ── Setup (one-time, new machine) ────────────────────────────────────────────

[tasks.setup]
description = "One-time setup for a new machine — install tools, pull secrets, JS deps, build WASM"
run = """
echo "▶ [1/4] Checking Doppler login..."
doppler me 2>/dev/null || (echo "  → Run: doppler login" && exit 1)
echo "▶ [2/4] Installing JS deps..."
bun scripts/install-all.mjs
echo "▶ [3/4] Pulling secrets from Doppler..."
mise run secrets:pull
echo "▶ [4/4] Building WASM (sync + truck)..."
bun run build:sync
bun run build:truck
echo ""
echo "✓ Setup complete — run: mise run dev"
"""

# ── Install ───────────────────────────────────────────────────────────────────

[tasks.install]
description = "Install JS deps for root + all systems (auto-discovers package.json dirs)"
run = "bun scripts/install-all.mjs"

# ── Build ─────────────────────────────────────────────────────────────────────
# Delegates to build.mjs (system-aware registry, ordering, timeouts).
# Incremental builds live at the system level via sources/outputs.

[tasks.build]
description = "Build all systems via build.mjs (sync → auth → truck → docs)"
depends = ["install"]
run = "bun run build"

# ── Test ──────────────────────────────────────────────────────────────────────
# Delegates to test.mjs (phased pipeline — alignment, schema, CRDT, TS, HTTP).

[tasks.test]
description = "Run full phased test pipeline via test.mjs"
depends = ["build"]
run = "bun run test"

# ── Smoke ─────────────────────────────────────────────────────────────────────

[tasks.smoke]
description = "Quick live check — local dev (requires mise run dev)"
run = "bun scripts/smoke.ts"

[tasks."smoke:prod"]
description = "Quick live check — production (cad.ubuntusoftware.net)"
run = "bun scripts/smoke.ts --prod"

# ── E2E ───────────────────────────────────────────────────────────────────────

[tasks."install:playwright"]
description = "Install Playwright browsers (Chromium with WebGPU support)"
run = """
cd systems/truck/e2e && bunx playwright install chromium
cd systems/sync/e2e  && bunx playwright install chromium
echo "✓ Playwright browsers installed"
"""

[tasks."test:e2e"]
description = "Run truck e2e tests against local dev server (requires mise run dev)"
run = "cd systems/truck/e2e && bunx playwright test"

[tasks."test:e2e:preview"]
description = "Deploy preview to CF then run e2e tests against it (no local dev server needed)"
depends = ["ci:check-secrets"]
run = [
  "bun scripts/cf-deploy.ts upload --target truck --preview-alias e2e-preview 2>&1 | tee /tmp/deploy-out.txt",
  "grep -o 'https://[^ ]*workers[.]dev' /tmp/deploy-out.txt | head -1 > /tmp/preview-url.txt",
  "test -s /tmp/preview-url.txt || (echo 'ERROR: no preview URL found' && exit 1)",
  "echo Preview URL: $(cat /tmp/preview-url.txt)",
  "BASE_URL=$(cat /tmp/preview-url.txt) bunx playwright test --config systems/truck/e2e/playwright.config.ts",
  "BASE_URL=$(cat /tmp/preview-url.txt) bunx playwright test --config systems/sync/e2e/playwright.config.ts",
]

[tasks."test:e2e:sync"]
description = "Run sync cross-tab e2e tests against local dev server"
run = "cd systems/sync/e2e && bunx playwright test"

# ── CI ────────────────────────────────────────────────────────────────────────

[tasks."ci:check-secrets"]
description = "Fail fast if Cloudflare deploy secrets are missing"
run = """
OK=1
if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; OK=0; fi
if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set"; OK=0; fi
if [ "$OK" = "0" ]; then exit 1; fi
echo "All required secrets present"
"""

[tasks.ci]
description = "Full CI gate — all systems in order: install → build → test"
depends = ["install"]
run = [
  "mise --cd systems/sync run ci",
  "mise --cd systems/truck run ci",
  "mise --cd systems/auth run ci",
  "mise --cd systems/docs run ci",
  "mise --cd systems/plugins run ci",
]

# ── Plugins ───────────────────────────────────────────────────────────────────
# Plugin group tasks delegate to systems/plugins/mise.toml.
# To add a new plugin: add it to systems/plugins/mise.toml, not here.

[tasks."build:plugins"]
description = "Build all first-party plugins"
depends = ["install"]
run = "mise --cd systems/plugins run build"

[tasks."build:plugins:dev"]
description = "Build all plugins in dev mode (faster, larger WASM)"
depends = ["install"]
run = "mise --cd systems/plugins run build:dev"

[tasks."plugins:ci"]
description = "Full CI gate for all plugins — delegates to systems/plugins/mise.toml"
run = "mise --cd systems/plugins run ci"

# ── Deploy ────────────────────────────────────────────────────────────────────

[tasks.deploy]
description = "Deploy all workers to Cloudflare (main push — requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)"
depends = ["ci", "ci:check-secrets"]
run = "bun scripts/cf-deploy.ts deploy-all"

[tasks."deploy:pr"]
description = "Upload PR preview versions — requires PR env var and CF secrets"
run = '''
: "${PR:?PR env var is required (e.g. PR=42 mise run deploy:pr)}"
bun scripts/cf-deploy.ts upload --target truck  --tag pr-$PR --preview-alias pr-$PR
bun scripts/cf-deploy.ts upload --target test   --tag pr-$PR --preview-alias pr-$PR
bun scripts/cf-deploy.ts upload --target router --tag pr-$PR --preview-alias pr-$PR
'''

# ── Secrets management ────────────────────────────────────────────────────────
# Secrets live in Doppler project "plat-trunk" config "dev".
# mise run secrets:set  →  syncs Doppler secrets → GitHub Actions.
# mise run secrets:list →  shows all secrets in Doppler + GitHub Actions.
# mise run secrets:rotate → prints rotation URLs.

[tasks."secrets:pull"]
description = "Pull secrets from Doppler → .env (run after setup or rotation)"
run = """
if [ -n "${DOPPLER_TOKEN:-}" ]; then
  doppler secrets download --no-file --format env --project plat-trunk --config dev --token "$DOPPLER_TOKEN" > .env
else
  doppler secrets download --no-file --format env --project plat-trunk --config dev > .env
fi
echo "✓ .env updated from Doppler"
"""

[tasks."secrets:set"]
description = "Sync Doppler secrets → GitHub Actions (run after any rotation in Doppler)"
run = """
: "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN not set — run: doppler login}"
: "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID not set — run: doppler login}"
: "${GITHUB_TOKEN:?GITHUB_TOKEN not set — run: doppler login}"
printf '%s' "$CLOUDFLARE_API_TOKEN"  | gh secret set CLOUDFLARE_API_TOKEN  --repo joeblew999/plat-trunk
printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | gh secret set CLOUDFLARE_ACCOUNT_ID --repo joeblew999/plat-trunk
printf '%s' "$GITHUB_TOKEN"          | gh secret set GITHUB_TOKEN          --repo joeblew999/plat-trunk
echo "✓ secrets synced to GitHub Actions"
"""

[tasks."secrets:list"]
description = "List secrets in Doppler + GitHub Actions"
run = """
echo "── Doppler (plat-trunk/dev) ─────────────────────────────────────"
doppler secrets --project plat-trunk --config dev
echo "── GitHub Actions ───────────────────────────────────────────────"
gh secret list --repo joeblew999/plat-trunk
"""

[tasks."secrets:rotate"]
description = "Print rotation URLs — update value in Doppler, then run secrets:set"
run = """
echo "── Rotation steps ───────────────────────────────────────────────"
echo " 1. Rotate the token at the provider:"
echo "    Cloudflare:  https://dash.cloudflare.com/profile/api-tokens"
echo "    GitHub:      https://github.com/settings/tokens"
echo " 2. Update value in Doppler dashboard:"
echo "    https://dashboard.doppler.com/workplace/plat-trunk/configs/dev"
echo " 3. mise run secrets:set   (syncs to GitHub Actions)"
echo " 4. Revoke old token at provider"
echo "────────────────────────────────────────────────────────────────"
"""

# ── Repo visibility ───────────────────────────────────────────────────────────

# ── Docs ──────────────────────────────────────────────────────────────────────

[tasks."docs:sync"]
description = "Copy lib/*/docs/ into VitePress docs/libs/ + push to utm-dev — incremental via sources/outputs"
sources = ["lib/*/docs/**/*.md"]
outputs = ["systems/docs/website/docs/libs/**/*.md"]
run = """
mkdir -p systems/docs/website/docs/libs/billing
cp -r lib/billing/docs/. systems/docs/website/docs/libs/billing/
echo "✓ docs:sync complete"

# Also sync into utm-dev if it's checked out alongside
UTM_DEV=${UTM_DEV:-../utm-dev}
if [ -d "$UTM_DEV" ]; then
  mkdir -p "$UTM_DEV/docs/web"
  cp -r systems/docs/website/docs/. "$UTM_DEV/docs/web/"
  echo "✓ synced to utm-dev at $UTM_DEV/docs/web/"
fi
"""

[tasks."docs:dev"]
description = "Sync lib docs then start VitePress dev server"
depends = ["docs:sync"]
run = "mise --cd systems/docs run dev"

[tasks."docs:build"]
description = "Sync lib docs then build VitePress site"
depends = ["docs:sync"]
run = "mise --cd systems/docs run build"

# ── Repo visibility ───────────────────────────────────────────────────────────

[tasks."repo:public"]
description = "Pre-flight secret scan then make repo public (enables free GitHub Actions CI)"
run = '''
FOUND=$(git grep -l "ghp_\|CLOUDFLARE_ACCOUNT_ID.*=.*[0-9a-f]\{32\}\|CLOUDFLARE_API_TOKEN.*=.*[A-Za-z0-9]\{40\}" \
  -- . ':!.mise.local.toml.example' ':!.gitignore' 2>/dev/null || true)
if [ -n "$FOUND" ]; then
  echo "ERROR: potential secrets found in tracked files:"
  echo "$FOUND"
  echo "Fix before going public."
  exit 1
fi
echo "✓ no secrets in tracked files"
gh repo edit joeblew999/plat-trunk --visibility public --accept-visibility-change-consequences
echo "✓ repo is now public"
'''

[tasks."repo:private"]
description = "Make repo private"
run = "gh repo edit joeblew999/plat-trunk --visibility private"
