# wrangler.toml
name = "plat-trunk-api"
main = "src/index.ts"
compatibility_date = "2025-11-01"  # Required for automatic tracing beta

# ─── CF-native Observability ────────────────────────────────────────────────
[observability]
enabled = true                  # Enables Workers Logs (structured JSON, auto-indexed)
head_sampling_rate = 1          # 100% in prod; drop to 0.1 for high-volume workers

[observability.logs]
invocation_logs = true          # Per-request invocation envelope (method, status, duration)

[observability.traces]
enabled = true                  # Automatic tracing (open beta, Nov 2025+)
head_sampling_rate = 1          # Trace every request; adjust for cost control

# ─── Per-environment overrides ───────────────────────────────────────────────
[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.traces]
enabled = true
head_sampling_rate = 1

[env.production.observability]
enabled = true
head_sampling_rate = 0.1        # 10% sampling in high-volume production

[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.05       # 5% trace sampling in production

# ─── Bindings ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "plat-trunk"
database_id = "<YOUR_D1_ID>"

[[kv_namespaces]]
binding = "KV"
id = "<YOUR_KV_ID>"
