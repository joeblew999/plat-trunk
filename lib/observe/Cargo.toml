[workspace]
resolver = "2"

members = [
    "crate",
    "demo-tauri/src-tauri",
]

[workspace.dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1.0"
wasm-bindgen = "0.2.106"
ts-rs        = { version = "10", features = ["serde-compat"] }
schemars     = { version = "0.8", features = ["derive"] }

[profile.release]
opt-level = "s"

[profile.dev]
panic = "unwind"
