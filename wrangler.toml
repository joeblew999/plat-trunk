# ───────────────────────────────────────────────────────
# plat-router — Root router worker
# ───────────────────────────────────────────────────────
#
# Entry point for ALL traffic. Routes requests to sub-workers:
#
#   /auth/*  → AUTH         (auth-worker, port 8790 in dev)
#   /docs/*  → DOCS_ASSETS  (VitePress static files via binding)
#   /test/*  → TEST         (test-worker, port 5175 in dev)
#   /*       → TRUCK        (truck-cad, port 8789 in dev)
#
# Dev:  bun run dev  → http://localhost:8788
# Prod: https://cad.ubuntusoftware.net
# ───────────────────────────────────────────────────────

name = "plat-router"
main = "src/router.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

routes = [
  { pattern = "cad.ubuntusoftware.net", custom_domain = true },
]

# VitePress docs — run_worker_first = true ensures router code handles ALL requests.
# Without it, assets auto-serve at / which conflicts with truck-cad.
# Build: bun run build:docs → systems/docs/website/.vitepress/dist
[assets]
directory = "systems/docs/website/.vitepress/dist"
binding = "DOCS_ASSETS"
not_found_handling = "none"
run_worker_first = true

# Sub-worker service bindings (auto-discover in dev)
[[services]]
binding = "AUTH"
service = "auth-worker"

[[services]]
binding = "TRUCK"
service = "truck-cad"

[[services]]
binding = "AI"
service = "plat-ai"
optional = true

[[services]]
binding = "TEST"
service = "test-worker"

# ─── CF-native Observability ────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.05

[dev]
ip = "0.0.0.0"
port = 8788
inspector_port = 9229
local_protocol = "http"
