# ───────────────────────────────────────────────────────
# plat-router — Root router worker
# ───────────────────────────────────────────────────────
#
# Entry point for ALL traffic. Routes requests to sub-workers:
#
#   /docs/*  → DOCS_ASSETS  (VitePress static files, served directly)
#   /test/*  → TEST         (test-worker, port 5175 in dev)
#   /*       → TRUCK        (truck-cad, port 8789 in dev)
#
# Dev:  bun run dev  → http://localhost:8788
# Prod: https://cad.ubuntusoftware.net
# ───────────────────────────────────────────────────────

name = "plat-router"
main = "src/router.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

routes = [
  { pattern = "cad.ubuntusoftware.net", custom_domain = true },
]

# VitePress docs — explicit binding mode (worker code fetches, NOT auto-served)
# Build: bun run build:docs → systems/docs/website/.vitepress/dist
[assets]
directory = "systems/docs/website/.vitepress/dist"
binding = "DOCS_ASSETS"
not_found_handling = "none"

# Sub-worker service bindings (auto-discover in dev)
[[services]]
binding = "TRUCK"
service = "truck-cad"

[[services]]
binding = "TEST"
service = "test-worker"

[dev]
ip = "0.0.0.0"
port = 8788
inspector_port = 9229
local_protocol = "http"
